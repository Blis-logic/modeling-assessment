  if(!isNum(S.p)||!isNum(S.q)||+S.q<=+S.p) return `<div class="empty-note">구간 시작 p와 끝 q를 넣으세요 (p &lt; q).</div>`;
  const p=+S.p, q=+S.q, W=640,H=330,L=52,R=14,Tp=14,B=36;
  const x1=p, x2=q;   // 가로축은 학생이 정한 구간만 보여 줍니다
  const dx=(q-p)/S.n, off=S.pos==="right"?1:S.pos==="mid"?.5:0, hs=[...Array(S.n)].map((_,i)=>fval(m,p+(i+off)*dx));
  const vs=[]; for(let i=0;i<=300;i++){ const v=fval(m,x1+(x2-x1)*i/300); if(isFinite(v)) vs.push(v); }
  let ys=vs.concat(hs.filter(isFinite),[0]).sort((a,b)=>a-b); let y1=ys[Math.floor(ys.length*.02)], y2=ys[Math.ceil(ys.length*.98)-1]; y1=Math.min(y1,0); y2=Math.max(y2,0); if(y1===y2) y2+=1; const yp=(y2-y1)*.1; y1-=yp; y2+=yp; const span=y2-y1;
  const sx=x=>L+(x-x1)/(x2-x1)*(W-L-R), sy=y=>Tp+(y2-y)/(y2-y1)*(H-Tp-B);
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="구분구적법 그래프"><defs><clipPath id="cprm"><rect x="${L}" y="${Tp}" width="${W-L-R}" height="${H-Tp-B}"/></clipPath></defs>`;
  ticks(x1,x2,8).forEach(v=>{ const X=sx(v); g+=`<line class="gl" x1="${X}" x2="${X}" y1="${Tp}" y2="${H-B}"/><text x="${X}" y="${H-B+14}" text-anchor="middle">${fmt(v,3)}</text>`; });
  ticks(y1,y2,5).forEach(v=>{ const Y=sy(v); g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y}" y2="${Y}"/><text x="${L-6}" y="${Y+4}" text-anchor="end">${fmt(v,3)}</text>`; });
  g+=`<line class="zero" x1="${L}" x2="${W-R}" y1="${sy(0)}" y2="${sy(0)}"/>`;
  hs.forEach((h,i)=>{ if(!isFinite(h)) return; const a=sx(p+i*dx), b=sx(p+(i+1)*dx), Y=sy(h), Z=sy(0); g+=`<rect class="${h>=0?"rr":"rn"}" x="${a.toFixed(1)}" y="${Math.min(Y,Z).toFixed(1)}" width="${Math.max(.5,b-a).toFixed(1)}" height="${Math.max(.5,Math.abs(Y-Z)).toFixed(1)}" clip-path="url(#cprm)"/>`; });
  let d="",prev=null; for(let i=0;i<=480;i++){ const x=x1+(x2-x1)*i/480, v=fval(m,x); if(!isFinite(v)||Math.abs(v-(y1+y2)/2)>span*4||(prev!=null&&Math.abs(v-prev)>span*1.2)){ prev=isFinite(v)?v:null; if(isFinite(v)) d+=`M${sx(x).toFixed(1)},${sy(v).toFixed(1)}`; continue; } d+=(prev==null?"M":"L")+sx(x).toFixed(1)+","+sy(v).toFixed(1); prev=v; }
  g+=`<path class="${S.m==="A"?"ca":"cb"}" d="${d}" clip-path="url(#cprm)"/>`;
  [p,q].forEach((v,i)=>{ g+=`<line class="mk" x1="${sx(v)}" x2="${sx(v)}" y1="${Tp}" y2="${H-B}"/><text class="mkt" x="${sx(v)+(i?-4:4)}" y="${Tp+11}" text-anchor="${i?"end":"start"}">${i?"q":"p"}=${fmt(v,3)}</text>`; });

/** "$1.03$", "\\frac{3}{4}", "-2.5" 같은 칸 값 → 숫자 (아니면 NaN) */

  const im=new Image(); im.onload=()=>{ try{ const cv=document.createElement("canvas"); cv.width=1280; cv.height=640; cv.getContext("2d").drawImage(im,0,0,1280,640); res(cv.toDataURL("image/png").split(",")[1]); }catch(e){ res(""); } };
  im.onerror=()=>res(""); im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s); }); }
/** 문서(구글 문서)를 만들거나 갱신합니다. pdf=true 이면 PDF(base64)도 받아 옵니다. 교사는 id로 학생을 지정합니다. */
async function makeDoc(doc,id,pdf,acct){ const {spec,svgs}=buildSpec(doc,acct), images=await Promise.all(svgs.map(svgToPng));

  if(texs.length){ try{ const m=await MathTool.toImages(texs); spec.math={}; Object.keys(m).forEach(tex=>{ spec.math[tex]={i:images.length,w:m[tex].w,h:m[tex].h}; images.push(m[tex].b64); }); }catch(e){} }

  const pl=document.getElementById("pdfLink"); if(pl) pl.innerHTML=`<a href="${url}" download="${esc(name)}" target="_blank" rel="noopener">내려받기가 시작되지 않으면 여기를 누르세요</a>`; }

/* ───────── 활동 시간 기록 ─────────
 * 탐구 시간: 화면이 보이고 2분 안에 움직임(누르기·입력·스크롤)이 있었던 시간
 * 입력 시간: 1분 안에 글·수식을 입력한 시간
 * 활동 없음: 2분 넘게 움직임이 없으면 1회로 세고, 그동안의 시간을 따로 기록합니다(30분이 넘으면 기록을 멈춤). */
const ACT_TICK=15000, IDLE_MS=120000, INPUT_MS=60000;
let lastAct=Date.now(), lastInput=0, wasIdle=false, actChanged=false, lastMove=0;
function actMark(e){ lastAct=Date.now(); if(e&&(e.type==="input"||e.type==="keydown")) lastInput=lastAct; }
["pointerdown","keydown","input","wheel","touchstart","scroll"].forEach(t=>document.addEventListener(t,actMark,{passive:true,capture:true}));
document.addEventListener("pointermove",e=>{ const n=Date.now(); if(n-lastMove>5000){ lastMove=n; actMark(e); } },{passive:true});
function actTick(){ if(!ME||ME.role!=="student"||view!=="student"||cfg.locked) return;
  const now=Date.now(), A=me.act||(me.act={explore:0,input:0,st:{},days:{},log:[],idleN:0,idleSec:0}), sec=ACT_TICK/1000;
  const vis=document.visibilityState==="visible", active=vis&&now-lastAct<IDLE_MS, typing=vis&&now-lastInput<INPUT_MS;
  if(!active&&now-lastAct>30*60000) return;
  let s=A.log[A.log.length-1]; if(!s||now-s.e>10*60000){ s={s:now,e:now,x:0,i:0,n:0,d:0}; A.log.push(s); if(A.log.length>40) A.log.splice(0,A.log.length-40); }
  s.e=now;
  if(active){ A.explore+=sec; s.x+=sec; A.st[stage]=(A.st[stage]||0)+sec; const d=dayKey(); A.days[d]=(A.days[d]||0)+sec; if(typing){ A.input+=sec; s.i+=sec; } wasIdle=false; }
  else { if(!wasIdle){ s.n++; A.idleN=(A.idleN||0)+1; wasIdle=true; } s.d+=sec; A.idleSec=(A.idleSec||0)+sec; }
  actChanged=true;
  if(stage<0){ const d=app.querySelector('[data-out="dash"]'); if(d){ d.innerHTML=dashHTML(me); mathPass(d); } } }
setInterval(actTick,ACT_TICK);
// 시간 기록만 바뀐 경우: 1분마다 저장(구글 문서는 다시 만들지 않음)
setInterval(()=>{ if(actChanged&&ME&&ME.role==="student"&&!locked()){ actChanged=false; dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush,1500); } },60000);

function syncGrid(){ const g=me.data.grid||[], xs=[], ys=[];
  while(g.length&&!String(g[g.length-1][0]).trim()&&!String(g[g.length-1][1]).trim()) g.pop();
  g.forEach((r,i)=>{ let x=String(r[0]??"").trim(); const y=String(r[1]??"").trim(); if(y==="") return;
    if(x===""){ const p=predX(g,i); x=p===""?String(i+1):p; r[0]=x; } xs.push(x); ys.push(y); });
  me.data.xs=xs.join("\n"); me.data.ys=ys.join("\n"); }

function dgInput(t){ const r=+t.dataset.r, c=+t.dataset.c, g=me.data.grid||(me.data.grid=gridRows(me));
  while(g.length<=r) g.push(["",""]); g[r][c]=t.value.trim();
  if(c===1&&g[r][1]!==""&&!String(g[r][0]).trim()){ const p=predX(g,r); g[r][0]=p===""?String(r+1):p; const xi=t.closest("tr").querySelector('[data-c="0"]'); if(xi) xi.value=g[r][0]; }
  const tb=gridEl(), need=Math.max(g.length+1,DATA_GOAL+1)+dgExtra;
  if(tb&&tb.rows.length<need) for(let i=tb.rows.length;i<need;i++) tb.insertAdjacentHTML("beforeend",dgRowHTML(i,["",""],false,g));
  if(tb) tb.querySelectorAll('[data-c="0"]').forEach(x=>{ if(!x.value){ const p=predX(g,+x.dataset.r); x.placeholder=p===""?" ":p; } });
  afterGrid(); }

app.addEventListener("keydown",e=>{ const t=e.target; if(!t.closest||!t.closest("[data-grid]")) return; const r=+t.dataset.r, c=+t.dataset.c;

    let nx=gridEl().querySelector(`[data-r="${r+1}"][data-c="${c}"]`); if(!nx){ dgExtra++; redrawGrid(); nx=gridEl().querySelector(`[data-r="${r+1}"][data-c="${c}"]`); } if(nx) nx.focus(); }
  else if(e.key==="ArrowUp"&&r>0){ e.preventDefault(); const pv=gridEl().querySelector(`[data-r="${r-1}"][data-c="${c}"]`); if(pv) pv.focus(); } });

/* ───────── 파일·사진 올리기 ───────── */
const fileCache={};
function pickFile(accept,cb){ const i=document.createElement("input"); i.type="file"; i.accept=accept; i.onchange=()=>{ if(i.files&&i.files[0]) cb(i.files[0]); }; i.click(); }
const blobB64=b=>new Promise((ok,no)=>{ const fr=new FileReader(); fr.onload=()=>ok(String(fr.result).split(",")[1]); fr.onerror=no; fr.readAsDataURL(b); });
/** 연습장 사진을 흑백으로 바꿔 50KB 이하 JPEG로 줄입니다(긴 변 최대 1400px에서 시작해 화질·크기를 낮춰 가며). */
async function compressPhoto(file){
  let src; try{ src=await createImageBitmap(file,{imageOrientation:"from-image"}); }catch(e){ src=await new Promise((ok,no)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=()=>no({error:"BAD_FILE"}); im.src=URL.createObjectURL(file); }); }
  const W0=src.width, H0=src.height; let side=Math.min(1400,Math.max(W0,H0));
  for(let t=0;t<14;t++){ const k=side/Math.max(W0,H0), w=Math.max(1,Math.round(W0*k)), h=Math.max(1,Math.round(H0*k));
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,w,h);
    cx.filter="grayscale(1) contrast(1.25) brightness(1.05)"; cx.drawImage(src,0,0,w,h);
    for(const q of [0.75,0.62,0.5,0.4,0.32]){ const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",q)); if(b&&b.size<=50*1024) return {b64:await blobB64(b),size:b.size,w,h}; }
    side=Math.round(side*0.82); if(side<260) break; }
  throw {error:"BIG_FILE"}; }
function uploadPhoto(key){ pickFile("image/*",async file=>{
  try{ setSave("wait","사진을 50KB 이하로 줄이는 중…"); const c=await compressPhoto(file);
    setSave("wait",`사진 올리는 중… (${kb(c.size)})`); const r=await api("upload",{kind:"photo",key,b64:c.b64});
    me.photos=me.photos||{}; me.photos[key]=Object.assign({},r.file,{w:c.w,h:c.h}); fileCache[r.file.id]="data:image/jpeg;base64,"+c.b64;
    scheduleSave(); renderStudent.keepScroll=true; renderStudent(); setSave("ok",`풀이 사진을 올렸습니다 (${kb(c.size)})`); }
  catch(e){ setSave("err",errMsg(e)); } }); }
function uploadData(){ pickFile(".xlsx,.xls,.csv,.txt,.pdf,.png,.jpg,.jpeg,.hwp,.hwpx",async file=>{
  if(file.size>10*1024*1024){ setSave("err","10MB 이하 파일만 올릴 수 있습니다"); return; }
  try{ setSave("wait","원본 자료를 올리는 중…"); const r=await api("upload",{kind:"data",name:file.name,mime:file.type,b64:await blobB64(file)});
    me.files=me.files||{}; me.files.data=r.file; scheduleSave(); updateOutputs(app,me); setSave("ok",`원본 자료를 '${r.file.name}'(으)로 저장했습니다`); }
  catch(e){ setSave("err",errMsg(e)); } }); }
function loadPhotos(root,owner){ root.querySelectorAll("[data-fimg]").forEach(el=>{ const id=el.dataset.fimg, show=()=>document.querySelectorAll(`[data-fimg="${id}"]`).forEach(e=>e.innerHTML=`<img src="${fileCache[id]}" alt="연습장 풀이 사진">`);

  tipBox.hidden=false; const r=el.getBoundingClientRect(), bw=Math.min(340,innerWidth-24); tipBox.style.maxWidth=bw+"px";
  tipBox.style.left=Math.min(Math.max(12,r.left),innerWidth-bw-12)+"px"; tipBox.style.top=(r.bottom+8)+"px";

    return `<tr><td class="num">${esc(a.id)}</td><td>${a.role==="teacher"?'<span class="pill graded">교사</span>':"학생"}</td><td class="num">${esc(a.sid)}</td><td>${esc(a.name)}</td><td class="sub">${ago(a.created)}</td><td class="sub">${ago(a.lastLogin)}</td>
    <td>${a.mustChange?'<span class="pill live">초기화됨 · 바꾸기 전</span>':'<span class="sub">학생이 정함</span>'}</td>
    <td style="white-space:normal;min-width:220px">${a.id===ME.id?'<span class="sub">내 계정</span>':pend&&accPending.kind==="reset"?`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><input id="acc_pw" class="num" placeholder="임시 비밀번호 (4자 이상)" style="border:1px solid var(--line);border-radius:5px;padding:3px 6px;background:var(--fill);min-width:0;flex:1 1 120px"><button class="btn pri" type="button" data-act="accResetGo" data-id="${esc(a.id)}">초기화</button><button class="btn" type="button" data-act="accCancel">취소</button></div><div class="sub" id="accErr" style="color:var(--bad)"></div>`
      :pend&&accPending.kind==="del"?`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="sub">계정과 활동지 기록이 모두 지워집니다.</span><button class="btn danger" type="button" data-act="accDelGo">지우기</button><button class="btn" type="button" data-act="accCancel">취소</button></div><div class="sub" id="accErr" style="color:var(--bad)"></div>`
      :`<button class="btn" type="button" data-act="accReset" data-id="${esc(a.id)}">비밀번호 초기화</button> <button class="btn" type="button" data-act="accDel" data-id="${esc(a.id)}">삭제</button>`}</td></tr>`; }).join("")}</tbody></table></div>`;
  const pw=document.getElementById("acc_pw"); if(pw) pw.focus(); }
async function loadShare(note){ try{ share=await api("driveInfo"); renderShare(note); }catch(e){ const b=document.getElementById("shareBox"); if(b) b.innerHTML=`<div class="banner bad">${esc(errMsg(e))}</div>`; } }
function renderShare(note){ const b=document.getElementById("shareBox"); if(!b||!share) return; const mails=new Set(share.editors.map(x=>x.toLowerCase()));
  b.innerHTML=`${note?`<div class="banner info" style="margin:0 0 10px">${esc(note)}</div>`:""}
  <div class="sharebox"><h3>학생 결과물 공유 폴더</h3>
    <p class="sub" style="margin:0">학생이 쓰는 내용은 20초쯤 뒤 이 폴더의 학생별 구글 문서(활동지 서식)로 반영됩니다. 교사로 가입하면서 쓴 이메일은 자동으로 이 폴더를 공유받고, 아래에서 더 초대할 수도 있습니다.</p>
    <div class="row2"><a class="btn" style="text-decoration:none" href="${esc(share.url)}" target="_blank" rel="noopener">폴더 열기 ↗</a><span class="sub">소유자: ${esc(share.owner||"–")}</span></div>
    <b style="font-size:14px">폴더를 공유받은 계정 (편집 가능)</b><ul>${share.editors.length?share.editors.map(x=>`<li>${esc(x)}</li>`).join(""):"<li>소유자 외에는 없습니다</li>"}</ul>
    <b style="font-size:14px">가입한 교사</b><ul>${share.teachers.map(t=>`<li>${esc(t.name||t.id)} (${esc(t.id)}) · ${t.email?esc(t.email)+(mails.has(t.email.toLowerCase())?" ✓ 공유됨":" · 아직 공유 안 됨"):"이메일 없음 (아래에 내 이메일을 넣고 공유하세요)"}</li>`).join("")}</ul>
    <div class="row2"><input id="shareEm" type="email" placeholder="초대할 구글 계정 이메일" aria-label="초대할 이메일"><button class="btn pri" type="button" data-act="shareGo">폴더 공유하기</button><label class="toggle"><input type="checkbox" id="shareSelf"> 내 계정 이메일로도 기록</label></div>
    <div class="sub" id="shareErr" style="color:var(--bad)"></div></div>
  <div class="sharebox"><h3>학생 문서 한꺼번에 만들기</h3>
    <p class="sub" style="margin:0">학생이 로그인해서 쓰면 문서는 자동으로 만들어집니다. 이미 써 둔 내용의 문서가 아직 없을 때, 또는 지금 상태로 모두 새로 맞추고 싶을 때 누릅니다. 학생 한 명에 10~30초쯤 걸립니다.</p>
    <div class="row2"><button class="btn pri" type="button" data-act="docAll">모든 학생 문서 만들기·갱신</button><span class="sub" id="bulkMsg"></span></div></div>`; }
async function docAll(btn){ const ids=[...roster.keys()].filter(id=>roster.get(id).doc), msg=document.getElementById("bulkMsg"); btn.disabled=true; let ok=0,bad=0;
  for(let k=0;k<ids.length;k++){ const id=ids[k], s=roster.get(id); if(msg) msg.textContent=`${k+1} / ${ids.length} 만드는 중… (${s.name||id})`;
    try{ const r=await makeDoc(s.doc,id,false,{sid:s.sid,name:s.name}); docs[id]={url:r.url,at:r.docAt}; ok++; }catch(e){ bad++; if(e.error==="SESSION") break; } }
  const m2=document.getElementById("bulkMsg"); if(m2) m2.textContent=`완료: ${ok}명 반영${bad?`, ${bad}명 실패(다시 눌러 보세요)`:""}${ids.length?"":"  쓴 내용이 있는 학생이 없습니다"}`; const b2=document.querySelector('[data-act="docAll"]'); if(b2) b2.disabled=false; }
function updTotal(){ const sc=gradeDraft.scores; const tot=[1,2,3,4].reduce((s,i)=>s+(isNum(sc["s"+i])?+sc["s"+i]:0),0); const e=document.getElementById("gTot"); if(e) e.textContent=tot; const m=document.getElementById("gMsg"); if(m) m.textContent="저장하지 않은 변경이 있습니다"; }
app.addEventListener("click",e=>{ if(view!=="teacher"||!ME) return; const tr=e.target.closest("tr[data-sel]"); if(tr) selectStudent(tr.dataset.sel); },true);
app.addEventListener("input",e=>{ if(view!=="teacher"||!ME) return; const t=e.target;
  if(t.id==="rq"){ rFilter=t.value; renderRoster(); return; }
  if(!gradeDraft) return;
  if(t.dataset.gs){ const v=t.value===""?"":Math.max(0,Math.min(10,+t.value)); gradeDraft.scores[t.dataset.gs]=v; gradeDirty=true; t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(String(v)===b.dataset.v))); updTotal(); }
  else if(t.dataset.gn){ gradeDraft.notes[t.dataset.gn]=t.value; gradeDirty=true; updTotal(); }
  else if(t.dataset.go2){ gradeDraft.overall=t.value; gradeDirty=true; updTotal(); } });
app.addEventListener("change",e=>{ if(view!=="teacher"||!ME) return; const t=e.target;
  if(t.id==="rs"){ rStatus=t.value; renderRoster(); }
  if(t.id==="lockT") api("setConfig",{locked:t.checked}).then(r=>{ cfg=Object.assign(cfg,r.config); }).catch(x=>{ t.checked=!t.checked; alertMsg(errMsg(x)); });
  if(t.id==="g_rel"&&gradeDraft){ gradeDraft.released=t.checked; gradeDirty=true; updTotal(); } });
async function saveGrade(){ if(!sel||!gradeDraft) return; const m=document.getElementById("gMsg"); if(m) m.textContent="저장하는 중…";
  try{ const r=await api("saveGrade",{id:sel,grade:JSON.parse(JSON.stringify(gradeDraft))}); gradeDraft.updatedAt=r.updatedAt; grades[sel]=JSON.parse(JSON.stringify(gradeDraft)); gradeDirty=false; if(m) m.textContent="저장했습니다"; renderRoster(); }
  catch(e){ if(m) m.textContent=errMsg(e); } }

/* ───────── 화면 전환 · 시작 ───────── */
function setView(v){ if(view==="student") flush(); view=v; document.getElementById("roleT").setAttribute("aria-pressed",String(v==="teacher")); document.getElementById("roleS").setAttribute("aria-pressed",String(v==="student"));
  if(v==="teacher") renderTeacher(); else renderStudent(); }
document.getElementById("roleT").onclick=()=>setView("teacher");
document.getElementById("roleS").onclick=()=>setView("student");
function measureTop(){ document.documentElement.style.setProperty("--toph",document.getElementById("top").offsetHeight+"px"); }
window.addEventListener("resize",measureTop); measureTop();
async function boot(){
  try{ const r=await api("config"); cfg=Object.assign(cfg,r.config||{}); }
  catch(e){ app.innerHTML=`<div class="banner bad" style="margin-top:24px"><b>${esc(errMsg(e))}</b><br><span class="sub">선생님 확인 사항: ① config.js의 apiUrl이 /exec로 끝나는 웹 앱 주소인지 ② 구글 Apps Script 배포의 액세스 권한이 '모든 사용자'인지 ③ 학교 Workspace 계정이 외부 접근을 막고 있지 않은지</span></div>`; setSave("err","연결 안 됨"); return; }
  if(TOKEN){ try{ await loadMe(); return; }catch(e){ setToken(null); } }
  renderAuth(); }
boot();

</script>
