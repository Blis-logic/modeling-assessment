<script>
/* 수식 입력기: 수식 키보드(MathLive) · 손글씨 인식 · 수식 미리보기 · 문서용 수식 그림(MathJax SVG)
 * 활동지 칸에는 수식이 $LaTeX$ 형태로 저장됩니다. 화면은 이 표기를 찾아 수식으로 그려 보여 줍니다.
 * 손글씨 판은 "기호 그리기"입니다. 그린 모양을 여러 글꼴로 그린 기호 견본과 비교해 비슷한 기호를 찾습니다(인터넷·AI 없이 이 기기 안에서).
 * window.MathTool.open(field, {index, mode}) / render(text) / renderInto(el, text) / toImages(latexList)
 */
(function () {
  "use strict";
  const ML_VER = "0.110.0", MJ_VER = "3.2.2";
  const ML_BASE = `https://cdn.jsdelivr.net/npm/mathlive@${ML_VER}/`;
  const MJ_URL = `https://cdn.jsdelivr.net/npm/mathjax@${MJ_VER}/es5/tex-svg.js`;
  const TOKEN = /\$([^$\n]+?)\$/g;

  /* ───── 라이브러리 불러오기 (필요할 때 한 번만) ───── */
  const loaded = {};
  function loadScript(url) {
    if (!loaded[url]) loaded[url] = new Promise((ok, no) => {
      const s = document.createElement("script"); s.src = url; s.async = true; s.crossOrigin = "anonymous";
      s.onload = ok; s.onerror = () => { delete loaded[url]; no(new Error("수식 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.")); };
      document.head.appendChild(s);
    });
    return loaded[url];
  }
  function loadCss(url) { if (document.querySelector(`link[href="${url}"]`)) return; const l = document.createElement("link"); l.rel = "stylesheet"; l.href = url; document.head.appendChild(l); }
  function loadMathLive() {
    loadCss(ML_BASE + "mathlive-static.css"); loadCss(ML_BASE + "mathlive-fonts.css");
    return loadScript(ML_BASE + "mathlive.min.js").then(() => window.MathLive);
  }
  function loadMathJax() {
    if (!window.MathJax || !window.MathJax.tex2svgPromise) {
      if (!window.MathJax) window.MathJax = { startup: { typeset: false }, svg: { fontCache: "none" }, tex: { packages: { "[+]": ["ams"] } } };
    }

  }

  /* ───── 글 속 $수식$ 찾기 ───── */
  function tokens(text) { const out = []; String(text || "").replace(TOKEN, (m, tex, at) => { out.push({ tex: tex.trim(), start: at, end: at + m.length }); return m; }); return out; }
  function hasMath(text) { TOKEN.lastIndex = 0; return TOKEN.test(String(text || "")); }
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /** 글을 HTML로 바꿉니다. 수식은 MathLive가 이미 불러와져 있을 때만 그림으로, 아니면 글자로 둡니다. */
  function render(text) {
    const ML = window.MathLive; let out = "", last = 0; const s = String(text || "");

      last = t.end;
    });

  }
  function renderInto(el, text) {
    if (!el) return;
    if (!hasMath(text)) { el.textContent = text || ""; return; }

  }

  /* ───── 문서용 수식 그림: LaTeX → PNG(base64). 크기는 10pt 글자 기준 픽셀(96dpi) ───── */
  const EX_PX = 6.67, SCALE = 4;
  async function toImages(list, color) {
    const uniq = [...new Set(list.filter(Boolean))]; const out = {};
    if (!uniq.length) return out;
    const MJ = await loadMathJax();
    for (const tex of uniq) {
      try {
        const node = await MJ.tex2svgPromise(tex, { display: false });
        const svg = node.querySelector("svg"); if (!svg || node.querySelector("[data-mjx-error]")) continue;
        const wEx = parseFloat(svg.getAttribute("width")), hEx = parseFloat(svg.getAttribute("height"));
        if (!(wEx > 0 && hEx > 0)) continue;
        svg.setAttribute("color", color || "#18272B"); svg.style.color = color || "#18272B";
        const W = Math.ceil(wEx * EX_PX * SCALE), H = Math.ceil(hEx * EX_PX * SCALE);
        svg.setAttribute("width", W); svg.setAttribute("height", H);
        const src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(svg));
        const img = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; });
        const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
        const cx = cv.getContext("2d"); cx.drawImage(img, 0, 0, W, H);
        out[tex] = { b64: cv.toDataURL("image/png").split(",")[1], w: +(wEx * EX_PX).toFixed(1), h: +(hEx * EX_PX).toFixed(1) };
      } catch (e) { /* 그리지 못한 수식은 문서에 글자로 남습니다 */ }
    }
    return out;
  }

  /* ───── 수식 키보드 배치 (mathkeyboards.com 처럼 갈래별 탭) ───── */
  // [보이는 글자, 넣을 LaTeX, 넓이(선택)]  #0·#? = 빈칸, #@ = 앞의 식을 감싸기
  const KEYS = {
    "기본": [
      ["a/b", "\\frac{#@}{#?}"], ["x²", "#@^2"], ["xⁿ", "#@^{#?}"], ["xₙ", "#@_{#?}"], ["√", "\\sqrt{#0}"], ["ⁿ√", "\\sqrt[#?]{#0}"],
      ["( )", "\\left(#0\\right)"], ["|x|", "\\left|#0\\right|"], ["[ ]", "\\left[#0\\right]"], ["π", "\\pi"], ["∞", "\\infty"], ["°", "^{\\circ}"],
      ["+", "+"], ["−", "-"], ["×", "\\times"], ["÷", "\\div"], ["·", "\\cdot"], ["±", "\\pm"],
      ["=", "="], ["≠", "\\ne"], ["≈", "\\approx"], ["<", "<"], [">", ">"], ["≤", "\\le"], ["≥", "\\ge"], ["%", "\\%"]
    ],
    "삼각함수": [
      ["sin", "\\sin"], ["cos", "\\cos"], ["tan", "\\tan"], ["sec", "\\sec"], ["csc", "\\csc"], ["cot", "\\cot"],
      ["sin²", "\\sin^2"], ["cos²", "\\cos^2"], ["sec²", "\\sec^2"], ["arctan", "\\arctan"], ["sin⁻¹", "\\sin^{-1}"], ["tan⁻¹", "\\tan^{-1}"],
      ["θ", "\\theta"], ["φ", "\\varphi"], ["α", "\\alpha"], ["β", "\\beta"], ["ω", "\\omega"], ["π", "\\pi"],
      ["sin(u+φ)", "\\sin\\left(#0+\\varphi\\right)", 2], ["2 sin u cos u", "2\\sin u\\cos u", 2], ["R=√(a²+e²)", "R=\\sqrt{a^2+e^2}", 2]
    ],
    "미적분": [
      ["f(x)", "f(x)"], ["f′(x)", "f'(x)"], ["f″(x)", "f''(x)"], ["dy/dx", "\\frac{dy}{dx}"], ["d/dx", "\\frac{d}{dx}"], ["′", "'"],
      ["lim", "\\lim_{#?\\to#?}"], ["→", "\\to"], ["∫", "\\int #0\\,dx"], ["∫ₐᵇ", "\\int_{#?}^{#?}#0\\,dx"], ["[F]ₐᵇ", "\\left[#0\\right]_{#?}^{#?}"], ["dx", "\\,dx"],
      ["ln", "\\ln"], ["log", "\\log"], ["eˣ", "e^{#0}"], ["Σ", "\\sum_{#?}^{#?}"], ["Δ", "\\Delta"], ["|  |", "\\left|#0\\right|"],

    ],

      ["a csc(b(x−c))+d", "a\\csc\\left(b(x-c)\\right)+d", 3], ["a arctan(b(x−c))+d", "a\\arctan\\left(b(x-c)\\right)+d", 3],
      ["a sin u + e cos u", "a\\sin u+e\\cos u", 3], ["a sin u + e sin 2u", "a\\sin u+e\\sin 2u", 3],
      ["a sin²u + d", "a\\sin^2 u+d", 3], ["오차율", "\\frac{\\left|y-f(x)\\right|}{\\left|y\\right|}\\times100", 3]
    ],
    "문자·기호": [
      ["x", "x"], ["y", "y"], ["a", "a"], ["b", "b"], ["c", "c"], ["d", "d"], ["e", "e"], ["g", "g"], ["p", "p"], ["q", "q"], ["t", "t"], ["u", "u"],
      ["α", "\\alpha"], ["β", "\\beta"], ["γ", "\\gamma"], ["δ", "\\delta"], ["λ", "\\lambda"], ["μ", "\\mu"], ["σ", "\\sigma"], ["Ω", "\\Omega"],
      ["∴", "\\therefore"], ["∵", "\\because"], ["⇒", "\\Rightarrow"], ["⇔", "\\Leftrightarrow"], ["∈", "\\in"], ["글자", "\\text{#0}"]
    ],
    "숫자": [
      ["7", "7"], ["8", "8"], ["9", "9"], ["÷", "\\div"], ["(", "("], [")", ")"],
      ["4", "4"], ["5", "5"], ["6", "6"], ["×", "\\times"], ["x", "x"], ["y", "y"],
      ["1", "1"], ["2", "2"], ["3", "3"], ["−", "-"], ["a/b", "\\frac{#@}{#?}"], ["x²", "#@^2"],
      ["0", "0"], [".", "."], [",", ","], ["+", "+"], ["=", "="], ["π", "\\pi"]
    ]
  };
  const NAV = [["←", "moveToPreviousChar"], ["→", "moveToNextChar"], ["⌫", "deleteBackward"], ["되돌리기", "undo"], ["모두 지우기", "clear"]];

  /* ───── 화면 스타일 ───── */
  const CSS = `
.mt-btn{flex:none;align-self:stretch;display:inline-flex;align-items:center;justify-content:center;gap:4px;border:0;border-left:1px solid var(--line);background:var(--paper);color:var(--accent);font:600 13px/1 var(--f-body);padding:0 10px;cursor:pointer;min-width:44px}

@container (max-width:330px){.mt-btn span{display:none}.mt-btn{min-width:40px;padding:0 8px}}

`;
  function injectCss() { if (document.getElementById("mt-css")) return; const s = document.createElement("style"); s.id = "mt-css"; s.textContent = CSS; document.head.appendChild(s); }
  // 근호 안에 x: "수식을 쓴다"는 뜻이 바로 보이는 아이콘
  const ICON = `<svg class="mt-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 13h2.5l3 7L12 4h10"/><path d="M14 9.5l5 6M19 9.5l-5 6"/></svg>`;
  const buttonHTML = key => `<button type="button" class="mt-btn" data-mt-open="${esc(key)}" title="수식 입력기 (키보드·손글씨)" aria-label="수식 입력기 열기">${ICON}<span>수식</span></button>`;

  /* ───── 수식 입력 창 ───── */
  let dlg = null;

  function close() { if (!dlg) return; const d = dlg; dlg = null; d.cleanup();

    d.el.remove(); }

  async function open(field, opts) {
    opts = opts || {}; injectCss(); close();
    const text = field.value || "", pos = field.selectionStart ?? text.length;

    const hit = opts.whole ? { start: 0, end: text.length, tex: (tokens(text)[0] || {}).tex ?? text.replace(/^\$|\$$/g, "").trim() }

    el.innerHTML = `<div class="mt-box" role="dialog" aria-modal="true" aria-label="수식 입력기">

          <div class="mt-cats">${Object.keys(KEYS).map((k, i) => `<button type="button" data-cat="${k}" aria-pressed="${i === 0}">${k}</button>`).join("")}</div>
          <div class="mt-keys" data-keys style="margin-top:8px"></div>
          <div class="mt-nav" style="margin-top:6px">${NAV.map(([l, c]) => `<button type="button" data-cmd="${c}">${l}</button>`).join("")}</div>
        </div>
        <div data-hw hidden>
          <div class="mt-pad"><canvas></canvas><div class="ph" data-ph><span>찾고 싶은 기호 <b>하나</b>를 크게 그리세요<br>예: ∫ θ √ ≤ ∞ φ</span></div></div>
          <div class="mt-cands" data-cands aria-live="polite"></div>
          <div class="mt-tools" style="margin-top:8px"><button type="button" class="btn" data-tool="pen" aria-pressed="true">✏ 펜</button><button type="button" class="btn" data-tool="erase" aria-pressed="false">⌫ 지우개</button><button type="button" class="btn" data-hwundo>되돌리기</button><button type="button" class="btn" data-hwclear>모두 지우기</button></div>

        </div>
      </div>
      <div class="mt-foot"><button type="button" class="btn" data-close>취소</button><button type="button" class="btn pri" data-ok>${hit ? "수식 고치기" : "칸에 넣기"}</button></div></div>`;
    document.body.appendChild(el);
    const $ = s => el.querySelector(s);
    let mf = null, src = $("[data-src]"), cat = Object.keys(KEYS)[0];
    const drawKeys = () => { $("[data-keys]").innerHTML = KEYS[cat].map(([l, t, w], i) => `<button type="button" data-k="${i}"${w > 1 ? ` class="w${w}"` : ""} title="${esc(t)}">${esc(l)}</button>`).join(""); };
    drawKeys();
    const onKey = e => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    dlg = { el, cleanup: () => { document.removeEventListener("keydown", onKey); pad && pad.stop(); } };

    // 키를 눌러도 수식 칸의 커서가 사라지지 않게 합니다
    el.addEventListener("pointerdown", e => { if (e.target.closest(".mt-keys button,.mt-nav button")) e.preventDefault(); });
    el.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) { if (e.target === el) close(); return; }
      if (b.hasAttribute("data-close")) return close();
      if (b.dataset.mode) { el.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); $("[data-kb]").hidden = b.dataset.mode !== "kb"; $("[data-hw]").hidden = b.dataset.mode !== "hw"; if (b.dataset.mode === "hw") pad.fit(); return; }
      if (b.dataset.cat) { cat = b.dataset.cat; el.querySelectorAll("[data-cat]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); drawKeys(); return; }
      if (!mf) return;
      if (b.dataset.k != null) { mf.executeCommand(["insert", KEYS[cat][+b.dataset.k][1], { focus: true, selectionMode: "placeholder", format: "latex", mode: "math" }]); focusMF(); return; }
      if (b.dataset.cmd) { if (b.dataset.cmd === "clear") { mf.value = ""; sync(); } else mf.executeCommand(b.dataset.cmd); focusMF(); return; }
      if (b.hasAttribute("data-ok")) { insert(); return; }
      if (b.dataset.tool) { pad.mode = b.dataset.tool; el.querySelectorAll("[data-tool]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); return; }
      if (b.hasAttribute("data-hwundo")) return pad.undo();
      if (b.hasAttribute("data-hwclear")) return pad.clear();
      if (b.dataset.cand != null) { const c = cands[+b.dataset.cand]; if (!c) return; mf.executeCommand(["insert", c[1], { focus: true, selectionMode: "placeholder", format: "latex", mode: "math" }]); pad.clear(); sync(); return; }
    });

    function focusMF() { try { mf.focus(); } catch (e) { /* MathLive 내부 포커스 오류: 입력에는 영향 없음 */ } }
    function sync() { if (mf && document.activeElement !== src) src.value = mf.getValue("latex"); }
    src.addEventListener("input", () => { if (mf) mf.setValue(src.value, { silenceNotifications: true }); });

    function insert() {
      // 비어 있는 빈칸(placeholder)은 빼고 저장합니다
      const tex = (mf ? mf.getValue("latex-without-placeholders") : src.value).replace(/\\placeholder\{\}/g, "").trim();
      let v = field.value, a, b2;
      if (hit) { a = hit.start; b2 = hit.end; } else { a = field.selectionStart ?? v.length; b2 = field.selectionEnd ?? a; }
      const piece = tex ? `$${tex}$` : "";
      field.value = v.slice(0, a) + piece + v.slice(b2);
      close();
      field.focus(); try { field.selectionStart = field.selectionEnd = a + piece.length; } catch (e) {}
      field.dispatchEvent(new Event("input", { bubbles: true }));
    }

    let cands = [], hwT = null;
    function showCands() {
      $("[data-cands]").innerHTML = cands.map((c, i) => `<button type="button" data-cand="${i}" title="${esc(c[2])} · ${esc(c[1])}"><b>${esc(c[0])}</b><small>${esc(c[2])}</small></button>`).join("");
    }
    function onDraw(strokes) {
      clearTimeout(hwT);
      if (!strokes.length) { cands = []; showCands(); return; }
      hwT = setTimeout(() => symbolMatch(strokes).then(r => { cands = r; showCands(); }), 120);
    }

    const pad = makePad($(".mt-pad"), $("[data-ph]"), onDraw);
    if (opts.mode === "hw") $('[data-mode="hw"]').click();

    try {
      await loadMathLive();
      if (!el.isConnected) return;
      // 수식 칸은 한 번만 만들어 계속 다시 씁니다 (지웠다 새로 만들면 MathLive 내부 오류가 납니다)
      if (!sharedMF) {
        sharedMF = document.createElement("math-field");
        sharedMF.className = "mt-field";
        sharedMF.mathVirtualKeyboardPolicy = "manual";
        sharedMF.setAttribute("aria-label", "수식");
      }
      mf = sharedMF;
      $("[data-mfbox]").appendChild(mf);
      try { mf.menuItems = []; } catch (e) {}
      mf.smartFence = true; mf.smartMode = false;
      mf.setValue(hit ? hit.tex : "");
      if (mf._mtSync) mf.removeEventListener("input", mf._mtSync);
      mf._mtSync = sync; mf.addEventListener("input", sync);
      $("[data-load]").remove(); sync();
      setTimeout(() => focusMF(), 50);
    } catch (e) {
      $("[data-load]").textContent = e.message; $("[data-load]").className = "mt-msg err";
      src.value = hit ? hit.tex : ""; src.focus();
    }
  }

  /* ───── 기호 그리기 인식 (기기 안에서) ─────
   * 그린 모양과 기호 견본을 같은 크기(40×40)로 맞춘 뒤, 서로의 선까지 거리(챔퍼 거리)와 가로세로 비율을 비교합니다.
   * 견본은 기호마다 여러 글꼴로 그려 만들므로 학습 자료나 서버가 필요 없습니다. */
  // [보이는 글자, 넣을 LaTeX, 이름]
  const HW_SYMS = [
    ["∫", "\\int", "적분"], ["∑", "\\sum", "합"], ["√", "\\sqrt{#0}", "근호"], ["π", "\\pi", "파이"], ["θ", "\\theta", "세타"], ["φ", "\\varphi", "파이(φ)"],
    ["α", "\\alpha", "알파"], ["β", "\\beta", "베타"], ["γ", "\\gamma", "감마"], ["δ", "\\delta", "델타"], ["Δ", "\\Delta", "델타(대)"], ["ε", "\\varepsilon", "엡실론"],
    ["λ", "\\lambda", "람다"], ["μ", "\\mu", "뮤"], ["σ", "\\sigma", "시그마"], ["ω", "\\omega", "오메가"], ["Ω", "\\Omega", "오메가(대)"], ["∞", "\\infty", "무한대"],
    ["∂", "\\partial", "편미분"], ["∇", "\\nabla", "나블라"], ["≤", "\\le", "작거나 같다"], ["≥", "\\ge", "크거나 같다"], ["≠", "\\ne", "같지 않다"], ["≈", "\\approx", "근삿값"],
    ["±", "\\pm", "플러스마이너스"], ["×", "\\times", "곱하기"], ["÷", "\\div", "나누기"], ["→", "\\to", "화살표"], ["⇒", "\\Rightarrow", "이면"], ["⇔", "\\Leftrightarrow", "동치"],
    ["∈", "\\in", "원소"], ["∴", "\\therefore", "그러므로"], ["∵", "\\because", "왜냐하면"], ["∠", "\\angle", "각"], ["⊥", "\\perp", "수직"], ["°", "^{\\circ}", "도"],
    ["′", "'", "프라임"], ["∪", "\\cup", "합집합"], ["∩", "\\cap", "교집합"], ["⊂", "\\subset", "부분집합"], ["∅", "\\emptyset", "공집합"], ["∝", "\\propto", "비례"],
    ["ℓ", "\\ell", "엘"], ["+", "+", "더하기"], ["−", "-", "빼기"], ["=", "=", "같다"], ["<", "<", "작다"], [">", ">", "크다"], ["(", "(", "괄호"], [")", ")", "괄호"],
    ["|", "|", "절댓값"], ["/", "/", "나누기(/)"],
    ..."0123456789".split("").map(d => [d, d, "숫자 " + d]),
    ..."xyabcdefgntukpqr".split("").map(c => [c, c, "문자 " + c])
  ];
  const HW_FONTS = ['100px "KaTeX_Main", serif', 'italic 100px "KaTeX_Math", serif', '100px "Times New Roman", serif', 'italic 100px "Times New Roman", serif', '100px Arial, sans-serif', '100px "Cambria Math", serif'];
  const G = 40, M = 4;
  let hwTpl = null;
  function distT(mask) {
    const d = new Float32Array(G * G), INF = 1e6;
    for (let i = 0; i < G * G; i++) d[i] = mask[i] ? 0 : INF;
    for (let y = 0; y < G; y++) for (let x = 0; x < G; x++) { const i = y * G + x; let v = d[i];
      if (x > 0) v = Math.min(v, d[i - 1] + 1);
      if (y > 0) { v = Math.min(v, d[i - G] + 1); if (x > 0) v = Math.min(v, d[i - G - 1] + 1.41); if (x < G - 1) v = Math.min(v, d[i - G + 1] + 1.41); }
      d[i] = v; }
    for (let y = G - 1; y >= 0; y--) for (let x = G - 1; x >= 0; x--) { const i = y * G + x; let v = d[i];
      if (x < G - 1) v = Math.min(v, d[i + 1] + 1);
      if (y < G - 1) { v = Math.min(v, d[i + G] + 1); if (x < G - 1) v = Math.min(v, d[i + G + 1] + 1.41); if (x > 0) v = Math.min(v, d[i + G - 1] + 1.41); }
      d[i] = v; }
    return d;
  }
  /** 캔버스(src)의 bbox 영역을 40×40 안에 비율을 지켜 가운데로 옮겨 0/1 격자로 만듭니다. */
  function toGrid(src, bx, by, bw, bh) {
    const c = document.createElement("canvas"); c.width = c.height = G; const x = c.getContext("2d", { willReadFrequently: true });
    const k = (G - 2 * M) / Math.max(bw, bh, 1), w = Math.max(bw * k, 1), h = Math.max(bh * k, 1);
    x.drawImage(src, bx, by, Math.max(bw, 1), Math.max(bh, 1), (G - w) / 2, (G - h) / 2, w, h);
    const px = x.getImageData(0, 0, G, G).data, mask = new Uint8Array(G * G); let n = 0;
    for (let i = 0; i < G * G; i++) if (px[i * 4 + 3] > 90) { mask[i] = 1; n++; }
    return n ? { mask, dt: distT(mask), n, ar: bw / Math.max(bh, 1) } : null;
  }
  async function buildTemplates() {
    if (hwTpl) return hwTpl;
    try { await loadMathLive(); await Promise.all([document.fonts.load('100px "KaTeX_Main"', "∫θπ"), document.fonts.load('italic 100px "KaTeX_Math"', "xθ")]); } catch (e) {}
    const S = 200, c = document.createElement("canvas"); c.width = c.height = S; const x = c.getContext("2d", { willReadFrequently: true });
    hwTpl = HW_SYMS.map(sym => {
      const forms = [];
      HW_FONTS.forEach(font => {
        x.clearRect(0, 0, S, S); x.font = font; x.textAlign = "center"; x.textBaseline = "middle"; x.fillStyle = "#000"; x.fillText(sym[0], S / 2, S / 2);
        const px = x.getImageData(0, 0, S, S).data; let x1 = S, y1 = S, x2 = -1, y2 = -1;
        for (let yy = 0; yy < S; yy++) for (let xx = 0; xx < S; xx++) if (px[(yy * S + xx) * 4 + 3] > 128) { if (xx < x1) x1 = xx; if (xx > x2) x2 = xx; if (yy < y1) y1 = yy; if (yy > y2) y2 = yy; }
        if (x2 < 0) return;
        const g = toGrid(c, x1, y1, x2 - x1 + 1, y2 - y1 + 1); if (g) forms.push(g);
      });
      (HW_HAND[sym[0]] || []).forEach(shape => { const g = strokesGrid(shape); if (g) forms.push(g); });  // 손으로 쓴 모양 견본
      return { sym, forms };
    }).filter(t => t.forms.length);
    return hwTpl;
  }
  /* 글꼴과 손글씨 모양이 크게 다른 기호의 손글씨 견본 (단위 상자 안 좌표, y는 아래로) */
  const pl = (...p) => p, arc = (cx, cy, rx, ry, a0, a1, n = 32) => [...Array(n + 1)].map((_, i) => { const a = a0 + (a1 - a0) * i / n; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
  const fnPath = (f, n = 40) => [...Array(n + 1)].map((_, i) => f(i / n));
  const HW_HAND = {
    "√": [[pl([0, .6], [.12, .52], [.3, 1], [.5, 0], [1.3, 0])], [pl([0, .65], [.15, .6], [.32, 1], [.55, 0], [.9, 0])]],
    "φ": [[arc(.5, .55, .3, .3, 0, 2 * Math.PI), pl([.5, 0], [.5, 1.15])], [arc(.5, .55, .3, .26, 0, 2 * Math.PI), pl([.56, 0], [.44, 1.15])]],
    "α": [[fnPath(t => { const a = .6 + 2 * Math.PI * .9 * t; return [.45 + .25 * Math.cos(a) + (t > .8 ? (t - .8) * 1.2 : 0), .5 + .22 * Math.sin(a)]; })],
          [fnPath(t => { const a = Math.PI * (.25 + 1.9 * t); return [.4 + .28 * Math.cos(a) + t * .35, .5 - .22 * Math.sin(a)]; })]],
    "∂": [[fnPath(t => { if (t < .5) { const a = Math.PI * (1.1 + 1.8 * t); return [.5 + .25 * Math.cos(a), .62 + .25 * Math.sin(a)]; } const u = (t - .5) * 2; return [.75 - .1 * u - .3 * u * u, .62 - .6 * u + .1 * u * u]; })]],
    "∫": [[fnPath(t => [.5 + .14 * Math.cos(Math.PI * t) + (t < .15 ? (.15 - t) * .6 : 0) - (t > .85 ? (t - .85) * .6 : 0), 1.2 * t])],
          [fnPath(t => [.5 + .12 * Math.sin(Math.PI * (t - .5)) * -1 + (t < .1 ? (.1 - t) * 1.5 : 0) - (t > .9 ? (t - .9) * 1.5 : 0), 1.3 * t])]],
    "∑": [[pl([.85, 0], [.1, 0], [.5, .5], [.1, 1], [.85, 1])]],
    "∞": [[fnPath(t => { const a = 2 * Math.PI * t, d = 1 + Math.sin(a) ** 2; return [.6 + .5 * Math.cos(a) / d, .3 + .5 * Math.sin(a) * Math.cos(a) / d]; }, 60)]],
    "θ": [[arc(.5, .6, .22, .4, 0, 2 * Math.PI), pl([.3, .6], [.7, .6])]],
    "π": [[pl([.1, .3], [.95, .28]), pl([.38, .3], [.34, .95]), pl([.7, .3], [.76, .95])]],
    "∈": [[arc(.55, .5, .45, .4, Math.PI * .5, Math.PI * 1.5), pl([.1, .5], [.8, .5])]],
    "±": [[pl([.1, .4], [.9, .4]), pl([.5, 0], [.5, .8]), pl([.1, 1], [.9, 1])]],
    "≥": [[pl([.2, 0], [.8, .3], [.2, .6]), pl([.2, .85], [.8, .85])]],
    "=": [[pl([0, .35], [1, .35]), pl([0, .65], [1, .65])]],
    "λ": [[pl([.1, 0], [.9, 1]), pl([.5, .45], [.1, 1])]],
    "μ": [[pl([.2, 0], [.2, 1.3]), fnPath(t => [.2 + .5 * t, .4 + .4 * Math.sin(Math.PI * t * .9)]), pl([.7, 0], [.75, .9])]],
    "σ": [[arc(.4, .6, .3, .3, 0, 2 * Math.PI), pl([.4, .3], [1, .3])]],
    "ω": [[fnPath(t => [t, .3 + .5 * Math.abs(Math.sin(2 * Math.PI * t))])]]
  };
  /** 획 목록(어떤 좌표든) → 40×40 격자. 선 굵기는 크기에 비례합니다. */
  function strokesGrid(strokes) {
    const pts = strokes.flat(); if (!pts.length) return null;
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const x1 = Math.min(...xs), y1 = Math.min(...ys), bw = Math.max(...xs) - x1, bh = Math.max(...ys) - y1;
    const k = 100 / Math.max(bw, bh, 1e-6);   // 손글씨든 단위 상자 견본이든 100px 크기로 맞춰 그립니다
    const big = Math.max(bw, bh) * k, lw = big * 0.085 + 2, pad = lw;
    const c = document.createElement("canvas"); c.width = Math.ceil(bw * k + 2 * pad); c.height = Math.ceil(bh * k + 2 * pad);
    const x = c.getContext("2d"); x.lineCap = "round"; x.lineJoin = "round"; x.lineWidth = lw; x.strokeStyle = "#000";
    strokes.forEach(s => { x.beginPath(); s.forEach(([px, py], i) => { const X = (px - x1) * k + pad, Y = (py - y1) * k + pad; i ? x.lineTo(X, Y) : x.moveTo(X, Y); }); if (s.length === 1) x.lineTo((s[0][0] - x1) * k + pad + .1, (s[0][1] - y1) * k + pad); x.stroke(); });
    return toGrid(c, 0, 0, c.width, c.height);
  }
  /** 획 목록 → 비슷한 기호 8개 [글자, LaTeX, 이름] */
  async function symbolMatch(strokes) {
    const tpl = await buildTemplates();
    const u = strokesGrid(strokes); if (!u) return [];
    const lar = Math.log(Math.min(6, Math.max(1 / 6, u.ar)));
    return tpl.map(t => {
      let best = Infinity;
      t.forms.forEach(f => {
        let a = 0, b = 0;
        for (let i = 0; i < G * G; i++) { if (u.mask[i]) a += f.dt[i]; if (f.mask[i]) b += u.dt[i]; }
        const sc = a / u.n + b / f.n + 2.2 * Math.abs(lar - Math.log(Math.min(6, Math.max(1 / 6, f.ar))));
        if (sc < best) best = sc;
      });
      return [best, t.sym];
    }).sort((p, q) => p[0] - q[0]).slice(0, 8).map(r => r[1]);
  }

  /* ───── 손글씨 판 ───── */
  function makePad(box, ph, onChange) {
    const cv = box.querySelector("canvas"), cx = cv.getContext("2d");
    let strokes = [], cur = null, penSeen = false, dpr = 1;
    const api = { mode: "pen" };
    function fit() {
      const r = box.getBoundingClientRect(); if (!r.width) return;
      dpr = window.devicePixelRatio || 1; cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); draw();
    }
    function draw() {
      cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, cv.width, cv.height);
      cx.lineCap = "round"; cx.lineJoin = "round"; cx.strokeStyle = "#111"; cx.lineWidth = 3;
      strokes.forEach(s => { cx.beginPath(); s.forEach(([x, y], i) => i ? cx.lineTo(x, y) : cx.moveTo(x, y)); if (s.length === 1) cx.lineTo(s[0][0] + .1, s[0][1]); cx.stroke(); });
      ph.style.display = strokes.length ? "none" : "";
    }
    const at = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    const changed = () => onChange && onChange(strokes);
    function eraseAt(p) { const before = strokes.length; strokes = strokes.filter(s => !s.some(([x, y]) => Math.hypot(x - p[0], y - p[1]) < 12)); if (strokes.length !== before) { draw(); changed(); } }
    function down(e) {
      if (e.pointerType === "pen") penSeen = true;
      if (penSeen && e.pointerType === "touch") return;     // 펜을 쓰면 손바닥 터치는 무시합니다
      e.preventDefault(); cv.setPointerCapture(e.pointerId);
      if (api.mode === "erase") { cur = "erase"; eraseAt(at(e)); return; }
      cur = [at(e)]; strokes.push(cur); draw();
    }
    function move(e) {
      if (!cur) return; e.preventDefault();
      if (cur === "erase") return eraseAt(at(e));
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      evs.forEach(ev => cur.push(at(ev))); draw();
    }
    function up() { const was = cur; cur = null; if (was && was !== "erase") changed(); }
    cv.addEventListener("pointerdown", down); cv.addEventListener("pointermove", move);
    cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
    const ro = new ResizeObserver(fit); ro.observe(box);
    api.fit = fit;
    api.undo = () => { strokes.pop(); draw(); changed(); };
    api.clear = () => { strokes = []; draw(); changed(); };
    api.stop = () => ro.disconnect();
    requestAnimationFrame(fit);
    return api;
  }

  injectCss();
  window.MathTool = { iconSVG: ICON, symbolMatch, open, close, render, renderInto, toImages, tokens, hasMath, buttonHTML, injectCss, preload: () => loadMathLive().catch(() => {}) };
})();

</script>

<style>

:root{
  --bg:#F7F8FA; --paper:#FFFFFF; --ink:#14181F; --muted:#6B7380; --line:#E6E8EC; --grid:#EEF0F3;
  --accent:#4F46E5; --accent-ink:#FFFFFF; --accent-soft:#EEF0FF;
  --modelB:#D97706; --fill:#FAFAFB; --fill-line:#E6E8EC; --label:#F4F5F8;
  --good:#12A150; --warn:#B45309; --bad:#DC2626; --good-soft:#E7F6EE; --warn-soft:#FEF3E2; --bad-soft:#FDECEC;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-display:var(--f-body);
  --f-mono:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1117; --paper:#171A22; --ink:#E7E9EE; --muted:#9AA1AE; --line:#2A2F3A; --grid:#1F232C;
  --accent:#8B8CF8; --accent-ink:#0F1117; --accent-soft:#25274A;
  --modelB:#F5A524; --fill:#1C2029; --fill-line:#2A2F3A; --label:#1F232C;
  --good:#3DD68C; --warn:#F5A524; --bad:#F87171; --good-soft:#12301F; --warn-soft:#33260C; --bad-soft:#3A1717;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1117; --paper:#171A22; --ink:#E7E9EE; --muted:#9AA1AE; --line:#2A2F3A; --grid:#1F232C;
  --accent:#8B8CF8; --accent-ink:#0F1117; --accent-soft:#25274A;
  --modelB:#F5A524; --fill:#1C2029; --fill-line:#2A2F3A; --label:#1F232C;
  --good:#3DD68C; --warn:#F5A524; --bad:#F87171; --good-soft:#12301F; --warn-soft:#33260C; --bad-soft:#3A1717;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.25;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg)}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.savest{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.ok{background:var(--good)} .dot.wait{background:var(--warn)} .dot.err{background:var(--bad)}

.banner{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;background:var(--paper);font-size:14px}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.bad{background:var(--bad-soft);border-color:transparent}
.banner.info{background:var(--accent-soft);border-color:transparent}

/* student header card */
.idcard{margin-top:16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.idcard .full{grid-column:1/-1}
.idcard label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
@media (max-width:640px){.idcard{grid-template-columns:1fr 1fr}.idcard .title{grid-column:1/-1}}

/* stage tabs */
.tabs{margin-top:16px;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{flex:1 0 128px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tab small{font-size:11px;color:var(--muted);letter-spacing:.02em}
.tab strong{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.bar{height:4px;border-radius:2px;background:var(--grid);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);width:0}

/* symbol palette */
.syms{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,58px));z-index:4;margin-top:10px;background:var(--bg);padding-block:6px;display:flex;gap:4px;overflow-x:auto;align-items:center}
.syms span{font-size:12px;color:var(--muted);white-space:nowrap;margin-right:4px}
.syms button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:2px 8px;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.syms button.symtool{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--f-body);font-weight:700;margin-right:8px}

/* stage sheet */
.sheet{margin-top:8px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sheet-head{padding:16px 18px;border-bottom:1px solid var(--line);background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/16px 16px,var(--paper)}
.sheet-head h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:4px}
.goal{margin:8px 0 0;font-size:14px}
.blocks{padding:6px 18px 18px;display:flex;flex-direction:column;gap:18px}
.blk{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px;padding-top:14px;border-top:1px dashed var(--line)}
.blk:first-child{border-top:0}
.blk .no{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--accent);line-height:1.2}
.blk h3{margin:0;font-size:16px;font-weight:700}
.blk h3 .star{color:var(--warn);margin-right:4px}
.blk .hint{font-size:13px;color:var(--muted);margin:2px 0 0}
.blk .body{grid-column:2;min-width:0;display:flex;flex-direction:column;gap:8px;margin-top:6px}
@media (max-width:560px){.blk{grid-template-columns:26px minmax(0,1fr)}.blocks{padding-inline:12px}.sheet-head{padding-inline:12px}}

.row{display:grid;grid-template-columns:200px minmax(0,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.row+.row{margin-top:-9px;border-top-left-radius:0;border-top-right-radius:0}
.row .lab{background:var(--label);padding:8px 10px;font-size:13px;font-weight:500;border-right:1px solid var(--line)}
@media (max-width:560px){.row{grid-template-columns:1fr}.row .lab{border-right:0;border-bottom:1px solid var(--line)}}
.fld,.cell input,.cell textarea,.cell select{width:100%;border:0;background:var(--fill);padding:8px 10px;min-height:38px;resize:vertical;outline-offset:-2px}
textarea.fld{min-height:64px}
.fld.math,.cell .math{font-family:var(--f-mono);font-size:14px}
.fld:disabled,.cell :disabled{opacity:.75;cursor:not-allowed}
.ro{padding:8px 10px;min-height:38px;white-space:pre-wrap;word-break:break-word;background:var(--fill)}
.ro.empty{color:var(--muted);background:transparent;font-style:italic}
.ro.math{font-family:var(--f-mono);font-size:14px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:left;vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t th:last-child,table.t td:last-child{border-right:0}
table.t th{background:var(--label);font-weight:500;font-size:13px;padding:6px 10px;white-space:nowrap}
table.t td.lab{background:var(--label);padding:8px 10px;font-size:13px;min-width:130px}
table.t td.auto{padding:8px 10px;color:var(--muted);font-family:var(--f-mono);font-size:13px;min-width:110px}
table.t td .cell{min-width:120px}
.cell textarea{min-height:38px}

.autochip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.autochip code{font-family:var(--f-mono);color:var(--ink);background:var(--label);padding:1px 6px;border-radius:4px}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:12px;text-decoration:underline;text-underline-offset:2px}

.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.checks input{margin-top:5px;accent-color:var(--accent)}
details.help{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--bg);font-size:13px}
details.help summary{cursor:pointer;font-weight:500}
details.help ul{margin:6px 0 0;padding-left:18px}

/* tool panels (sheet replacement) */
.tool{border:1px solid var(--accent);border-radius:var(--r);overflow:hidden}
.tool-h{background:var(--accent-soft);padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool-h span{font-weight:400;color:var(--muted)}
.tool-b{padding:12px;display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px;align-items:center}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono)}
.mini{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.mini input,.mini select,.mini textarea{border:1px solid var(--fill-line);background:var(--fill);border-radius:5px;padding:5px 8px;font-size:14px;width:100%;min-width:0}
.mini textarea{font-family:var(--f-mono);min-height:120px}
.params{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media (max-width:640px){.params{grid-template-columns:repeat(4,minmax(0,1fr))}}
.params .mini:first-child{grid-column:span 2}
.mrow{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:6px}
.mrow h4{margin:0;font-size:13px;display:flex;gap:8px;align-items:center}
.sw{width:18px;height:3px;border-radius:2px;display:inline-block}
.formula{font-family:var(--f-mono);font-size:13px;background:var(--label);border-radius:4px;padding:4px 8px;word-break:break-all}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--grid)} .chart .ax{stroke:var(--line)} .chart text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.chart .lbl{font-family:var(--f-body);font-size:12px}
.chart .pt{fill:var(--ink)} .chart .ca{stroke:var(--accent);fill:none;stroke-width:2}
.chart .cb{stroke:var(--modelB);fill:none;stroke-width:2;stroke-dasharray:6 4}
.chart .ra{fill:var(--accent)} .chart .rb{fill:var(--modelB)} .chart .zero{stroke:var(--muted);stroke-dasharray:3 3}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin-right:5px;vertical-align:middle}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 12px;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.empty-note{font-size:13px;color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:6px}

.foot-nav{display:flex;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--bg)}
.submitbox{border:2px solid var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.fb{margin-top:16px;border:1px solid var(--good);background:var(--good-soft);border-radius:var(--r);padding:14px 16px}
.fb h3{margin:0 0 6px;font-size:15px}
.fbgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.fbgrid{grid-template-columns:1fr 1fr}}
.fbgrid div{background:var(--paper);border-radius:6px;padding:8px 10px;font-size:13px}
.fbgrid b{display:block;font-family:var(--f-mono);font-size:18px}

/* teacher */
.stats{margin-top:16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.stat small{font-size:12px;color:var(--muted)} .stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500}
.controls{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls input[type=search]{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 10px;min-width:0;flex:1 1 180px}
.controls select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 8px}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:var(--paper)}
.toggle input{accent-color:var(--bad)}
.roster{margin-top:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.roster table{border-collapse:collapse;width:100%;font-size:14px;min-width:820px}
.roster th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.roster td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.roster tr:last-child td{border-bottom:0}
.roster tbody tr{cursor:pointer}
.roster tbody tr:hover{background:var(--bg)}
.roster tbody tr[aria-selected="true"]{background:var(--accent-soft)}
.prog{display:flex;gap:3px}
.prog span{width:22px;height:8px;border-radius:2px;background:var(--grid);overflow:hidden;position:relative}
.prog span i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--label);color:var(--muted)}
.pill.sub{background:var(--good-soft);color:var(--good)} .pill.live{background:var(--warn-soft);color:var(--warn)}
.pill.graded{background:var(--accent-soft);color:var(--accent)}
.sub{font-size:12px;color:var(--muted)}
.detail{margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:900px){.detail{grid-template-columns:1fr}}
.grade{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,58px) + 10px)}
@media (max-width:900px){.grade{position:static}}
.grade h3{margin:0;font-size:15px}
.gitem{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line);padding-top:10px}
.gitem .q{font-size:12px;color:var(--muted)}
.gitem .sc{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.gitem .sc button{border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:1px 8px;font-family:var(--f-mono);font-size:13px}
.gitem .sc button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gitem input[type=number]{width:64px;border:1px solid var(--line);border-radius:5px;padding:2px 6px;background:var(--bg);font-family:var(--f-mono)}
.gitem textarea,.grade textarea{border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:var(--bg);min-height:52px;width:100%;resize:vertical;font-size:13px}
.total{font-family:var(--f-mono);font-size:22px}
.dhead{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.dhead h2{margin:0;font-size:18px;font-family:var(--f-display);font-weight:800}
.dtabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px}
.dtabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font-size:13px;white-space:nowrap}
.dtabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.loading{margin-top:40px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.seg button{transition:background .15s,border-color .15s}}

.auth{margin:32px auto 0;max-width:440px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.authform{display:flex;flex-direction:column;gap:10px}
.authform .mini input{font-size:15px;padding:8px 10px}
.autherr{margin:0;min-height:1.2em;font-size:13px;color:var(--bad)}
.userbox{display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:wrap}
.userbox .btn{padding:3px 10px;font-size:12px}
a.btn{color:var(--ink)}
.docbar{margin-top:12px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.docbar .grow{flex:1 1 220px;min-width:0;font-size:13px}
.docbar .grow small{display:block;color:var(--muted);font-size:12px}
.sharebox{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sharebox h3{margin:0;font-size:15px}
.sharebox ul{margin:0;padding-left:18px;font-size:14px}
.sharebox .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sharebox input{border:1px solid var(--line);background:var(--fill);border-radius:6px;padding:6px 10px;min-width:0;flex:1 1 220px}

/* ── 학생 화면: 단계 막대 + 한 줄 상황판 ── */
.top{background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(12px)}
.labbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,58px));z-index:4;margin:12px 0 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:8px 0;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.steps{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none;flex:none;max-width:100%}
.steps button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.steps button i{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.steps button.part i{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.steps button.done i{background:var(--good)}
.steps button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.steps button[aria-selected="true"] i{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.status{flex:1 1 320px;min-width:0;display:flex;align-items:center;gap:6px 14px;font-size:13px;color:var(--muted);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.status b{color:var(--ink);font-weight:600}
.status .k{font-family:var(--f-mono);font-size:14px;color:var(--ink)}
.status .k.acc{color:var(--accent)}
.status .sep{width:1px;height:14px;background:var(--line);flex:none}
.metarow{margin-top:8px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:12px}
.metarow .idcard,.metarow .docbar{margin-top:0}
.idcard{border-radius:var(--r)}
.docbar{border-radius:var(--r);background:var(--paper);border-color:var(--line)}
@media (max-width:900px){.metarow{grid-template-columns:1fr}}

/* ── 단계 본문: 12칸 카드 격자 ── */
.stage{margin-top:14px}
.stage-head{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;padding:4px 2px 10px}
.stage-head h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
.stage-head p{margin:0;color:var(--muted);font-size:14px}
.bento{container-type:inline-size;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.card{grid-column:span 12;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card.c7{grid-column:span 7}.card.c5{grid-column:span 5}
.card.low{order:80}.card.last{order:90}
@container (max-width:760px){.card.c7,.card.c5{grid-column:span 12}}

/* ── 아래 수식 키보드 ── */

/* ── 카드·소제목 강조 ── */
.card{position:relative;overflow:hidden}

.row .lab,table.t td.lab{font-weight:700;color:var(--ink);background:linear-gradient(90deg,var(--accent-soft),var(--label));box-shadow:inset 3px 0 0 var(--g1,var(--accent))}

/* ── 대시보드 ── */
.dash{display:grid;gap:12px}

.dmodel{background:var(--accent-soft);border-radius:12px;padding:8px 12px;overflow-x:auto;font-size:15px}.dmodel small{display:block;font-size:12px;color:var(--muted)}

.rm{display:grid;gap:12px}

"use strict";
/* ───────── 내용 정의 (활동지 v13 기준) ───────── */

    case "사인": v=-(a/b)*C(u); break; case "코사인": v=(a/b)*S(u); break;
    case "탄젠트형": v=-(a/b)*L(A(C(u))); break; case "시컨트형": v=(a/b)*L(A((1+S(u))/C(u))); break;
    case "코시컨트형": v=(a/b)*L(A(Math.tan(u/2))); break; case "코탄젠트": v=(a/b)*L(A(S(u))); break;
    case "아크탄젠트형": v=a*((x-c)*Math.atan(u)-L(1+u*u)/(2*b)); break;
    case "삼각함수의 합성": v=(-a*C(u)+e*S(u))/b; break;
    case "두 삼각함수의 합": v=-(a*C(u)+(e/2)*C(2*u))/b; break;
    case "배각 공식 활용": v=-(a/b)*C(u)+e/(2*b)*S(2*u); break;
    case "반각 공식 활용": v=a*((x-c)/2-S(2*u)/(4*b)); break;
    default: v=-(a*C(u)+(e/2)*C(2*u)+(g/3)*C(3*u))/b;

function integ(m,p,q){ if(!m.ok||!isNum(p)||!isNum(q)) return NaN; const v=Fanti(m,+q)-Fanti(m,+p); return isFinite(v)?v:NaN; }
function trapezoid(pts,p,q){ if(!isNum(p)||!isNum(q)||pts.length<2) return NaN; let s=0;
  for(let i=0;i<pts.length-1;i++){ const P=pts[i],Q=pts[i+1]; if(P.x>=+p&&Q.x<=+q&&Q.x>P.x) s+=(Q.x-P.x)*(P.y+Q.y)/2; } return s; }
function errStats(m,pts){ if(!m.ok||!pts.length) return null; const rows=[]; pts.forEach(p=>{ const f=fval(m,p.x); if(isNaN(f)) return; const e=p.y-f; rows.push({x:p.x,y:p.y,f,e,r:p.y!==0?Math.abs(e/p.y)*100:null}); });
  if(!rows.length) return null; const rs=rows.filter(r=>r.r!=null); let mx=null; rs.forEach(r=>{ if(!mx||r.r>mx.r) mx=r; });
  return {rows, mean:rs.length?rs.reduce((s,r)=>s+r.r,0)/rs.length:NaN, max:mx?mx.r:NaN, maxX:mx?mx.x:NaN,

function features(pts,T){ if(!pts.length) return null; let mx=pts[0],mn=pts[0]; pts.forEach(p=>{ if(p.y>mx.y) mx=p; if(p.y<mn.y) mn=p; });
  return {max:mx.y,maxX:mx.x,min:mn.y,minX:mn.x,aC:(mx.y-mn.y)/2,dC:(mx.y+mn.y)/2,T:isNum(T)?+T:NaN,bC:isNum(T)&&+T!==0?2*Math.PI/+T:NaN,n:pts.length,
    x1:Math.min(...pts.map(p=>p.x)),x2:Math.max(...pts.map(p=>p.x))}; }
function fmt(v,dg=4){ if(v==null||isNaN(v)) return "–"; if(!isFinite(v)) return v>0?"∞":"−∞"; const a=Math.abs(v);
  let s = a!==0&&(a>=1e6||a<1e-4) ? v.toExponential(3) : String(+v.toFixed(dg)); return s.replace("-","−"); }
function formulaText(m){ if(!m.ok) return ""; const n=v=>fmt(v,4), U=(k)=>`${k>1?k+"·":""}${n(m.b)}(x ${m.c<0?"+ "+n(-m.c):"− "+n(m.c)})`;
  const T=(coef,fn,k=1,first=false)=>{ const s=coef<0?"− ":(first?"":"+ "); const c=Math.abs(coef); return `${first&&coef<0?"−":s}${c===1?"":n(c)}${fn}(${U(k)})`; };
  const fnm={"사인":"sin","코사인":"cos","탄젠트형":"tan","시컨트형":"sec","코시컨트형":"csc","코탄젠트":"cot","아크탄젠트형":"arctan"};
  let body;

  else if(m.t==="두 삼각함수의 합") body=T(m.a,"sin",1,true)+" "+T(m.e,"sin",2);
  else if(m.t==="배각 공식 활용") body=T(m.a,"sin",1,true)+" "+T(m.e,"cos",2);
  else if(m.t==="반각 공식 활용") body=T(m.a,"sin²",1,true);
  else body=T(m.a,"sin",1,true)+" "+T(m.e,"sin",2)+" "+T(m.g,"sin",3);

/* ───────── 그래프 (SVG) ───────── */
function ticks(lo,hi,n=6){ const span=hi-lo||1, raw=span/n, mag=10**Math.floor(Math.log10(raw)), st=[1,2,2.5,5,10].map(k=>k*mag).find(s=>s>=raw)||raw;
  const out=[]; for(let v=Math.ceil(lo/st)*st; v<=hi+1e-9; v+=st) out.push(+v.toFixed(10)); return out; }
// 오차 그래프: |오차| ≤ 1 은 그대로, 1을 넘으면 1 + log10|오차| 로 줄여 그립니다(±1 기준선).
const rz=v=>Math.abs(v)<=1?v:Math.sign(v)*(1+Math.log10(Math.abs(v)));
function chartSVG(an,opt={}){

  const curves = res ? [] : [["A",an.A,"ca"],["B",an.B,"cb"]].filter(c=>c[1].ok && opt.models);
  let x1,x2; if(pts.length){ x1=Math.min(...pts.map(p=>p.x)); x2=Math.max(...pts.map(p=>p.x)); } else { x1=0; x2=12; }
  if(x1===x2){ x1-=1; x2+=1; } const xp=(x2-x1)*0.04; x1-=xp; x2+=xp;
  let ys=[];
  if(res){ [an.eA,an.eB].forEach(s=>s&&s.rows.forEach(r=>ys.push(rz(r.e)))); }
  else if(pts.length) ys=pts.map(p=>p.y);
  else curves.forEach(([,m])=>{ for(let i=0;i<=60;i++){ const v=fval(m,x1+(x2-x1)*i/60); if(!isNaN(v)) ys.push(v);} });
  if(!ys.length) return `<div class="empty-note">${res?"모델을 정하고 자료를 넣으면 오차 그래프가 그려집니다.":"y 값을 입력하면 자료 점이 그려집니다."}</div>`;
  ys.sort((a,b)=>a-b); let y1=ys[Math.floor(ys.length*(pts.length||res?0:0.05))], y2=ys[Math.ceil(ys.length*(pts.length||res?1:0.95))-1];
  if(res){ y1=Math.min(y1,-1); y2=Math.max(y2,1); const yp=(y2-y1)*0.08; y1-=yp; y2+=yp; }
  else { if(y1===y2){ y1-=1; y2+=1; } const yp=(y2-y1)*0.15; y1-=yp; y2+=yp; }
  const sx=x=>L+(x-x1)/(x2-x1)*(W-L-R), sy=y=>Tp+(y2-y)/(y2-y1)*(H-Tp-B);
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${res?"오차 그래프":"자료와 모델 그래프"}">`;
  g+=`<defs><clipPath id="cp${opt.id||""}"><rect x="${L}" y="${Tp}" width="${W-L-R}" height="${H-Tp-B}"/></clipPath></defs>`;
  ticks(x1,x2,8).forEach(v=>{ const X=sx(v); g+=`<line class="gl" x1="${X}" x2="${X}" y1="${Tp}" y2="${H-B}"/><text x="${X}" y="${H-B+14}" text-anchor="middle">${fmt(v,3)}</text>`; });
  if(res){ // 1 안쪽은 0.5 간격, 바깥은 10, 100, … 눈금
    const tk=[-1,-0.5,0,0.5,1]; for(let k=1;k<6;k++){ if(1+k<=y2) tk.push(1+k); if(-(1+k)>=y1) tk.push(-(1+k)); }
    if(y2>1) g+=`<rect class="band" x="${L}" y="${Tp}" width="${W-L-R}" height="${Math.max(0,sy(1)-Tp)}"/>`;
    if(y1<-1) g+=`<rect class="band" x="${L}" y="${sy(-1)}" width="${W-L-R}" height="${Math.max(0,H-B-sy(-1))}"/>`;
    tk.forEach(v=>{ const Y=sy(v), lab=Math.abs(v)<=1?fmt(v,2):(v<0?"−":"")+fmt(10**(Math.abs(v)-1),0); g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y}" y2="${Y}"/><text x="${L-6}" y="${Y+4}" text-anchor="end">${lab}</text>`; });
  } else ticks(y1,y2,6).forEach(v=>{ const Y=sy(v); g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y}" y2="${Y}"/><text x="${L-6}" y="${Y+4}" text-anchor="end">${fmt(v,3)}</text>`; });

  if(res){ g+=`<line class="zero" x1="${L}" x2="${W-R}" y1="${sy(0)}" y2="${sy(0)}"/>`;

    g+=`<text class="limt" x="${W-R-4}" y="${sy(1)-4}" text-anchor="end">기준선 +1</text><text class="limt" x="${W-R-4}" y="${sy(-1)+12}" text-anchor="end">기준선 −1</text>`;
    [[an.eA,"ra",-2.5],[an.eB,"rb",2.5]].forEach(([s,cl,off])=>{ if(!s) return; s.rows.forEach(r=>{ const Y=sy(rz(r.e)); g+=`<rect class="${cl}" x="${sx(r.x)+off-2}" y="${Math.min(sy(0),Y)}" width="4" height="${Math.max(1,Math.abs(Y-sy(0)))}" clip-path="url(#cp${opt.id||""})"/>`; }); }); }
  else {
    const span=y2-y1;

      for(let i=0;i<=n;i++){ const x=x1+(x2-x1)*i/n, v=fval(m,x);
        if(isNaN(v)||Math.abs(v-(y1+y2)/2)>span*6||(prev!=null&&Math.abs(v-prev)>span*1.5)){ prev=isNaN(v)?null:v; if(!isNaN(v)) d+=`M${sx(x).toFixed(1)},${sy(v).toFixed(1)}`; continue; }
        d+=(prev==null?"M":"L")+sx(x).toFixed(1)+","+sy(v).toFixed(1); prev=v; }

    pts.forEach(p=>{ g+=`<circle class="pt" cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="3"/>`; });
  }
  g+=`<text class="lbl" x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle">${esc(opt.xl||"x")}</text>`;
  g+=`<text class="lbl" x="12" y="${(Tp+H-B)/2}" text-anchor="middle" transform="rotate(-90 12 ${(Tp+H-B)/2})">${esc(res?"오차 (실측 − 모델) · 1 초과는 줄임":(opt.yl||"y"))}</text></svg>`;

/** 모델 식을 LaTeX로 (formulaText와 같은 모양) */
function formulaTex(m){ if(!m.ok) return ""; const n=v=>fmt(v,4).replace("−","-");
  const U=k=>`${k>1?k+"\\cdot ":""}${n(m.b)}\\left(x${m.c<0?"+"+n(-m.c):"-"+n(m.c)}\\right)`;
  const T=(coef,fn,k=1,first=false)=>{ const c=Math.abs(coef), s=coef<0?"-":(first?"":"+"); return `${s}${c===1?"":n(c)}\\${fn}\\left(${U(k)}\\right)`; };
  const fnm={"사인":"sin","코사인":"cos","탄젠트형":"tan","시컨트형":"sec","코시컨트형":"csc","코탄젠트":"cot","아크탄젠트형":"arctan"};
  let body;
  if(fnm[m.t]) body=T(m.a,fnm[m.t],1,true);
  else if(m.t==="삼각함수의 합성") body=T(m.a,"sin",1,true)+T(m.e,"cos");
  else if(m.t==="두 삼각함수의 합") body=T(m.a,"sin",1,true)+T(m.e,"sin",2);
  else if(m.t==="배각 공식 활용") body=T(m.a,"sin",1,true)+T(m.e,"cos",2);
  else if(m.t==="반각 공식 활용") body=T(m.a,"sin^2",1,true);

/* ───────── 공통 도우미 ───────── */
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function getP(o,p){ return p.split(".").reduce((a,k)=>a==null?undefined:a[k],o); }

function ago(t){ if(!t) return "–"; const s=(Date.now()-t)/1000; if(s<60) return "방금"; if(s<3600) return Math.floor(s/60)+"분 전"; if(s<86400) return Math.floor(s/3600)+"시간 전";
  const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function stageFields(si){ const out=[]; STAGES[si].blocks.forEach(b=>{ if(b.opt) return;

  return STAGES.map((s,si)=>{ const ks=stageFields(si); let have=ks.filter(k=>String(a[k]??"").trim()!=="").length, tot=ks.length;

function autoVal(doc,key,an){ an=an||analyze(doc); const f=an.feat;

  if(kind==="card") return `<select class="fld${v?"":" empty"}" id="f_${key}" data-p="ans.${key}" aria-label="${al}"><option value="">예시 자료를 선택하거나, 직접 주제를 찾아 작성하시오</option>${CARDS.map(c=>`<option value="${c[0]}"${v===c[0]?" selected":""}>${c[0]} · ${esc(c[1])} (${esc(c[3])})</option>`).join("")}</select>`;
  const box=long?`<textarea class="fld${math?" math":""}" id="f_${key}" data-p="ans.${key}" rows="${kind==="longmath"?4:2}" placeholder=" " aria-label="${al}">${esc(v)}</textarea>`
    :`<input class="fld${math?" math":""}" id="f_${key}" data-p="ans.${key}" value="${esc(v)}" placeholder=" " aria-label="${al}" autocomplete="off">`;
  const prev=`<div class="mt-prev" data-prev="${key}" aria-live="polite"></div>`;
  if(kind==="link") return box+`<div class="links" data-links="${key}">${linkify(v)}</div>`;
  if(kind==="longmath") return `<div class="mt-wrap">${box}${MathTool.buttonHTML(key)}<button type="button" class="mt-btn ph-btn" data-photo="${key}" title="연습장에 쓴 풀이를 사진으로 올리기 (50KB 이하로 줄여 저장)" aria-label="풀이 사진 올리기">${CAM_ICON}<span>사진</span></button></div>${prev}${aiNoteHTML(key)}${photoHTML(doc,key,false)}`;
  return math?`<div class="mt-wrap">${box}${MathTool.buttonHTML(key)}</div>${prev}`:(long?box+prev:box); }
// 수식 입력기: 칸 안의 $LaTeX$를 아래에 수식으로 그려 보여 줍니다
function updPrev(el){ const key=(el.dataset.p||"").replace(/^ans\./,""), pv=key&&app.querySelector(`[data-prev="${key}"]`); if(!pv) return;
  if(MathTool.hasMath(el.value)) MathTool.renderInto(pv,el.value); else pv.textContent=""; }
function openMath(field,index,mode){ if(!field||locked()) return; MathTool.open(field,{index,mode}); }
function autoChip(key,auto,ro){ return `<div class="autochip">도구 값: <code data-auto="${auto}"></code>${ro?"":`<button class="linkbtn" data-fill="${key}" data-src="${auto}" type="button">이 값 넣기</button>`}</div>`; }
function cardInfo(doc){ const c=cardOf(doc); return c?`<div class="sub">현상: ${esc(c[1])} · 자료 얻는 곳: ${esc(c[2])} · 함수 형태: <b>${esc(c[3])}</b></div>`:""; }

function blockHTML(doc,b,si,bi,ro){
  if(b.help) return `<details class="help"><summary>💡 막히면 보세요 (감점 없음)</summary><ul>${b.help.map(h=>`<li>${tx(h)}</li>`).join("")}</ul></details>`;
  if(b.check) return `<div class="blk"><div class="no">✓</div><div><h3>${esc(b.check)}</h3></div><div class="body checks">${b.items.map(([k,t])=>`<label><input type="checkbox" id="c_${k}" data-p="checks.${k}"${(doc.checks||{})[k]?" checked":""}${ro?" disabled":""}> <span>${esc(t)}</span></label>`).join("")}</div></div>`;
  if(b.tool&&!b.n) return toolHTML(doc,b.tool,ro);
  let body="";
  if(b.linkTopic) body+=`<div class="linked">🔗 탐구 주제는 [나의 수행]과 연결되어 어느 쪽에서 고쳐도 함께 바뀝니다.</div>`;
  if(b.tool) body+=toolHTML(doc,b.tool,ro);
  if(b.f) body+=b.f.map(([k,l,kind,o])=>`<div class="row">${labHTML(l,k)}<div style="min-width:0">${fieldHTML(doc,k,kind,ro,l)}${o&&o.auto&&kind!=="auto"?autoChip(k,o.auto,ro):""}${kind==="card"?`<div data-cardinfo style="padding:4px 10px">${cardInfo(doc)}</div>`:""}</div></div>`).join("");
  if(b.table){ const t=b.table; body+=`<div class="tbl-wrap"><table class="t"><thead><tr>${t.cols.map(c=>`<th>${tx(c)}</th>`).join("")}</tr></thead><tbody>${t.rows.map(r=>{ const keys=r.slice(1).map(k=>k.split(":")[0]), tp=tipAttr(...keys);
    return `<tr><td class="lab"${tp}>${tx(r[0])}${tp?'<i class="tipi" aria-hidden="true">?</i>':""}</td>${r.slice(1).map(k=>{ const [key,kind]=k.split(":"); return `<td><div class="cell">${fieldHTML(doc,key,kind==="math"?"math":"long",ro,plain(r[0]))}</div></td>`; }).join("")}</tr>`; }).join("")}</tbody></table></div>`; }
  return `<div class="blk"><div class="no">${esc(b.n)}</div><div><h3>${b.star?'<span class="star">★</span>':""}${tx(b.t)}</h3>${b.hint?`<p class="hint">${tx(b.hint)}</p>`:""}</div><div class="body">${body}</div></div>`; }

/* ── 2단계 자료 입력표 (엑셀처럼) ── 표의 내용은 data.grid, 계산에는 기존처럼 data.xs·data.ys(빈 y 줄은 뺌)를 씁니다 */
function gridRows(doc){ const d=doc.data||{}; if(Array.isArray(d.grid)) return d.grid.map(r=>[String(r[0]??""),String(r[1]??"")]);
  const split=s=>String(s||"").split(/[\n,\t;]+/).map(t=>t.trim()).filter(t=>t!=="");
  const ys=split(d.ys), xs=split(d.xs), x0=N(d.x0,1), dx=N(d.dx,1);
  return ys.map((y,i)=>[xs.length?(xs[i]??""):String(+(x0+i*dx).toFixed(6)),y]); }
/** i번째 줄 x의 예상값: 바로 위 두 줄의 간격을 이어 갑니다(위가 한 줄뿐이면 +1). */
function predX(rows,i){ const xs=[]; for(let k=i-1;k>=0&&xs.length<2;k--){ const v=(rows[k]||[])[0]; if(isNum(v)) xs.push(+v); else break; }
  if(!xs.length) return ""; const st=xs.length>1?xs[0]-xs[1]:1; return String(+(xs[0]+st).toFixed(6)); }
function dgRowHTML(i,r,ro,rows){ const p=predX(rows,i);
  return `<tr><td class="rn">${i+1}</td><td><input data-r="${i}" data-c="0" value="${esc(r[0])}" placeholder="${p===""?" ":esc(p)}" inputmode="decimal" autocomplete="off"${ro?" disabled":""} aria-label="${i+1}번째 x"></td><td><input data-r="${i}" data-c="1" value="${esc(r[1])}" placeholder=" " inputmode="decimal" autocomplete="off"${ro?" disabled":""} aria-label="${i+1}번째 y"></td></tr>`; }
let dgExtra=0;
function dgBodyHTML(rows,ro){ const n=ro?Math.max(rows.length,1):Math.max(rows.length+1,DATA_GOAL+1)+dgExtra; let h=""; for(let i=0;i<n;i++) h+=dgRowHTML(i,rows[i]||["",""],ro,rows); return h; }
function gridHTML(doc,ro){ const rows=gridRows(doc);
  return `<div class="dgwrap"><table class="dg" data-grid><thead><tr><th>#</th><th>${esc(axisLabel(doc,"x"))}</th><th>${esc(axisLabel(doc,"y"))}</th></tr></thead><tbody>${dgBodyHTML(rows,ro)}</tbody></table></div>
  <div class="dg-tools">${ro?"":`<button class="btn" type="button" data-act="dgFill">↧ x 자동 채우기</button><button class="btn" type="button" data-act="dgAdd">＋ 줄 5개</button><button class="btn" type="button" data-act="dgClear">표 비우기</button>`}<span class="dgcount" data-out="dgCount"></span></div>
  ${ro?"":`<p class="sub" style="margin:0">엑셀에서 x·y 두 열(또는 y 한 열)을 복사해 칸에 붙여 넣으면 한꺼번에 들어갑니다. y만 넣으면 x는 위 두 줄의 간격대로 자동으로 채워지고(흐린 숫자), Enter는 아래 칸으로 갑니다.</p>`}`; }

function toolHTML(doc,tool,ro){ const d=doc.data||{}, M=doc.models||{}, c=doc.calc||{}; const dis=ro?" disabled":"";
  const inp=(p,v,lab,extra="")=>`<label class="mini">${tx(lab)}<input id="t_${p.replace(/\./g,"_")}" data-p="${p}" value="${esc(v??"")}" placeholder=" "${dis} ${extra} autocomplete="off"></label>`;
  switch(tool){
  case "data": return `<div class="tool"><div class="tool-h">📊 자료 입력표와 그래프 <span>엑셀처럼 입력 · 붙여 넣기 · 자동 채우기</span></div><div class="tool-b">
    <div class="grid2"><div style="display:grid;gap:8px;align-content:start;min-width:0">
      <div class="xyinfo" data-out="xyInfo"></div>
      ${gridHTML(doc,ro)}
      ${inp("models.T",M.T,"주기 $T$ (오르내림이 반복될 때만)",'inputmode="decimal"')}
      <div class="upbox"><div><b>📎 원본 자료 파일</b><span class="sub"> 엑셀·CSV·PDF·사진 (10MB 이하) · 선생님 폴더에 '탐구자료_학번_이름'으로 저장됩니다</span></div><div data-out="upData"></div>${ro?"":`<div><button class="btn" type="button" data-act="upData">파일 올리기</button></div>`}</div>
    </div><div style="min-width:0;display:grid;gap:8px;align-content:start"><div data-out="chartData"></div><dl class="kv" data-out="feat"></dl></div></div></div></div>`;
  case "chartData": return `<div data-out="chartData2"></div>`;
  case "model": return `<div class="tool"><div class="tool-h">📈 ④ 모델 맞추기와 모델 그래프 <span>자료는 점, 모델 A는 실선, 모델 B는 점선</span></div><div class="tool-b">
    ${["A","B"].map(k=>{ const m=M[k]||{}; return `<div class="mrow"><h4><span class="sw" style="background:var(${k==="A"?"--accent":"--modelB"})"></span>모델 ${k}</h4><div class="params">
      <label class="mini">형태<select id="t_models_${k}_t" data-p="models.${k}.t"${dis}>${FORMS.map(f=>`<option${m.t===f?" selected":""}>${f}</option>`).join("")}</select></label>
      ${["a","b","c","d","e","g"].map(p=>inp(`models.${k}.${p}`,m[p],"$"+p+"$"+(p==="e"?" (합성·합·배각·덧셈)":p==="g"?" (덧셈)":""),'inputmode="decimal"')).join("")}</div>
      <div class="formtpl" data-out="tpl${k}"></div><div class="formula" data-out="form${k}"></div><div class="sub" data-out="err${k}"></div></div>`; }).join("")}
    <div data-out="chartModel"></div>
    <div class="legend"><span><i></i>자료</span><span><span class="sw" style="background:var(--accent)"></span> 모델 A</span><span><span class="sw" style="background:var(--modelB)"></span> 모델 B</span></div>
    ${EG_HELP}
    ${ro?"":`<div class="logbtns"><button class="btn btnA" type="button" data-act="logTry" data-m="A">모델 A 값을 기록에 넣기</button><button class="btn btnB" type="button" data-act="logTry" data-m="B">모델 B 값을 기록에 넣기</button></div>`}
    <dl class="kv" data-out="cands"></dl></div></div>`;
  case "rate": { const xs=c.x||[]; return `<div class="ratedefs" data-out="rateDefs"></div><div class="tbl-wrap"><table class="t"><thead><tr><th>알아볼 순간</th><th>${tx("$x=a$ 값")}</th><th>${tx("손 계산 $f'(a)$")}</th><th>${tx("$f_A(a)$")}</th><th>${tx("$f_A'(a)$")}</th><th>${tx("$f_B(a)$")}</th><th>${tx("$f_B'(a)$")}</th></tr></thead><tbody>
    ${RATE_ROWS.map((r,i)=>`<tr><td class="lab"${tipAttr("s4_r"+i)}>${tx(r)}</td><td><div class="cell">${ro?`<div class="ro num">${esc(xs[i]||"")}</div>`:`<input class="num" id="t_calc_x_${i}" data-p="calc.x.${i}" value="${esc(xs[i]||"")}" placeholder=" " inputmode="decimal" aria-label="a 값">`}</div></td><td><div class="cell">${fieldHTML(doc,"s4_r"+i,"math",ro,"손 계산")}</div></td><td class="auto" data-out="r${i}f"></td><td class="auto" data-out="r${i}d"></td><td class="auto" data-out="r${i}bf"></td><td class="auto" data-out="r${i}b"></td></tr>`).join("")}
    </tbody></table></div>`; }
  case "riemann": return riemannHTML(doc,ro);
  case "errTable": return `<div class="tbl-wrap"><table class="t"><thead><tr><th>비교 항목</th><th>모델 A</th><th>모델 B</th></tr></thead><tbody data-out="errTable"></tbody></table></div><p class="rmse-ex">💡 ${esc(GLOSS.rmse)}</p>`;
  case "errChart": return `<div data-out="errChart"></div><div class="legend"><span><span class="sw" style="background:var(--accent);height:8px;width:8px"></span> 모델 A 오차</span><span><span class="sw" style="background:var(--modelB);height:8px;width:8px"></span> 모델 B 오차</span><span><span class="sw" style="background:var(--warn)"></span> ±1 기준선</span></div>`;
  case "submit": return `<div class="submitbox" data-out="submit"></div>`;
  } return ""; }

function updateOutputs(root,doc,owner){ const an=analyze(doc), $=s=>root.querySelectorAll(`[data-out="${s}"]`), put=(s,h)=>$(s).forEach(e=>e.innerHTML=h);
  const xl=axisLabel(doc,"x"), yl=axisLabel(doc,"y"), editing=root===app&&doc===me&&view==="student"&&!locked();
  put("chartData",chartSVG(an,{xl,yl,id:"d1"})); put("chartData2",chartSVG(an,{xl,yl,id:"d2"}));
  const f=an.feat; put("feat", f?`<dt>자료 개수</dt><dd>${f.n}</dd><dt>최댓값 (그때의 x)</dt><dd>${fmt(f.max)} (${fmt(f.maxX)})</dd><dt>최솟값 (그때의 x)</dt><dd>${fmt(f.min)} (${fmt(f.minX)})</dd><dt>${tx("변화 폭의 절반 ($a$ 후보)")}</dt><dd>${fmt(f.aC)}</dd><dt>${tx("가운데 값 ($d$ 후보)")}</dt><dd>${fmt(f.dC)}</dd><dt>${tx("$b$ 후보 $=\\dfrac{2\\pi}{T}$")}</dt><dd>${fmt(f.bC)}</dd>`:"");
  put("cands", f?`<dt>도구 특성표</dt><dd>${tx(`$a$ 후보 ${fmt(f.aC)} · $d$ 후보 ${fmt(f.dC)} · $b$ 후보 ${fmt(f.bC)}`)}</dd>`:"");
  put("chartModel",chartSVG(an,{xl,yl,models:true,id:"m1"}));
  ["A","B"].forEach(k=>{ const m=an[k], e=an["e"+k]; put("form"+k, m.ok?tx(`$${formulaTex(m)}$`):"a, b, c, d를 모두 넣으면 완성된 식이 나옵니다.");
    put("err"+k, e?`${term("mape","평균 오차율")} ${fmt(e.mean,2)}% · ${term("rmse","RMSE")} ${fmt(e.rmse,3)} <span class="sub">(평균적으로 ${fmt(e.rmse,3)}만큼 빗나감)</span>`:""); put("tpl"+k,tplHTML((doc.models||{})[k])); });
  const fx=(m,nm)=>m.ok?tx(`$${formulaTex(m).replace(/^y=/,nm+"(x)=")}$`):'<span class="sub">(아직 정하지 않음)</span>';
  put("rateDefs",`<div>${tx("$f_A(x)$")} <b>모델 A</b> · 3단계에서 정한 모델: ${fx(an.A,"f_A")}</div><div>${tx("$f_B(x)$")} <b>모델 B</b> · 비교용 다른 후보 또는 5단계에서 고친 모델: ${fx(an.B,"f_B")}</div><div class="sub">${tx("$f'$은 도함수(순간변화율), $f''$은 이계도함수입니다. $a$는 알아볼 순간의 $x$ 값입니다.")}</div>`);
  const xs=(doc.calc||{}).x||[];
  for(let i=0;i<4;i++){ const x=xs[i], ok=isNum(x); put(`r${i}f`,ok?fmt(fval(an.A,+x)):""); put(`r${i}d`,ok?fmt(fd1(an.A,+x)):""); put(`r${i}bf`,ok?fmt(fval(an.B,+x)):""); put(`r${i}b`,ok?fmt(fd1(an.B,+x)):""); }
  if($("rmGraph").length) riemannOutputs(root,doc,an,put);
  const eA=an.eA, eB=an.eB, cell=(e,fn)=>e?fn(e):"–";
  put("errTable",[[term("mape","평균 오차율")+" (%)",e=>fmt(e.mean,2)],["가장 큰 오차율 (%)과 그때의 x",e=>`${fmt(e.max,2)} (x = ${fmt(e.maxX)})`],[term("rmse","RMSE")+" · 평균적으로 빗나간 크기 (y 단위)",e=>fmt(e.rmse,3)],["평균 오차",e=>fmt(e.me,3)],["오차 (+) / (−) 개수",e=>`${e.pos} / ${e.neg}`]].map(([l,fn])=>`<tr><td class="lab">${l}</td><td class="auto">${cell(eA,fn)}</td><td class="auto">${cell(eB,fn)}</td></tr>`).join(""));
  put("errChart",chartSVG(an,{xl,residual:true,id:"e1"}));
  if($("derivF").length){ const [cf,cd]=derivCharts(doc,an); put("derivF",cf); put("derivD",cd); }
  // 자료 요약 자동 칸: 화면에 보여 주고, 학생 기록(ans)에도 넣어 보고서에 들어가게 합니다
  let autoChanged=false;
  root.querySelectorAll("[data-autoval]").forEach(e=>{ const k=e.dataset.autoval, v=autoVal(doc,AUTO_SRC[k],an); e.textContent=v||"–";
    if(editing&&(doc.ans[k]||"")!==v){ doc.ans[k]=v; autoChanged=true; } });
  if(autoChanged) scheduleSave();
  { const a=doc.ans||{}, v=(n,u,w)=>`<b>${esc(n||"(1단계에서 아직 정하지 않음)")}</b>${u?` <span class="sub">단위: ${esc(u)}</span>`:""}`;
    put("xyInfo",`<div><span class="xyk">x</span> 가로축 · 독립변인: ${v(a.s1_xn,a.s1_xu)}</div><div><span class="xyk y">y</span> 세로축 · 종속변인: ${v(a.s1_yn,a.s1_yu)}</div><div class="sub">1단계 ② 변인 정하기에서 쓴 내용이 연결됩니다. ${editing?`<button type="button" class="linkbtn" data-goto="vars">1단계에서 바꾸기 →</button>`:""}</div>`); }
  put("dgCount",`자료 <b class="${an.pts.length>=DATA_GOAL?"ok":"warn"}">${an.pts.length}</b>개 / 목표 ${DATA_GOAL}개 이상`);
  const F=(doc.files||{}).data; put("upData",F?`<div class="sub">✔ ${esc(F.name)} · ${kb(F.size)} · ${ago(F.at)}${ME&&ME.role==="teacher"&&F.url?` · <a href="${esc(F.url)}" target="_blank" rel="noopener">열기 ↗</a>`:""}</div>`:`<div class="sub">아직 올린 파일이 없습니다.</div>`);
  put("dash",dashHTML(doc)); put("files",filesHTML(doc));
  const T=doc.tools||{}; $("aibox").forEach(e=>e.classList.toggle("on",!!T.ai));
  root.querySelectorAll("[data-auto]").forEach(e=>{ const v=autoVal(doc,e.dataset.auto,an); e.innerHTML=v?tx(v):"–"; });
  root.querySelectorAll("[data-cardinfo]").forEach(e=>e.innerHTML=cardInfo(doc));
  root.querySelectorAll("[data-mathro]").forEach(e=>{ if(!e.dataset.done){ e.dataset.done=1; MathTool.renderInto(e,e.textContent); } });
  root.querySelectorAll("[data-prev]").forEach(pv=>{ const f=document.getElementById("f_"+pv.dataset.prev); if(f&&!pv.dataset.done){ pv.dataset.done=1; updPrev(f); } });
  $("submit").forEach(e=>e.innerHTML=submitHTML(doc));
  loadPhotos(root,owner); mathPass(root); }

const tmFmt=s=>{ s=Math.round(s||0); const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h?`${h}시간 ${m}분`:`${m}분`; };
const hhmm=t=>{ const d=new Date(t); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
const dayKey=(t=Date.now())=>{ const d=new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
function countEmpty(doc){ const a=doc.ans||{}; let n=0; STAGES.forEach((s,si)=>stageFields(si).forEach(k=>{ if(String(a[k]??"").trim()==="") n++; })); return n; }
function ringSVG(pct){ const r=34, C=2*Math.PI*r; return `<svg viewBox="0 0 84 84" width="84" height="84" aria-hidden="true"><defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient></defs><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--grid)" stroke-width="9"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct/100)).toFixed(1)}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)">${pct}%</text></svg>`; }
function dashHTML(doc){ const p=progress(doc), an=analyze(doc), avg=Math.round(p.reduce((a,b)=>a+b,0)/5*100), A=doc.act||{}, st=A.st||{};
  const keys=[-1,0,1,2,3,4], mx=Math.max(1,...keys.map(k=>st[k]||0)), logs=(A.log||[]).slice(-5).reverse();
  return `<div class="dash">
  <div class="dtop"><div class="dring">${ringSVG(avg)}<div><b>전체 작성률</b><small>${countEmpty(doc)}칸 남음 · ${doc.status==="submitted"?"제출함":"작성 중"}${doc.updatedAt?` · 저장 ${ago(doc.updatedAt)}`:""}</small></div></div>
  <div class="dbars">${STAGES.map((s,k)=>`<div><span>${k+1} ${SHORT[k]}</span><i><b style="width:${Math.round(p[k]*100)}%"></b></i><em>${Math.round(p[k]*100)}%</em></div>`).join("")}</div></div>

    <div><small>📊 자료 개수</small><b class="${an.pts.length>=DATA_GOAL?"ok":"warn"}">${an.pts.length}<em> / ${DATA_GOAL}</em></b><span>${an.pts.length>=DATA_GOAL?"목표 달성":"목표까지 "+(DATA_GOAL-an.pts.length)+"개"}</span></div>
    <div><small>🎯 모델 A 오차율</small><b class="acc">${an.eA?fmt(an.eA.mean,2)+"%":"–"}</b><span>${term("rmse","RMSE")} ${an.eA?fmt(an.eA.rmse,3):"–"}</span></div>
    <div><small>🔁 모델 B 오차율</small><b>${an.eB?fmt(an.eB.mean,2)+"%":"–"}</b><span>${term("rmse","RMSE")} ${an.eB?fmt(an.eB.rmse,3):"–"}</span></div>
  </div>
  <div class="dmodel"><small>모델 A</small>${an.A.ok?tx(`$${formulaTex(an.A)}$`):'<span class="sub">3단계에서 모델을 정하면 여기에 나타납니다</span>'}</div>
  <div class="dsplit"><div class="dbars dtime"><small>단계별 탐구 시간</small>${keys.map(k=>`<div><span>${k<0?"나의 수행":(k+1)+" "+SHORT[k]}</span><i><b style="width:${Math.round((st[k]||0)/mx*100)}%"></b></i><em>${tmFmt(st[k])}</em></div>`).join("")}</div>
  <div class="dlog"><small>최근 활동 기록</small>${logs.length?`<ul>${logs.map(s=>`<li><b>${new Date(s.s).getMonth()+1}/${new Date(s.s).getDate()} ${hhmm(s.s)}–${hhmm(s.e)}</b><span>탐구 ${tmFmt(s.x)} · 입력 ${tmFmt(s.i)}${s.n?` · <em>활동 없음 ${s.n}회 (${tmFmt(s.d)})</em>`:""}</span></li>`).join("")}</ul>`:'<p class="sub">아직 기록이 없습니다.</p>'}</div></div>
  </div>`; }

    ${pk.length?pk.map(k=>item("📷",`풀이 사진 · ${esc(fieldLabel(k))}`,`${kb(P[k].size)} · ${ago(P[k].at)} · 활동지(구글 문서·PDF)에 함께 들어갑니다`,P[k].url)).join(""):item("📷","풀이 사진 없음","4단계 풀이·계산 과정 칸의 [사진] 버튼으로 올릴 수 있습니다",null,"photo")}</ul>`; }

// 블록 하나 = 카드 하나. chart가 있으면 오른쪽에 그래프 카드를 붙이고, last는 맨 아래, 도움말은 그 앞에 둡니다.
function cardsHTML(doc,si,ro){ return STAGES[si].blocks.map((b,bi)=>{
  const cls=["card"]; if(b.chart) cls.push("c7"); if(b.help) cls.push("low","hint"); if(b.last) cls.push("last");
  let h=`<div class="${cls.join(" ")}">${blockHTML(doc,b,si,bi,ro)}</div>`;
  if(b.chart==="deriv") h+=`<div class="card c5 chartcard"><div class="card-h">📈 그래프로 보는 변화 <span>${tx("모델 A · 주황 = 변화율 표의 $x=a$와 접선")}</span></div>
    <div class="sub-h">${tx("$f(x)$ 모델 A와 자료")}</div><div data-out="derivF"></div><div class="sub-h">${tx("$f'(x)$ 도함수 (0보다 크면 증가, 작으면 감소)")}</div><div data-out="derivD"></div></div>`;
  return h; }).join(""); }
const lookStyle=si=>{ const L=STAGE_LOOK[si+1]; return `--g1:${L[0]};--g2:${L[1]}`; };
function stageHeadHTML(si,ro){ const L=STAGE_LOOK[si+1], s=si<0?null:STAGES[si];
  return `<div class="stage-head"><div class="sico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${L[2]}</svg></div>
  <div style="min-width:0"><div class="kicker">${si<0?"기초 자료":`STEP ${si+1} · 평가요소 ${esc(s.el)}`}</div><h2>${si<0?"나의 수행":`${si+1}단계 · ${esc(s.name)}`}</h2>
  <p>${si<0?"기본 정보 · 활동 대시보드 · 내 결과물 · 출처와 도구":`🎯 ${esc(s.goal)}`}${s?` <span class="time">⏱ ${esc(s.time)}</span>`:""}</p></div></div>`; }
function footNav(si){ return `<div class="foot-nav"><button class="btn" type="button" data-go="${si-1}"${si<0?" disabled":""}>${si===0?"← 나의 수행":"← 이전 단계"}</button><button class="btn pri" type="button" data-go="${si+1}"${si===4?" disabled":""}>${si<0?"1단계 시작하기 →":"다음 단계 →"}</button></div>`; }
function stageHTML(doc,si,ro){ return `<section class="stage" style="${lookStyle(si)}">${stageHeadHTML(si,ro)}<div class="bento">${cardsHTML(doc,si,ro)}</div>${ro?"":footNav(si)}</section>`; }
/** 도함수 카드용 작은 그래프. fn을 그리고 x=a 표시(marks)와 접선(tangent)을 덧그립니다. */
function plotSVG(o){ const W=520,H=190,L=46,R=10,Tp=10,B=26, x1=o.x1, x2=o.x2;
  const n=300, xs=[...Array(n+1)].map((_,i)=>x1+(x2-x1)*i/n), vs=xs.map(o.fn);
  let ys=vs.filter(v=>isFinite(v)).concat((o.pts||[]).map(p=>p.y)); if(!ys.length) return `<div class="empty-note">그릴 값이 없습니다.</div>`;
  ys.sort((a,b)=>a-b); let y1=ys[Math.floor(ys.length*.03)], y2=ys[Math.ceil(ys.length*.97)-1];
  if(o.zero){ y1=Math.min(y1,0); y2=Math.max(y2,0); } if(y1===y2){ y1-=1; y2+=1; } const yp=(y2-y1)*.12; y1-=yp; y2+=yp; const span=y2-y1;
  const sx=x=>L+(x-x1)/(x2-x1)*(W-L-R), sy=y=>Tp+(y2-y)/(y2-y1)*(H-Tp-B);
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}"><defs><clipPath id="cp${o.id}"><rect x="${L}" y="${Tp}" width="${W-L-R}" height="${H-Tp-B}"/></clipPath></defs>`;
  ticks(x1,x2,6).forEach(v=>{ const X=sx(v); g+=`<line class="gl" x1="${X}" x2="${X}" y1="${Tp}" y2="${H-B}"/><text x="${X}" y="${H-B+14}" text-anchor="middle">${fmt(v,3)}</text>`; });
  ticks(y1,y2,4).forEach(v=>{ const Y=sy(v); g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y}" y2="${Y}"/><text x="${L-6}" y="${Y+4}" text-anchor="end">${fmt(v,3)}</text>`; });
  if(o.zero&&y1<0&&y2>0) g+=`<line class="zero" x1="${L}" x2="${W-R}" y1="${sy(0)}" y2="${sy(0)}"/>`;
  let d="", prev=null; xs.forEach((x,i)=>{ const v=vs[i]; if(!isFinite(v)||Math.abs(v-(y1+y2)/2)>span*4||(prev!=null&&Math.abs(v-prev)>span*1.2)){ prev=isFinite(v)?v:null; if(isFinite(v)) d+=`M${sx(x).toFixed(1)},${sy(v).toFixed(1)}`; return; }
    d+=(prev==null?"M":"L")+sx(x).toFixed(1)+","+sy(v).toFixed(1); prev=v; });
  g+=`<path class="${o.cls}" d="${d}" clip-path="url(#cp${o.id})"/>`;
  (o.pts||[]).forEach(p=>{ g+=`<circle class="pt" cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="2.6" clip-path="url(#cp${o.id})"/>`; });
  (o.marks||[]).forEach(m=>{ if(!isFinite(m.y)) return; const X=sx(m.x);
    g+=`<line class="mk" x1="${X}" x2="${X}" y1="${Tp}" y2="${H-B}"/>`;
    if(o.tangent&&isFinite(m.s)){ const dx=(x2-x1)*.09; g+=`<line class="tg" x1="${sx(m.x-dx)}" y1="${sy(m.y-m.s*dx)}" x2="${sx(m.x+dx)}" y2="${sy(m.y+m.s*dx)}" clip-path="url(#cp${o.id})"/>`; }
    g+=`<circle class="mkp" cx="${X}" cy="${sy(m.y)}" r="4" clip-path="url(#cp${o.id})"/><text class="mkt" x="${X+4}" y="${Tp+11}">a=${fmt(m.x,3)}</text>`; });
  return g+`</svg>`; }
function derivCharts(doc,an){ const A=an.A; if(!A.ok) return ["",`<div class="empty-note">3단계에서 모델 A의 a, b, c, d를 정하면 f(x)와 f′(x) 그래프가 나타납니다.</div>`];
  let x1,x2; if(an.pts.length){ x1=Math.min(...an.pts.map(p=>p.x)); x2=Math.max(...an.pts.map(p=>p.x)); } else { x1=0; x2=12; } if(x1===x2){ x1-=1; x2+=1; }
  const xs=((doc.calc||{}).x||[]).filter(isNum).map(Number);
  return [plotSVG({id:"df",label:"모델 A 그래프",x1,x2,fn:x=>fval(A,x),cls:"ca",pts:an.pts,tangent:true,marks:xs.map(x=>({x,y:fval(A,x),s:fd1(A,x)}))}),
          plotSVG({id:"dd",label:"도함수 그래프",x1,x2,fn:x=>fd1(A,x),cls:"cd",zero:true,marks:xs.map(x=>({x,y:fd1(A,x)}))})]; }

/* ── 탐구 주제: 예시 자료를 고르거나 직접 씁니다 (예전 기록의 s1_card·탐구 제목도 읽음) ── */
function topicOf(doc){ const a=doc.ans||{}; if(a.s1_topic) return a.s1_topic; const c=CARDS.find(c=>c[0]===a.s1_card); if(c&&c[0]!=="J") return c[0]+" · "+c[1]; return (doc.info||{}).title||""; }
function cardOf(doc){ const m=topicOf(doc).match(/^([A-I]) · /); return m?CARDS.find(c=>c[0]===m[1]):null; }

/* ── 모델 형태별 식과 e·g 설명 ── */
const FORM_TEX={"사인":"y=a\\sin u+d","코사인":"y=a\\cos u+d","탄젠트형":"y=a\\tan u+d","시컨트형":"y=a\\sec u+d","코시컨트형":"y=a\\csc u+d","코탄젠트":"y=a\\cot u+d","아크탄젠트형":"y=a\\arctan u+d",
  "삼각함수의 합성":"y=a\\sin u+e\\cos u+d","두 삼각함수의 합":"y=a\\sin u+e\\sin 2u+d","배각 공식 활용":"y=a\\sin u+e\\cos 2u+d","반각 공식 활용":"y=a\\sin^2 u+d","사인·코사인파의 덧셈":"y=a\\sin u+e\\sin 2u+g\\sin 3u+d"};
function tplHTML(m){ m=m||{}; const t=m.t||"사인", E=USES_E.has(t), G=USES_G.has(t);
  return `형태: ${tx(`$${FORM_TEX[t]||""}$, $u=b(x-c)$`)} · 쓰는 문자: <b>a, b, c, d${E?", e":""}${G?", g":""}</b>${E?"":" <span class=\"sub\">(이 형태는 e, g를 쓰지 않으니 비워 둡니다)</span>"}`; }
const EG_HELP=`<details class="help eg"><summary>❓ e와 g는 무엇인가요? (예시 보기)</summary>
<p>${tx("$u=b(x-c)$일 때, 기본 물결 $a\\sin u$에 두 번째·세 번째 물결을 더하는 형태에서 그 물결의 크기(계수)를 $e$, $g$라고 합니다. 쓰지 않는 형태에서는 비워 두면 0으로 계산됩니다.")}</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>형태</th><th>식</th><th>e, g의 뜻</th><th>예시</th></tr></thead><tbody>

/** 직사각형 넓이의 합: Δx=(q−p)/n, 높이는 왼쪽·오른쪽·가운데 점의 함숫값 */
