<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모델링 탐구 수행평가</title>
<script src="config.js"></script>
<script src="mathtool.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: bento lab. Sticky stage bar (steps + one-line status), stage blocks as cards on a 12-column grid, formula dock at the bottom; teacher view = roster table + detail drawer. Calm indigo palette, soft 16px cards. */
:root{
  --bg:#F7F8FA; --paper:#FFFFFF; --ink:#14181F; --muted:#6B7380; --line:#E6E8EC; --grid:#EEF0F3;
  --accent:#4F46E5; --accent-ink:#FFFFFF; --accent-soft:#EEF0FF;
  --modelB:#D97706; --fill:#FAFAFB; --fill-line:#E6E8EC; --label:#F4F5F8;
  --good:#12A150; --warn:#B45309; --bad:#DC2626; --good-soft:#E7F6EE; --warn-soft:#FEF3E2; --bad-soft:#FDECEC;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-display:var(--f-body);
  --f-mono:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1117; --paper:#171A22; --ink:#E7E9EE; --muted:#9AA1AE; --line:#2A2F3A; --grid:#1F232C;
  --accent:#8B8CF8; --accent-ink:#0F1117; --accent-soft:#25274A;
  --modelB:#F5A524; --fill:#1C2029; --fill-line:#2A2F3A; --label:#1F232C;
  --good:#3DD68C; --warn:#F5A524; --bad:#F87171; --good-soft:#12301F; --warn-soft:#33260C; --bad-soft:#3A1717;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1117; --paper:#171A22; --ink:#E7E9EE; --muted:#9AA1AE; --line:#2A2F3A; --grid:#1F232C;
  --accent:#8B8CF8; --accent-ink:#0F1117; --accent-soft:#25274A;
  --modelB:#F5A524; --fill:#1C2029; --fill-line:#2A2F3A; --label:#1F232C;
  --good:#3DD68C; --warn:#F5A524; --bad:#F87171; --good-soft:#12301F; --warn-soft:#33260C; --bad-soft:#3A1717;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.25;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg)}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.savest{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.ok{background:var(--good)} .dot.wait{background:var(--warn)} .dot.err{background:var(--bad)}

.banner{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;background:var(--paper);font-size:14px}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.bad{background:var(--bad-soft);border-color:transparent}
.banner.info{background:var(--accent-soft);border-color:transparent}

/* student header card */
.idcard{margin-top:16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.idcard .full{grid-column:1/-1}
.idcard label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
@media (max-width:640px){.idcard{grid-template-columns:1fr 1fr}.idcard .title{grid-column:1/-1}}

/* stage tabs */
.tabs{margin-top:16px;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{flex:1 0 128px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tab small{font-size:11px;color:var(--muted);letter-spacing:.02em}
.tab strong{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.bar{height:4px;border-radius:2px;background:var(--grid);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);width:0}

/* symbol palette */
.syms{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,58px));z-index:4;margin-top:10px;background:var(--bg);padding-block:6px;display:flex;gap:4px;overflow-x:auto;align-items:center}
.syms span{font-size:12px;color:var(--muted);white-space:nowrap;margin-right:4px}
.syms button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:2px 8px;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.syms button.symtool{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--f-body);font-weight:700;margin-right:8px}

/* stage sheet */
.sheet{margin-top:8px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sheet-head{padding:16px 18px;border-bottom:1px solid var(--line);background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/16px 16px,var(--paper)}
.sheet-head h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:4px}
.goal{margin:8px 0 0;font-size:14px}
.blocks{padding:6px 18px 18px;display:flex;flex-direction:column;gap:18px}
.blk{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px;padding-top:14px;border-top:1px dashed var(--line)}
.blk:first-child{border-top:0}
.blk .no{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--accent);line-height:1.2}
.blk h3{margin:0;font-size:16px;font-weight:700}
.blk h3 .star{color:var(--warn);margin-right:4px}
.blk .hint{font-size:13px;color:var(--muted);margin:2px 0 0}
.blk .body{grid-column:2;min-width:0;display:flex;flex-direction:column;gap:8px;margin-top:6px}
@media (max-width:560px){.blk{grid-template-columns:26px minmax(0,1fr)}.blocks{padding-inline:12px}.sheet-head{padding-inline:12px}}

.row{display:grid;grid-template-columns:200px minmax(0,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.row+.row{margin-top:-9px;border-top-left-radius:0;border-top-right-radius:0}
.row .lab{background:var(--label);padding:8px 10px;font-size:13px;font-weight:500;border-right:1px solid var(--line)}
@media (max-width:560px){.row{grid-template-columns:1fr}.row .lab{border-right:0;border-bottom:1px solid var(--line)}}
.fld,.cell input,.cell textarea,.cell select{width:100%;border:0;background:var(--fill);padding:8px 10px;min-height:38px;resize:vertical;outline-offset:-2px}
textarea.fld{min-height:64px}
.fld.math,.cell .math{font-family:var(--f-mono);font-size:14px}
.fld:disabled,.cell :disabled{opacity:.75;cursor:not-allowed}
.ro{padding:8px 10px;min-height:38px;white-space:pre-wrap;word-break:break-word;background:var(--fill)}
.ro.empty{color:var(--muted);background:transparent;font-style:italic}
.ro.math{font-family:var(--f-mono);font-size:14px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:left;vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t th:last-child,table.t td:last-child{border-right:0}
table.t th{background:var(--label);font-weight:500;font-size:13px;padding:6px 10px;white-space:nowrap}
table.t td.lab{background:var(--label);padding:8px 10px;font-size:13px;min-width:130px}
table.t td.auto{padding:8px 10px;color:var(--muted);font-family:var(--f-mono);font-size:13px;min-width:110px}
table.t td .cell{min-width:120px}
.cell textarea{min-height:38px}

.autochip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.autochip code{font-family:var(--f-mono);color:var(--ink);background:var(--label);padding:1px 6px;border-radius:4px}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:12px;text-decoration:underline;text-underline-offset:2px}

.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.checks input{margin-top:5px;accent-color:var(--accent)}
details.help{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--bg);font-size:13px}
details.help summary{cursor:pointer;font-weight:500}
details.help ul{margin:6px 0 0;padding-left:18px}

/* tool panels (sheet replacement) */
.tool{border:1px solid var(--accent);border-radius:var(--r);overflow:hidden}
.tool-h{background:var(--accent-soft);padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool-h span{font-weight:400;color:var(--muted)}
.tool-b{padding:12px;display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px;align-items:center}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono)}
.mini{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.mini input,.mini select,.mini textarea{border:1px solid var(--fill-line);background:var(--fill);border-radius:5px;padding:5px 8px;font-size:14px;width:100%;min-width:0}
.mini textarea{font-family:var(--f-mono);min-height:120px}
.params{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media (max-width:640px){.params{grid-template-columns:repeat(4,minmax(0,1fr))}}
.params .mini:first-child{grid-column:span 2}
.mrow{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:6px}
.mrow h4{margin:0;font-size:13px;display:flex;gap:8px;align-items:center}
.sw{width:18px;height:3px;border-radius:2px;display:inline-block}
.formula{font-family:var(--f-mono);font-size:13px;background:var(--label);border-radius:4px;padding:4px 8px;word-break:break-all}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--grid)} .chart .ax{stroke:var(--line)} .chart text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.chart .lbl{font-family:var(--f-body);font-size:12px}
.chart .pt{fill:var(--ink)} .chart .ca{stroke:var(--accent);fill:none;stroke-width:2}
.chart .cb{stroke:var(--modelB);fill:none;stroke-width:2;stroke-dasharray:6 4}
.chart .ra{fill:var(--accent)} .chart .rb{fill:var(--modelB)} .chart .zero{stroke:var(--muted);stroke-dasharray:3 3}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin-right:5px;vertical-align:middle}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 12px;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.empty-note{font-size:13px;color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:6px}

.foot-nav{display:flex;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--bg)}
.submitbox{border:2px solid var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.fb{margin-top:16px;border:1px solid var(--good);background:var(--good-soft);border-radius:var(--r);padding:14px 16px}
.fb h3{margin:0 0 6px;font-size:15px}
.fbgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.fbgrid{grid-template-columns:1fr 1fr}}
.fbgrid div{background:var(--paper);border-radius:6px;padding:8px 10px;font-size:13px}
.fbgrid b{display:block;font-family:var(--f-mono);font-size:18px}

/* teacher */
.stats{margin-top:16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.stat small{font-size:12px;color:var(--muted)} .stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500}
.controls{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls input[type=search]{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 10px;min-width:0;flex:1 1 180px}
.controls select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 8px}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:var(--paper)}
.toggle input{accent-color:var(--bad)}
.roster{margin-top:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.roster table{border-collapse:collapse;width:100%;font-size:14px;min-width:820px}
.roster th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.roster td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.roster tr:last-child td{border-bottom:0}
.roster tbody tr{cursor:pointer}
.roster tbody tr:hover{background:var(--bg)}
.roster tbody tr[aria-selected="true"]{background:var(--accent-soft)}
.prog{display:flex;gap:3px}
.prog span{width:22px;height:8px;border-radius:2px;background:var(--grid);overflow:hidden;position:relative}
.prog span i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--label);color:var(--muted)}
.pill.sub{background:var(--good-soft);color:var(--good)} .pill.live{background:var(--warn-soft);color:var(--warn)}
.pill.graded{background:var(--accent-soft);color:var(--accent)}
.sub{font-size:12px;color:var(--muted)}
.detail{margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:900px){.detail{grid-template-columns:1fr}}
.grade{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,58px) + 10px)}
@media (max-width:900px){.grade{position:static}}
.grade h3{margin:0;font-size:15px}
.gitem{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line);padding-top:10px}
.gitem .q{font-size:12px;color:var(--muted)}
.gitem .sc{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.gitem .sc button{border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:1px 8px;font-family:var(--f-mono);font-size:13px}
.gitem .sc button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gitem input[type=number]{width:64px;border:1px solid var(--line);border-radius:5px;padding:2px 6px;background:var(--bg);font-family:var(--f-mono)}
.gitem textarea,.grade textarea{border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:var(--bg);min-height:52px;width:100%;resize:vertical;font-size:13px}
.total{font-family:var(--f-mono);font-size:22px}
.dhead{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.dhead h2{margin:0;font-size:18px;font-family:var(--f-display);font-weight:800}
.dtabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px}
.dtabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font-size:13px;white-space:nowrap}
.dtabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.loading{margin-top:40px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.seg button{transition:background .15s,border-color .15s}}

.auth{margin:32px auto 0;max-width:440px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.authform{display:flex;flex-direction:column;gap:10px}
.authform .mini input{font-size:15px;padding:8px 10px}
.autherr{margin:0;min-height:1.2em;font-size:13px;color:var(--bad)}
.userbox{display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:wrap}
.userbox .btn{padding:3px 10px;font-size:12px}
a.btn{color:var(--ink)}
.docbar{margin-top:12px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.docbar .grow{flex:1 1 220px;min-width:0;font-size:13px}
.docbar .grow small{display:block;color:var(--muted);font-size:12px}
.sharebox{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sharebox h3{margin:0;font-size:15px}
.sharebox ul{margin:0;padding-left:18px;font-size:14px}
.sharebox .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sharebox input{border:1px solid var(--line);background:var(--fill);border-radius:6px;padding:6px 10px;min-width:0;flex:1 1 220px}

/* ── 학생 화면: 단계 막대 + 한 줄 상황판 ── */
.top{background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(12px)}
.labbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,58px));z-index:4;margin:12px 0 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:8px 0;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.steps{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none;flex:none;max-width:100%}
.steps button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.steps button i{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.steps button.part i{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.steps button.done i{background:var(--good)}
.steps button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.steps button[aria-selected="true"] i{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.status{flex:1 1 320px;min-width:0;display:flex;align-items:center;gap:6px 14px;font-size:13px;color:var(--muted);white-space:nowrap;overflow-x:auto;scrollbar-width:none}

function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function getP(o,p){ return p.split(".").reduce((a,k)=>a==null?undefined:a[k],o); }
function setP(o,p,v){ const ks=p.split("."); let a=o; ks.slice(0,-1).forEach(k=>{ if(a[k]==null||typeof a[k]!=="object") a[k]={}; a=a[k]; }); a[ks[ks.length-1]]=v; }
function blankDoc(){ return {v:1,info:{},ans:{},data:{},models:{A:{t:"코사인"},B:{t:"사인"}},calc:{x:["","","",""]},checks:{},status:"draft"}; }
function axisLabel(doc,k){ const a=doc.ans||{}; const n=a["s1_"+k+"n"], u=a["s1_"+k+"u"]; return n?(u?`${n} (${u})`:n):k; }
function ago(t){ if(!t) return "–"; const s=(Date.now()-t)/1000; if(s<60) return "방금"; if(s<3600) return Math.floor(s/60)+"분 전"; if(s<86400) return Math.floor(s/3600)+"시간 전";
  const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function stageFields(si){ const out=[]; STAGES[si].blocks.forEach(b=>{ if(b.opt) return;
  (b.f||[]).forEach(f=>out.push(f[0])); if(b.table) b.table.rows.forEach(r=>r.slice(1).forEach(k=>out.push(k.split(":")[0]))); if(b.tool==="integral") {} }); return out; }
function progress(doc){ const a=doc.ans||{}, an=analyze(doc);
  return STAGES.map((s,si)=>{ const ks=stageFields(si); let have=ks.filter(k=>String(a[k]??"").trim()!=="").length, tot=ks.length;
    if(si===1){ tot++; if(an.pts.length>=12) have++; } if(si===2){ tot++; if(an.A.ok) have++; }
    if(si===3){ tot+=2; const c=doc.calc||{}; if((c.x||[]).some(isNum)) have++; if(isNum(c.p)&&isNum(c.q)) have++; }
    return tot?have/tot:0; }); }
function autoVal(doc,key,an){ an=an||analyze(doc); const f=an.feat;
  switch(key){ case "n": return f?String(f.n):""; case "xr": return f?`${fmt(f.x1)} ~ ${fmt(f.x2)}`:"";
    case "formA": return formulaText(an.A); case "formB": return formulaText(an.B);
    case "errAB": return an.eA&&an.eB?`${fmt(an.eA.mean,2)} → ${fmt(an.eB.mean,2)}`:"";
    case "rmseAB": return an.eA&&an.eB?`${fmt(an.eA.rmse,3)} → ${fmt(an.eB.rmse,3)}`:""; } return ""; }

/* ───────── 활동지 그리기 (학생 편집 / 교사 읽기 공용) ───────── */
function fieldHTML(doc,key,kind,ro,label){ const v=(doc.ans||{})[key]??""; const math=kind==="math"||kind==="longmath"; const long=kind==="long"||kind==="longmath";
  if(ro) return `<div class="ro${v?"":" empty"}${math?" math":""}"${v&&MathTool.hasMath(v)?" data-mathro":""}>${v?esc(v):"(비어 있음)"}</div>`;
  if(kind==="card") return `<select class="fld" id="f_${key}" data-p="ans.${key}" aria-label="${esc(label||key)}"><option value="">카드를 고르세요</option>${CARDS.map(c=>`<option value="${c[0]}"${v===c[0]?" selected":""}>${c[0]} · ${esc(c[1])} (${esc(c[3])})</option>`).join("")}</select>`;
  const box=long?`<textarea class="fld${math?" math":""}" id="f_${key}" data-p="ans.${key}" rows="${kind==="longmath"?4:2}" aria-label="${esc(label||key)}">${esc(v)}</textarea>`
    :`<input class="fld${math?" math":""}" id="f_${key}" data-p="ans.${key}" value="${esc(v)}" aria-label="${esc(label||key)}" autocomplete="off">`;
  const prev=`<div class="mt-prev" data-prev="${key}" aria-live="polite"></div>`;
  return math?`<div class="mt-wrap">${box}${MathTool.buttonHTML(key)}</div>${prev}`:(long?box+prev:box); }
// 수식 입력기: 칸 안의 $LaTeX$를 아래에 수식으로 그려 보여 줍니다
function updPrev(el){ const key=(el.dataset.p||"").replace(/^ans\./,""), pv=key&&app.querySelector(`[data-prev="${key}"]`); if(!pv) return;
  if(MathTool.hasMath(el.value)) MathTool.renderInto(pv,el.value); else pv.textContent=""; }
function hwRecognize(image){ return api("recognize",{image}).then(r=>r.latex||"").catch(e=>{ throw {userMessage:errMsg(e)}; }); }
function openMath(field,index,mode){ if(!field||locked()) return; MathTool.open(field,{index,mode,recognize:cfg.hw?hwRecognize:null}); }
function autoChip(key,auto,ro){ return `<div class="autochip">도구 값: <code data-auto="${auto}"></code>${ro?"":`<button class="linkbtn" data-fill="${key}" data-src="${auto}" type="button">이 값 넣기</button>`}</div>`; }
function cardInfo(doc){ const c=CARDS.find(c=>c[0]===(doc.ans||{}).s1_card); return c?`<div class="sub">현상: ${esc(c[1])} · 자료 얻는 곳: ${esc(c[2])} · 함수 형태: <b>${esc(c[3])}</b></div>`:""; }

function blockHTML(doc,b,si,bi,ro){
  if(b.help) return `<details class="help"><summary>💡 막히면 보세요 (감점 없음)</summary><ul>${b.help.map(h=>`<li>${esc(h)}</li>`).join("")}</ul></details>`;
  if(b.check) return `<div class="blk"><div class="no">✓</div><div><h3>${esc(b.check)}</h3></div><div class="body checks">${b.items.map(([k,t])=>`<label><input type="checkbox" id="c_${k}" data-p="checks.${k}"${(doc.checks||{})[k]?" checked":""}${ro?" disabled":""}> <span>${esc(t)}</span></label>`).join("")}</div></div>`;
  if(b.tool&&!b.n) return toolHTML(doc,b.tool,ro);
  let body="";
  if(b.tool) body+=toolHTML(doc,b.tool,ro);
  if(b.f) body+=b.f.map(([k,l,kind,o])=>`<div class="row"><div class="lab">${esc(l)}</div><div style="min-width:0">${fieldHTML(doc,k,kind,ro,l)}${o&&o.auto?autoChip(k,o.auto,ro):""}${kind==="card"?`<div data-cardinfo style="padding:4px 10px">${cardInfo(doc)}</div>`:""}</div></div>`).join("");
  if(b.table){ const t=b.table; body+=`<div class="tbl-wrap"><table class="t"><thead><tr>${t.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${t.rows.map(r=>`<tr><td class="lab">${esc(r[0])}</td>${r.slice(1).map(k=>{ const [key,kind]=k.split(":"); return `<td><div class="cell">${fieldHTML(doc,key,kind==="math"?"math":"long",ro,r[0])}</div></td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`; }
  return `<div class="blk"><div class="no">${esc(b.n)}</div><div><h3>${b.star?'<span class="star">★</span>':""}${esc(b.t)}</h3>${b.hint?`<p class="hint">${esc(b.hint)}</p>`:""}</div><div class="body">${body}</div></div>`; }

function toolHTML(doc,tool,ro){ const d=doc.data||{}, M=doc.models||{}, c=doc.calc||{}; const dis=ro?" disabled":"";
  const inp=(p,v,lab,extra="")=>`<label class="mini">${lab}<input id="t_${p.replace(/\./g,"_")}" data-p="${p}" value="${esc(v??"")}"${dis} ${extra} autocomplete="off"></label>`;
  switch(tool){
  case "data": return `<div class="tool"><div class="tool-h">📊 자료 입력과 그래프 <span>시트 1_자료입력 · 2_그래프와모델을 대신합니다</span></div><div class="tool-b">
    <div class="grid2"><div style="display:grid;gap:8px;align-content:start">
      <div class="grid2" style="gap:8px">${inp("data.x0",d.x0,"x 시작값 (비우면 1)",'inputmode="decimal"')}${inp("data.dx",d.dx,"x 간격 (비우면 1)",'inputmode="decimal"')}</div>
      <label class="mini">x 값 (간격이 일정하지 않을 때만. 한 줄에 하나, y 값과 같은 순서·같은 개수. 비워 두면 위의 시작값·간격으로 자동)<textarea id="t_data_xs" data-p="data.xs"${dis} rows="4">${esc(d.xs||"")}</textarea></label>
      <label class="mini">y 값 (한 줄에 하나, 또는 쉼표로 구분. 엑셀 열을 그대로 붙여 넣어도 됩니다)<textarea id="t_data_ys" data-p="data.ys"${dis} rows="8">${esc(d.ys||"")}</textarea></label>
      ${inp("models.T",M.T,"주기 T (오르내림이 반복될 때만)",'inputmode="decimal"')}
    </div><div style="min-width:0;display:grid;gap:8px;align-content:start"><div data-out="chartData"></div><dl class="kv" data-out="feat"></dl></div></div></div></div>`;
  case "chartData": return `<div data-out="chartData2"></div>`;
  case "model": return `<div class="tool"><div class="tool-h">📈 ④ 모델 맞추기와 모델 그래프 <span>자료는 점, 모델 A는 실선, 모델 B는 점선</span></div><div class="tool-b">
    ${["A","B"].map(k=>{ const m=M[k]||{}; return `<div class="mrow"><h4><span class="sw" style="background:var(${k==="A"?"--accent":"--modelB"})"></span>모델 ${k}</h4><div class="params">
      <label class="mini">형태<select id="t_models_${k}_t" data-p="models.${k}.t"${dis}>${FORMS.map(f=>`<option${m.t===f?" selected":""}>${f}</option>`).join("")}</select></label>
      ${["a","b","c","d","e","g"].map(p=>inp(`models.${k}.${p}`,m[p],p+(p==="e"?" (합성·합·배각·덧셈)":p==="g"?" (덧셈)":""),'inputmode="decimal"')).join("")}</div>
      <div class="formula" data-out="form${k}"></div><div class="sub" data-out="err${k}"></div></div>`; }).join("")}
    <div data-out="chartModel"></div>
    <div class="legend"><span><i></i>자료</span><span><span class="sw" style="background:var(--accent)"></span> 모델 A</span><span><span class="sw" style="background:var(--modelB)"></span> 모델 B</span></div>
    ${ro?"":`<div><button class="btn" type="button" data-act="logTry">지금 모델 A 값을 맞추기 기록에 넣기</button></div>`}
    <dl class="kv" data-out="cands"></dl></div></div>`;
  case "rate": { const xs=c.x||[]; return `<div class="tbl-wrap"><table class="t"><thead><tr><th>알아볼 순간</th><th>x₀</th><th>손 계산 f′(x₀) (단위)</th><th>도구 f′_A(x₀)</th><th>차이</th><th>f_A(x₀)</th><th>f″_A(x₀)</th><th>f′_B(x₀)</th></tr></thead><tbody>
    ${RATE_ROWS.map((r,i)=>`<tr><td class="lab">${esc(r)}</td><td><div class="cell">${ro?`<div class="ro num">${esc(xs[i]||"")}</div>`:`<input class="num" id="t_calc_x_${i}" data-p="calc.x.${i}" value="${esc(xs[i]||"")}" inputmode="decimal" aria-label="x₀">`}</div></td><td><div class="cell">${fieldHTML(doc,"s4_r"+i,"math",ro,"손 계산")}</div></td><td class="auto" data-out="r${i}d"></td><td class="auto" data-out="r${i}diff"></td><td class="auto" data-out="r${i}f"></td><td class="auto" data-out="r${i}dd"></td><td class="auto" data-out="r${i}b"></td></tr>`).join("")}
    </tbody></table></div>`; }
  case "integral": return `<div class="tool"><div class="tool-h">∫ 적분 구간과 도구 확인값 <span>시트 4_미분적분과 같은 계산</span></div><div class="tool-b">
    <div class="grid2" style="grid-template-columns:repeat(2,minmax(0,140px))">${inp("calc.p",c.p,"p (구간 시작)",'inputmode="decimal"')}${inp("calc.q",c.q,"q (구간 끝)",'inputmode="decimal"')}</div>
    <div class="tbl-wrap"><table class="t"><thead><tr><th>정적분</th><th>값</th><th>평균값 = 값 ÷ (q − p)</th></tr></thead><tbody data-out="integ"></tbody></table></div>
    <p class="sub" style="margin:0">사다리꼴 어림: x가 p 이상 q 이하인 이웃한 두 점마다 (y₁ + y₂) ÷ 2 × (x 간격)을 더한 값입니다.</p></div></div>`;
  case "errTable": return `<div class="tbl-wrap"><table class="t"><thead><tr><th>비교 항목</th><th>모델 A</th><th>모델 B</th></tr></thead><tbody data-out="errTable"></tbody></table></div>`;
  case "errChart": return `<div data-out="errChart"></div><div class="legend"><span><span class="sw" style="background:var(--accent);height:8px;width:8px"></span> 모델 A 오차</span><span><span class="sw" style="background:var(--modelB);height:8px;width:8px"></span> 모델 B 오차</span></div>`;
  case "submit": return `<div class="submitbox" data-out="submit"></div>`;
  } return ""; }

function updateOutputs(root,doc){ const an=analyze(doc), $=s=>root.querySelectorAll(`[data-out="${s}"]`), put=(s,h)=>$(s).forEach(e=>e.innerHTML=h);
  const xl=axisLabel(doc,"x"), yl=axisLabel(doc,"y");
  put("chartData",chartSVG(an,{xl,yl,id:"d1"})); put("chartData2",chartSVG(an,{xl,yl,id:"d2"}));
  const f=an.feat; put("feat", f?`<dt>자료 개수</dt><dd>${f.n}</dd><dt>최댓값 (그때의 x)</dt><dd>${fmt(f.max)} (${fmt(f.maxX)})</dd><dt>최솟값 (그때의 x)</dt><dd>${fmt(f.min)} (${fmt(f.minX)})</dd><dt>변화 폭의 절반 (a 후보)</dt><dd>${fmt(f.aC)}</dd><dt>가운데 값 (d 후보)</dt><dd>${fmt(f.dC)}</dd><dt>b 후보 = 2π ÷ T</dt><dd>${fmt(f.bC)}</dd>`:"");
  put("cands", f?`<dt>도구 특성표</dt><dd>a 후보 ${fmt(f.aC)} · d 후보 ${fmt(f.dC)} · b 후보 ${fmt(f.bC)}</dd>`:"");
  put("chartModel",chartSVG(an,{xl,yl,models:true,id:"m1"}));
  ["A","B"].forEach(k=>{ const m=an[k], e=an["e"+k]; put("form"+k, m.ok?esc(formulaText(m)):"a, b, c, d를 모두 넣으면 완성된 식이 나옵니다.");
    put("err"+k, e?`평균 오차율 ${fmt(e.mean,2)}% · RMSE ${fmt(e.rmse,3)}`:""); });
  const xs=(doc.calc||{}).x||[];
  for(let i=0;i<4;i++){ const x=xs[i], ok=isNum(x); const d1=ok?fd1(an.A,+x):NaN; put(`r${i}d`,ok?fmt(d1):""); put(`r${i}f`,ok?fmt(fval(an.A,+x)):""); put(`r${i}dd`,ok?fmt(fd2(an.A,+x)):""); put(`r${i}b`,ok?fmt(fd1(an.B,+x)):"");
    const h=(doc.ans||{})["s4_r"+i]; put(`r${i}diff`, ok&&isNum(h)&&!isNaN(d1)?fmt(+h-d1):""); }
  const c=doc.calc||{}, w=isNum(c.p)&&isNum(c.q)&&+c.q!==+c.p?(+c.q-+c.p):NaN;
  put("integ",[["모델 A",an.iA],["모델 B",an.iB],["자료 (사다리꼴 어림)",an.tr]].map(([l,v])=>`<tr><td class="lab">${l}</td><td class="auto">${fmt(v)}</td><td class="auto">${fmt(v/w)}</td></tr>`).join(""));
  const eA=an.eA, eB=an.eB, cell=(e,fn)=>e?fn(e):"–";
  put("errTable",[["평균 오차율 (%)",e=>fmt(e.mean,2)],["가장 큰 오차율 (%)과 그때의 x",e=>`${fmt(e.max,2)} (x = ${fmt(e.maxX)})`],["RMSE (y 단위)",e=>fmt(e.rmse,3)],["평균 오차",e=>fmt(e.me,3)],["오차 (+) / (−) 개수",e=>`${e.pos} / ${e.neg}`]].map(([l,fn])=>`<tr><td class="lab">${l}</td><td class="auto">${cell(eA,fn)}</td><td class="auto">${cell(eB,fn)}</td></tr>`).join(""));
  put("errChart",chartSVG(an,{xl,residual:true,id:"e1"}));
  if($("derivF").length){ const [cf,cd]=derivCharts(doc,an); put("derivF",cf); put("derivD",cd); }
  root.querySelectorAll("[data-auto]").forEach(e=>{ const v=autoVal(doc,e.dataset.auto,an); e.textContent=v||"–"; });
  root.querySelectorAll("[data-cardinfo]").forEach(e=>e.innerHTML=cardInfo(doc));
  root.querySelectorAll("[data-mathro]").forEach(e=>{ if(!e.dataset.done){ e.dataset.done=1; MathTool.renderInto(e,e.textContent); } });
  root.querySelectorAll("[data-prev]").forEach(pv=>{ const f=document.getElementById("f_"+pv.dataset.prev); if(f&&!pv.dataset.done){ pv.dataset.done=1; updPrev(f); } });
  $("submit").forEach(e=>e.innerHTML=submitHTML(doc)); }

// 블록 하나 = 카드 하나. chart가 있으면 오른쪽에 그래프 카드를 붙이고, last는 맨 아래, 도움말은 그 앞에 둡니다.
function cardsHTML(doc,si,ro){ return STAGES[si].blocks.map((b,bi)=>{
  const cls=["card"]; if(b.chart) cls.push("c7"); if(b.help) cls.push("low","hint"); if(b.last) cls.push("last");
  let h=`<div class="${cls.join(" ")}">${blockHTML(doc,b,si,bi,ro)}</div>`;
  if(b.chart==="deriv") h+=`<div class="card c5 chartcard"><div class="card-h">📈 그래프로 보는 변화 <span>모델 A · 주황 = 변화율 표의 x₀와 접선</span></div>
    <div class="sub-h">f(x) 모델 A와 자료</div><div data-out="derivF"></div><div class="sub-h">f′(x) 도함수 (0보다 크면 증가, 작으면 감소)</div><div data-out="derivD"></div></div>`;
  return h; }).join(""); }
function stageHTML(doc,si,ro){ const s=STAGES[si];
  return `<section class="stage"><div class="stage-head"><h2>${si+1}단계 · ${esc(s.name)}</h2><p>🎯 ${esc(s.goal)}</p>${ro?`<p>⏱ ${esc(s.time)} · 평가요소: ${esc(s.el)} (10점)</p>`:""}</div>
  <div class="bento">${cardsHTML(doc,si,ro)}</div>
  ${ro?"":`<div class="foot-nav"><button class="btn" type="button" data-go="${si-1}"${si===0?" disabled":""}>← 이전 단계</button><button class="btn pri" type="button" data-go="${si+1}"${si===4?" disabled":""}>다음 단계 →</button></div>`}</section>`; }
/** 도함수 카드용 작은 그래프. fn을 그리고 x₀ 표시(marks)와 접선(tangent)을 덧그립니다. */
function plotSVG(o){ const W=520,H=190,L=46,R=10,Tp=10,B=26, x1=o.x1, x2=o.x2;
  const n=300, xs=[...Array(n+1)].map((_,i)=>x1+(x2-x1)*i/n), vs=xs.map(o.fn);
  let ys=vs.filter(v=>isFinite(v)).concat((o.pts||[]).map(p=>p.y)); if(!ys.length) return `<div class="empty-note">그릴 값이 없습니다.</div>`;
  ys.sort((a,b)=>a-b); let y1=ys[Math.floor(ys.length*.03)], y2=ys[Math.ceil(ys.length*.97)-1];
  if(o.zero){ y1=Math.min(y1,0); y2=Math.max(y2,0); } if(y1===y2){ y1-=1; y2+=1; } const yp=(y2-y1)*.12; y1-=yp; y2+=yp; const span=y2-y1;
  const sx=x=>L+(x-x1)/(x2-x1)*(W-L-R), sy=y=>Tp+(y2-y)/(y2-y1)*(H-Tp-B);
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}"><defs><clipPath id="cp${o.id}"><rect x="${L}" y="${Tp}" width="${W-L-R}" height="${H-Tp-B}"/></clipPath></defs>`;
  ticks(x1,x2,6).forEach(v=>{ const X=sx(v); g+=`<line class="gl" x1="${X}" x2="${X}" y1="${Tp}" y2="${H-B}"/><text x="${X}" y="${H-B+14}" text-anchor="middle">${fmt(v,3)}</text>`; });
  ticks(y1,y2,4).forEach(v=>{ const Y=sy(v); g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y}" y2="${Y}"/><text x="${L-6}" y="${Y+4}" text-anchor="end">${fmt(v,3)}</text>`; });
  if(o.zero&&y1<0&&y2>0) g+=`<line class="zero" x1="${L}" x2="${W-R}" y1="${sy(0)}" y2="${sy(0)}"/>`;
  let d="", prev=null; xs.forEach((x,i)=>{ const v=vs[i]; if(!isFinite(v)||Math.abs(v-(y1+y2)/2)>span*4||(prev!=null&&Math.abs(v-prev)>span*1.2)){ prev=isFinite(v)?v:null; if(isFinite(v)) d+=`M${sx(x).toFixed(1)},${sy(v).toFixed(1)}`; return; }
    d+=(prev==null?"M":"L")+sx(x).toFixed(1)+","+sy(v).toFixed(1); prev=v; });
  g+=`<path class="${o.cls}" d="${d}" clip-path="url(#cp${o.id})"/>`;
  (o.pts||[]).forEach(p=>{ g+=`<circle class="pt" cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="2.6" clip-path="url(#cp${o.id})"/>`; });

    case "data": { const pts=an.pts, f=an.feat; if(!pts.length) return [auto([["측정 자료","(입력된 자료 없음)"]])];
      const parts=[]; for(let i=0;i<pts.length;i+=10){ const ch=pts.slice(i,i+10); parts.push({t:"table",cols:["번호",...ch.map((_,j)=>String(i+j+1))],rows:[["x",...ch.map(p=>fmt(p.x))],["y",...ch.map(p=>fmt(p.y))]]}); }
      parts.push(auto([["자료 개수",String(f.n)],["최댓값 (그때의 x)",`${fmt(f.max)} (${fmt(f.maxX)})`],["최솟값 (그때의 x)",`${fmt(f.min)} (${fmt(f.minX)})`],["주기 T",isNum(f.T)?fmt(f.T):"–"],["a 후보 · d 후보 · b 후보",`${fmt(f.aC)} · ${fmt(f.dC)} · ${fmt(f.bC)}`]])); return parts; }
    case "chartData": return [img(chartSVG(an,{xl,yl,id:"p1"}),"자료 점 그래프")];
    case "model": { const rows=[]; ["A","B"].forEach(k=>{ const m=an[k], raw=M[k]||{}, e=an["e"+k];
        rows.push([`모델 ${k} 식`,m.ok?formulaText(m):"(a, b, c, d를 모두 넣으면 식이 완성됩니다)"]);

      return [auto(rows),img(chartSVG(an,{xl,yl,models:true,id:"p2"}),"검은 점: 자료 · 파란 실선: 모델 A · 주황 점선: 모델 B")]; }
    case "rate": { const xs=c.x||[]; return [{t:"table",cols:["알아볼 순간","x₀","손 계산 f′(x₀)","도구 f′_A(x₀)","차이","f_A(x₀)","f″_A(x₀)","f′_B(x₀)"],fill:[1,2],
        rows:RATE_ROWS.map((r,i)=>{ const ok=isNum(xs[i]), d1=ok?fd1(an.A,+xs[i]):NaN, h=a["s4_r"+i];
          return [r,String(xs[i]||""),String(h||""),ok?fmt(d1):"",ok&&isNum(h)&&!isNaN(d1)?fmt(+h-d1):"",ok?fmt(fval(an.A,+xs[i])):"",ok?fmt(fd2(an.A,+xs[i])):"",ok?fmt(fd1(an.B,+xs[i])):""]; })}]; }
    case "integral": { const w=isNum(c.p)&&isNum(c.q)&&+c.q!==+c.p?(+c.q-+c.p):NaN;
      return [auto([["적분 구간 [p, q]",isNum(c.p)&&isNum(c.q)?`[${c.p}, ${c.q}]`:""]]),{t:"table",cols:["정적분","값","평균값 = 값 ÷ (q − p)"],rows:[["모델 A",an.iA],["모델 B",an.iB],["자료 (사다리꼴 어림)",an.tr]].map(([l,v])=>[l,fmt(v),fmt(v/w)])}]; }
    case "errTable": { const eA=an.eA, eB=an.eB, cell=(e,fn)=>e?fn(e):"–";
      return [{t:"table",cols:["비교 항목","모델 A","모델 B"],rows:[["평균 오차율 (%)",e=>fmt(e.mean,2)],["가장 큰 오차율 (%)과 그때의 x",e=>`${fmt(e.max,2)} (x = ${fmt(e.maxX)})`],["RMSE (y 단위)",e=>fmt(e.rmse,3)],["평균 오차",e=>fmt(e.me,3)],["오차 (+) / (−) 개수",e=>`${e.pos} / ${e.neg}`]].map(([l,fn])=>[l,cell(eA,fn),cell(eB,fn)])}]; }
    case "errChart": return [img(chartSVG(an,{xl,residual:true,id:"p3"}),"오차 = 실측 − 모델 · 파란색: 모델 A 오차 · 주황색: 모델 B 오차")];

  const stages=STAGES.map((s,si)=>{ const blocks=[];
    s.blocks.forEach(b=>{

const SVG_CSS=".gl{stroke:#E7EEEC}.ax{stroke:#D5DEDC}text{fill:#5A6B6F;font-size:11px;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}.lbl{font-size:12px}.pt{fill:#18272B}.ca{stroke:#0E6874;fill:none;stroke-width:2}.cb{stroke:#A65A16;fill:none;stroke-width:2;stroke-dasharray:6 4}.ra{fill:#0E6874}.rb{fill:#A65A16}.zero{stroke:#5A6B6F;stroke-dasharray:3 3}";
function svgToPng(svg){ return new Promise(res=>{ if(!/^<svg/.test(svg)) return res("");
  const s=svg.replace('<svg class="chart"','<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640"').replace(">",`><style>${SVG_CSS}</style><rect width="640" height="320" fill="#fff"/>`);
  const im=new Image(); im.onload=()=>{ try{ const cv=document.createElement("canvas"); cv.width=1280; cv.height=640; cv.getContext("2d").drawImage(im,0,0,1280,640); res(cv.toDataURL("image/png").split(",")[1]); }catch(e){ res(""); } };
  im.onerror=()=>res(""); im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s); }); }
/** 문서(구글 문서)를 만들거나 갱신합니다. pdf=true 이면 PDF(base64)도 받아 옵니다. 교사는 id로 학생을 지정합니다. */
async function makeDoc(doc,id,pdf,acct){ const {spec,svgs}=buildSpec(doc,acct), images=await Promise.all(svgs.map(svgToPng));
  // $LaTeX$ 수식은 그림으로 바꿔 보냅니다 → 문서에 깨지지 않게 들어가고, 그림의 대체 텍스트에 LaTeX 원문이 남습니다
  const texs=[]; JSON.stringify(spec,(k,v)=>{ if(typeof v==="string") MathTool.tokens(v).forEach(t=>texs.push(t.tex)); return v; });
  if(texs.length){ try{ const m=await MathTool.toImages(texs); spec.math={}; Object.keys(m).forEach(tex=>{ spec.math[tex]={i:images.length,w:m[tex].w,h:m[tex].h}; images.push(m[tex].b64); }); }catch(e){} }
  const p={spec,images}; if(id) p.id=id; return api(pdf?"pdf":"syncDoc",p); }
function saveB64(b64,name,type){ const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([u],{type})), a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),600000);
  const pl=document.getElementById("pdfLink"); if(pl) pl.innerHTML=`<a href="${url}" download="${esc(name)}" target="_blank" rel="noopener">내려받기가 시작되지 않으면 여기를 누르세요</a>`; }

  try{ const r=await api("save",{doc:body,summary}); me.updatedAt=r.updatedAt; if(r.reopenAt) me.reopenAt=r.reopenAt;
    const t=new Date(); setSave("ok",`저장됨 ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`); }
  catch(e){ if(e.error==="LOCKED"){ cfg.locked=true; setSave("err","마감되어 저장 안 됨"); if(view==="student") renderStudent(); }
    else if(e.error!=="SESSION"){ dirty=true; setSave("err","저장 실패 · 다시 시도 중"); saveTimer=setTimeout(flush,4000+Math.random()*3000); } }

  box.innerHTML=`<table><thead><tr><th>학번</th><th>이름</th><th>탐구 제목 · 카드</th><th>단계별 작성 (1~5)</th><th>자료</th><th>모델 A 오차율</th><th>상태</th><th>최근 저장</th><th>점수</th></tr></thead><tbody>
  ${rows.map(r=>`<tr data-sel="${esc(r.id)}" aria-selected="${r.id===sel}"><td class="num">${esc(r.sid)||"–"}</td><td>${esc(r.name)||'<span class="sub">이름 없음</span>'}<div class="sub">${esc(r.login)}</div></td>
  <td style="white-space:normal;min-width:180px">${esc(r.title)||'<span class="sub">제목 없음</span>'} ${(r.doc.ans||{}).s1_card?`<span class="pill">${esc(r.doc.ans.s1_card)}</span>`:""}</td>
  <td><div class="prog" title="${r.p.map((v,k)=>`${k+1}단계 ${Math.round(v*100)}%`).join(", ")}">${r.p.map(v=>`<span><i style="width:${Math.round(v*100)}%"></i></span>`).join("")}</div></td>
  <td class="num">${r.an.pts.length}</td><td class="num">${r.an.eA?fmt(r.an.eA.mean,1)+"%":"–"}</td>
  <td>${r.doc.status==="submitted"?'<span class="pill sub">제출함</span>':r.live?'<span class="pill live">작성 중</span>':r.upd?'<span class="pill">미제출</span>':'<span class="pill">시작 전</span>'}</td>
  <td class="sub">${ago(r.upd)}</td><td class="num">${r.total!=null?`${r.total}<span class="sub"> /40</span>`:"–"}${r.g&&r.g.released?' <span class="pill graded">공개</span>':""}</td></tr>`).join("")}</tbody></table>`; }
function gradeForm(){ const g=gradeDraft||{scores:{},notes:{}}; const sc=g.scores||{}, tot=[1,2,3,4].reduce((s,i)=>s+(isNum(sc["s"+i])?+sc["s"+i]:0),0);
  return `<h3>채점 <span class="total" id="gTot">${tot}</span><span class="sub"> / 40</span></h3>
  ${ELEMENTS.map((e,i)=>{ const k="s"+(i+1), v=sc[k]; return `<div class="gitem"><b style="font-size:14px">${esc(e[0])}</b><span class="q">${esc(e[1])}</span>
    <div class="sc">${[10,8,6,4,2].map(n=>`<button type="button" data-score="${k}" data-v="${n}" aria-pressed="${String(v)===String(n)}">${n}</button>`).join("")}<input type="number" min="0" max="10" step="1" id="g_${k}" data-gs="${k}" value="${esc(v??"")}" aria-label="${esc(e[0])} 점수"></div>
    <textarea id="g_n_${k}" data-gn="${k}" placeholder="이 평가요소에 대한 의견">${esc((g.notes||{})[k]||"")}</textarea></div>`; }).join("")}
  <label class="mini">종합 피드백<textarea id="g_overall" data-go2="1" style="min-height:80px">${esc(g.overall||"")}</textarea></label>
  <label class="toggle" style="justify-content:flex-start"><input type="checkbox" id="g_rel"${g.released?" checked":""} style="accent-color:var(--accent)"> 학생에게 점수와 피드백 보여 주기</label>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn pri" type="button" data-act="saveGrade">채점 저장</button><span class="sub" id="gMsg">${gradeDirty?"저장하지 않은 변경이 있습니다":(g.updatedAt?ago(g.updatedAt)+" 저장됨":"")}</span></div>`; }
function renderDetail(full){ const box=document.getElementById("detailBox"); if(!box) return; const s=sel&&roster.get(sel);
  if(!s){ box.innerHTML=roster.size?`<p class="sub" style="margin-top:12px">학생 줄을 누르면 활동지 전체와 채점 칸이 열립니다.</p>`:""; return; }
  const r=rowInfo(sel,s), doc=r.doc;
  const left=`<div style="min-width:0"><div class="dhead"><h2>${esc(r.name)||"이름 없음"}</h2><span class="num sub">${esc(r.sid)} · ${esc(r.login)}</span><span>${esc(r.title)}</span>
    ${docs[sel]?`<a class="btn" style="text-decoration:none" href="${esc(docs[sel].url)}" target="_blank" rel="noopener">구글 문서 열기 ↗</a>`:""}<button class="btn" type="button" data-act="docOne">${docs[sel]?"구글 문서 다시 만들기":"구글 문서 만들기"}</button>
    ${doc.status==="submitted"?`<span class="pill sub">제출함 · ${ago(doc.submittedAt)}</span><button class="btn" type="button" data-act="reopen">다시 고치게 열기</button>`:`<span class="pill${r.live?" live":""}">${r.live?"작성 중":r.upd?"미제출":"시작 전"} · ${ago(r.upd)}</span>`}</div>
    <div class="dtabs">${STAGES.map((st,k)=>`<button type="button" data-dst="${k}" aria-pressed="${k===selStage}">${k+1}. ${esc(st.name)} ${Math.round(r.p[k]*100)}%</button>`).join("")}</div>
    <div id="dStage">${stageHTML(doc,selStage,true)}</div></div>`;
  if(full||!document.getElementById("gradeBox")) box.innerHTML=`<div class="detail">${left}<aside class="grade" id="gradeBox">${gradeForm()}</aside></div>`;
  else box.querySelector(".detail > div").outerHTML=left;
  updateOutputs(document.getElementById("dStage"),doc); }
function selectStudent(id){ sel=id; selStage=0; gradeDirty=false; const g=grades[id]; gradeDraft=g?JSON.parse(JSON.stringify(g)):{scores:{},notes:{},overall:"",released:false};
  gradeDraft.scores=gradeDraft.scores||{}; gradeDraft.notes=gradeDraft.notes||{};
  renderRoster(); renderDetail(true); document.getElementById("detailBox").scrollIntoView({behavior:"smooth",block:"start"}); }
async function pollRoster(){ if(!ME||ME.role!=="teacher") return; try{ const r=await api("roster",{since:lastSince});
    const next=new Map(); r.students.forEach(s=>{ const prev=roster.get(s.id); next.set(s.id,Object.assign({},s,{doc:s.doc!==undefined?s.doc:(prev?prev.doc:null)})); });
    roster=next; grades=r.grades||{}; sheetUrl=r.sheetUrl||""; docs=r.docs||{}; folderUrl=r.folderUrl||""; lastSince=r.serverTime-15000;
    const oldLock=cfg.locked; cfg=Object.assign(cfg,r.config||{});
    const sl=document.getElementById("sheetLink"), shl=sheetLinkHTML(); if(sl&&sl.innerHTML!==shl) sl.innerHTML=shl;
    if(view!=="teacher"||tView!=="roster") return;
    if(!document.getElementById("rosterBox")) return renderTeacher();
    document.getElementById("statsBox").innerHTML=statsHTML(); const l=document.getElementById("lockT"); if(l&&oldLock!==cfg.locked) l.checked=cfg.locked;
    renderRoster(); if(sel) renderDetail(false);
  }catch(e){ if(e.error!=="SESSION") setSave("err","새로 고치지 못함 · 다시 시도 중"); } }
function teacherClick(t){
  if(t.dataset.tv){ tView=t.dataset.tv; renderTeacher(); return; }
  if(t.dataset.dst!=null){ selStage=+t.dataset.dst; renderDetail(false); return; }
  if(t.dataset.score){ gradeDraft.scores[t.dataset.score]=+t.dataset.v; gradeDirty=true; document.getElementById("g_"+t.dataset.score).value=t.dataset.v;
    t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===t))); updTotal(); return; }
  const act=t.dataset.act;
  if(act==="saveGrade") return saveGrade();
  if(act==="docOne"){ const id=sel, s=roster.get(id); if(!s||!s.doc){ alertMsg("아직 쓴 내용이 없습니다."); return; } t.disabled=true; t.textContent="만드는 중… (최대 1분)";
    makeDoc(s.doc,id,false,{sid:s.sid,name:s.name}).then(r=>{ docs[id]={url:r.url,at:r.docAt}; if(sel===id) renderDetail(false); }).catch(e=>{ t.disabled=false; t.textContent="구글 문서 만들기"; alertMsg(errMsg(e)); }); return; }
  if(act==="docAll") return docAll(t);
  if(act==="aiKeyGo"||act==="aiKeyOff"){ const key=act==="aiKeyOff"?"":document.getElementById("aiKey").value.trim(), er=document.getElementById("aiErr");
    if(act==="aiKeyGo"&&!key){ er.textContent="키를 넣어 주세요."; return; } t.disabled=true; er.textContent="저장하는 중…";
    api("setAiKey",{key}).then(r=>{ cfg=Object.assign(cfg,r.config||{}); renderShare(key?"손글씨 인식을 켰습니다. 학생 화면 미리보기에서 수식 입력기 → 손글씨로 시험해 보세요.":"손글씨 인식을 껐습니다."); }).catch(e=>{ t.disabled=false; er.textContent=errMsg(e); }); return; }
  if(act==="shareGo"){ const em=document.getElementById("shareEm").value.trim(), self=document.getElementById("shareSelf").checked, er=document.getElementById("shareErr"); t.disabled=true; er.textContent="공유하는 중…";
    api("shareFolder",{email:em,self}).then(r=>{ share=r; renderShare(em+" 계정에 폴더를 공유했습니다. 구글에서 초대 메일이 갑니다."); }).catch(e=>{ t.disabled=false; er.textContent=errMsg(e); }); return; }
  if(act==="reopen"){ t.disabled=true; api("reopen",{id:sel}).then(pollRoster).catch(e=>{ t.disabled=false; alertMsg(errMsg(e)); }); return; }
  if(act==="notice"){ const v=document.getElementById("noticeIn").value.trim(); api("setConfig",{notice:v}).then(r=>{ cfg=Object.assign(cfg,r.config); t.textContent="올렸습니다"; setTimeout(()=>t.textContent="공지 올리기",1500); }).catch(e=>alertMsg(errMsg(e))); return; }
  if(act==="accReset"){ accPending={id:t.dataset.id,kind:"reset"}; renderAccounts(); return; }
  if(act==="accDel"){ accPending={id:t.dataset.id,kind:"del"}; renderAccounts(); return; }
  if(act==="accCancel"){ accPending=null; renderAccounts(); return; }
  if(act==="accResetGo"){ const pw=document.getElementById("acc_pw").value; t.disabled=true;
    api("resetPw",{id:accPending.id,newPw:pw}).then(()=>{ accPending=null; loadAccounts(`${t.dataset.id} 계정의 비밀번호를 초기화했습니다. 학생에게 새 비밀번호를 알려 주세요. 다음 로그인 때 학생이 직접 바꿉니다.`); }).catch(e=>{ t.disabled=false; document.getElementById("accErr").textContent=errMsg(e); }); return; }
  if(act==="accDelGo"){ t.disabled=true; api("deleteAccount",{id:accPending.id}).then(()=>{ roster.delete(accPending.id); if(sel===accPending.id) sel=null; accPending=null; loadAccounts("계정과 기록을 지웠습니다."); }).catch(e=>{ t.disabled=false; document.getElementById("accErr").textContent=errMsg(e); }); return; }
}
function alertMsg(m){ setSave("err",m); }
async function loadAccounts(note){ try{ const r=await api("accounts"); accounts=r.accounts; renderAccounts(note); }catch(e){ const b=document.getElementById("accBox"); if(b) b.innerHTML=`<div class="banner bad">${esc(errMsg(e))}</div>`; } }

  const rows=accounts.slice().sort((a,c)=>(a.role===c.role?0:a.role==="teacher"?-1:1)||String(a.sid).localeCompare(String(c.sid),"ko",{numeric:true}));

  <div class="roster"><table><thead><tr><th>아이디</th><th>역할</th><th>학번</th><th>이름</th><th>가입</th><th>최근 로그인</th><th>비밀번호</th><th></th></tr></thead><tbody>

    <td>${a.mustChange?'<span class="pill live">초기화됨 · 바꾸기 전</span>':'<span class="sub">학생이 정함</span>'}</td>
    <td style="white-space:normal;min-width:220px">${a.id===ME.id?'<span class="sub">내 계정</span>':pend&&accPending.kind==="reset"?`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><input id="acc_pw" class="num" placeholder="임시 비밀번호 (4자 이상)" style="border:1px solid var(--line);border-radius:5px;padding:3px 6px;background:var(--fill);min-width:0;flex:1 1 120px"><button class="btn pri" type="button" data-act="accResetGo" data-id="${esc(a.id)}">초기화</button><button class="btn" type="button" data-act="accCancel">취소</button></div><div class="sub" id="accErr" style="color:var(--bad)"></div>`
      :pend&&accPending.kind==="del"?`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="sub">계정과 활동지 기록이 모두 지워집니다.</span><button class="btn danger" type="button" data-act="accDelGo">지우기</button><button class="btn" type="button" data-act="accCancel">취소</button></div><div class="sub" id="accErr" style="color:var(--bad)"></div>`
      :`<button class="btn" type="button" data-act="accReset" data-id="${esc(a.id)}">비밀번호 초기화</button> <button class="btn" type="button" data-act="accDel" data-id="${esc(a.id)}">삭제</button>`}</td></tr>`; }).join("")}</tbody></table></div>`;
  const pw=document.getElementById("acc_pw"); if(pw) pw.focus(); }
async function loadShare(note){ try{ share=await api("driveInfo"); renderShare(note); }catch(e){ const b=document.getElementById("shareBox"); if(b) b.innerHTML=`<div class="banner bad">${esc(errMsg(e))}</div>`; } }
function renderShare(note){ const b=document.getElementById("shareBox"); if(!b||!share) return; const mails=new Set(share.editors.map(x=>x.toLowerCase()));
  b.innerHTML=`${note?`<div class="banner info" style="margin:0 0 10px">${esc(note)}</div>`:""}
  <div class="sharebox"><h3>학생 결과물 공유 폴더</h3>

    <div class="row2"><a class="btn" style="text-decoration:none" href="${esc(share.url)}" target="_blank" rel="noopener">폴더 열기 ↗</a><span class="sub">소유자: ${esc(share.owner||"–")}</span></div>
    <b style="font-size:14px">폴더를 공유받은 계정 (편집 가능)</b><ul>${share.editors.length?share.editors.map(x=>`<li>${esc(x)}</li>`).join(""):"<li>소유자 외에는 없습니다</li>"}</ul>
    <b style="font-size:14px">가입한 교사</b><ul>${share.teachers.map(t=>`<li>${esc(t.name||t.id)} (${esc(t.id)}) · ${t.email?esc(t.email)+(mails.has(t.email.toLowerCase())?" ✓ 공유됨":" · 아직 공유 안 됨"):"이메일 없음 (아래에 내 이메일을 넣고 공유하세요)"}</li>`).join("")}</ul>
    <div class="row2"><input id="shareEm" type="email" placeholder="초대할 구글 계정 이메일" aria-label="초대할 이메일"><button class="btn pri" type="button" data-act="shareGo">폴더 공유하기</button><label class="toggle"><input type="checkbox" id="shareSelf"> 내 계정 이메일로도 기록</label></div>
    <div class="sub" id="shareErr" style="color:var(--bad)"></div></div>
  <div class="sharebox"><h3>학생 문서 한꺼번에 만들기</h3>
    <p class="sub" style="margin:0">학생이 로그인해서 쓰면 문서는 자동으로 만들어집니다. 이미 써 둔 내용의 문서가 아직 없을 때, 또는 지금 상태로 모두 새로 맞추고 싶을 때 누릅니다. 학생 한 명에 10~30초쯤 걸립니다.</p>
    <div class="row2"><button class="btn pri" type="button" data-act="docAll">모든 학생 문서 만들기·갱신</button><span class="sub" id="bulkMsg"></span></div></div>
  <div class="sharebox"><h3>손글씨 수식 인식 ${cfg.hw?'<span class="pill sub">켜짐</span>':'<span class="pill">꺼짐</span>'}</h3>
    <p class="sub" style="margin:0">학생이 수식 입력기의 [손글씨] 판에 쓴 수식을 Claude(AI)가 읽어 LaTeX로 바꿉니다. Anthropic API 키(console.anthropic.com에서 발급, 사용한 만큼 요금)를 넣으면 켜집니다. 키는 서버(스크립트 속성)에만 저장되고 화면에는 다시 보이지 않습니다. 학생에게 보내는 것은 손글씨 수식 그림뿐이며, 한 학생이 10분에 20번까지 쓸 수 있습니다.</p>
    <div class="row2"><input id="aiKey" type="password" autocomplete="off" placeholder="${cfg.hw?"새 키로 바꾸려면 입력":"sk-ant-…"}" aria-label="Anthropic API 키"><button class="btn pri" type="button" data-act="aiKeyGo">키 저장</button>${cfg.hw?'<button class="btn danger" type="button" data-act="aiKeyOff">끄기</button>':""}</div>
    <div class="sub" id="aiErr" style="color:var(--bad)"></div></div>`; }
async function docAll(btn){ const ids=[...roster.keys()].filter(id=>roster.get(id).doc), msg=document.getElementById("bulkMsg"); btn.disabled=true; let ok=0,bad=0;
  for(let k=0;k<ids.length;k++){ const id=ids[k], s=roster.get(id); if(msg) msg.textContent=`${k+1} / ${ids.length} 만드는 중… (${s.name||id})`;
    try{ const r=await makeDoc(s.doc,id,false,{sid:s.sid,name:s.name}); docs[id]={url:r.url,at:r.docAt}; ok++; }catch(e){ bad++; if(e.error==="SESSION") break; } }
  const m2=document.getElementById("bulkMsg"); if(m2) m2.textContent=`완료: ${ok}명 반영${bad?`, ${bad}명 실패(다시 눌러 보세요)`:""}${ids.length?"":"  쓴 내용이 있는 학생이 없습니다"}`; const b2=document.querySelector('[data-act="docAll"]'); if(b2) b2.disabled=false; }
function updTotal(){ const sc=gradeDraft.scores; const tot=[1,2,3,4].reduce((s,i)=>s+(isNum(sc["s"+i])?+sc["s"+i]:0),0); const e=document.getElementById("gTot"); if(e) e.textContent=tot; const m=document.getElementById("gMsg"); if(m) m.textContent="저장하지 않은 변경이 있습니다"; }
app.addEventListener("click",e=>{ if(view!=="teacher"||!ME) return; const tr=e.target.closest("tr[data-sel]"); if(tr) selectStudent(tr.dataset.sel); },true);
app.addEventListener("input",e=>{ if(view!=="teacher"||!ME) return; const t=e.target;
  if(t.id==="rq"){ rFilter=t.value; renderRoster(); return; }
  if(!gradeDraft) return;
  if(t.dataset.gs){ const v=t.value===""?"":Math.max(0,Math.min(10,+t.value)); gradeDraft.scores[t.dataset.gs]=v; gradeDirty=true; t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(String(v)===b.dataset.v))); updTotal(); }
  else if(t.dataset.gn){ gradeDraft.notes[t.dataset.gn]=t.value; gradeDirty=true; updTotal(); }
  else if(t.dataset.go2){ gradeDraft.overall=t.value; gradeDirty=true; updTotal(); } });
app.addEventListener("change",e=>{ if(view!=="teacher"||!ME) return; const t=e.target;
  if(t.id==="rs"){ rStatus=t.value; renderRoster(); }
  if(t.id==="lockT") api("setConfig",{locked:t.checked}).then(r=>{ cfg=Object.assign(cfg,r.config); }).catch(x=>{ t.checked=!t.checked; alertMsg(errMsg(x)); });
  if(t.id==="g_rel"&&gradeDraft){ gradeDraft.released=t.checked; gradeDirty=true; updTotal(); } });
async function saveGrade(){ if(!sel||!gradeDraft) return; const m=document.getElementById("gMsg"); if(m) m.textContent="저장하는 중…";
  try{ const r=await api("saveGrade",{id:sel,grade:JSON.parse(JSON.stringify(gradeDraft))}); gradeDraft.updatedAt=r.updatedAt; grades[sel]=JSON.parse(JSON.stringify(gradeDraft)); gradeDirty=false; if(m) m.textContent="저장했습니다"; renderRoster(); }
  catch(e){ if(m) m.textContent=errMsg(e); } }

/* ───────── 화면 전환 · 시작 ───────── */
function setView(v){ if(view==="student") flush(); view=v; document.getElementById("roleT").setAttribute("aria-pressed",String(v==="teacher")); document.getElementById("roleS").setAttribute("aria-pressed",String(v==="student"));
  if(v==="teacher") renderTeacher(); else renderStudent(); }
document.getElementById("roleT").onclick=()=>setView("teacher");
document.getElementById("roleS").onclick=()=>setView("student");
function measureTop(){ document.documentElement.style.setProperty("--toph",document.getElementById("top").offsetHeight+"px"); }
window.addEventListener("resize",measureTop); measureTop();
async function boot(){
  try{ const r=await api("config"); cfg=Object.assign(cfg,r.config||{}); }
  catch(e){ app.innerHTML=`<div class="banner bad" style="margin-top:24px"><b>${esc(errMsg(e))}</b><br><span class="sub">선생님 확인 사항: ① config.js의 apiUrl이 /exec로 끝나는 웹 앱 주소인지 ② 구글 Apps Script 배포의 액세스 권한이 '모든 사용자'인지 ③ 학교 Workspace 계정이 외부 접근을 막고 있지 않은지</span></div>`; setSave("err","연결 안 됨"); return; }
  if(TOKEN){ try{ await loadMe(); return; }catch(e){ setToken(null); } }
  renderAuth(); }
boot();

</script>
