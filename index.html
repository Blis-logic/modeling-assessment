<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼각함수·미적분 수학적 모델링 탐구</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%234F46E5%22/%3E%3Cpath d=%22M2 12c1.7-5 3.3-5 5 0s3.3 5 5 0 3.3-5 5 0 3.3 5 5 0%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222.2%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<script src="config.js?v=202610251327"></script>
<script src="mathtool.js?v=202610251327"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: bento lab. Sticky stage bar (steps + one-line status), stage blocks as cards on a 12-column grid, formula dock at the bottom; teacher view = roster table + detail drawer. Calm indigo palette, soft 16px cards. */
:root{
  --bg:#F7F8FA; --paper:#FFFFFF; --ink:#14181F; --muted:#6B7380; --line:#E6E8EC; --grid:#EEF0F3;
  --accent:#4F46E5; --accent-ink:#FFFFFF; --accent-soft:#EEF0FF;
  --modelB:#D97706; --fill:#FAFAFB; --fill-line:#E6E8EC; --label:#F4F5F8;
  --good:#12A150; --warn:#B45309; --bad:#DC2626; --good-soft:#E7F6EE; --warn-soft:#FEF3E2; --bad-soft:#FDECEC;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-display:var(--f-body);
  --f-mono:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1117; --paper:#171A22; --ink:#E7E9EE; --muted:#9AA1AE; --line:#2A2F3A; --grid:#1F232C;
  --accent:#8B8CF8; --accent-ink:#0F1117; --accent-soft:#25274A;
  --modelB:#F5A524; --fill:#1C2029; --fill-line:#2A2F3A; --label:#1F232C;
  --good:#3DD68C; --warn:#F5A524; --bad:#F87171; --good-soft:#12301F; --warn-soft:#33260C; --bad-soft:#3A1717;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1117; --paper:#171A22; --ink:#E7E9EE; --muted:#9AA1AE; --line:#2A2F3A; --grid:#1F232C;
  --accent:#8B8CF8; --accent-ink:#0F1117; --accent-soft:#25274A;
  --modelB:#F5A524; --fill:#1C2029; --fill-line:#2A2F3A; --label:#1F232C;
  --good:#3DD68C; --warn:#F5A524; --bad:#F87171; --good-soft:#12301F; --warn-soft:#33260C; --bad-soft:#3A1717;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.25;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg)}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.savest{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.ok{background:var(--good)} .dot.wait{background:var(--warn)} .dot.err{background:var(--bad)}

.banner{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;background:var(--paper);font-size:14px}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.bad{background:var(--bad-soft);border-color:transparent}
.banner.info{background:var(--accent-soft);border-color:transparent}
#sysBar{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:300;width:min(680px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px}
#sysBar[hidden]{display:none}
#sysBar .banner{margin:0;display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 24px rgba(15,23,42,.18);border:1px solid var(--line)}
#sysBar .banner>span{flex:1 1 260px}

/* student header card */
.idcard{margin-top:16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.idcard .full{grid-column:1/-1}
.idcard label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
@media (max-width:640px){.idcard{grid-template-columns:1fr 1fr}.idcard .title{grid-column:1/-1}}

/* stage tabs */
.tabs{margin-top:16px;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{flex:1 0 128px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tab small{font-size:11px;color:var(--muted);letter-spacing:.02em}
.tab strong{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.bar{height:4px;border-radius:2px;background:var(--grid);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);width:0}

/* symbol palette */
.syms{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,58px));z-index:4;margin-top:10px;background:var(--bg);padding-block:6px;display:flex;gap:4px;overflow-x:auto;align-items:center}
.syms span{font-size:12px;color:var(--muted);white-space:nowrap;margin-right:4px}
.syms button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:2px 8px;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.syms button.symtool{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-family:var(--f-body);font-weight:700;margin-right:8px}

/* stage sheet */
.sheet{margin-top:8px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sheet-head{padding:16px 18px;border-bottom:1px solid var(--line);background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/16px 16px,var(--paper)}
.sheet-head h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:4px}
.goal{margin:8px 0 0;font-size:14px}
.blocks{padding:6px 18px 18px;display:flex;flex-direction:column;gap:18px}
.blk{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px;padding-top:14px;border-top:1px dashed var(--line)}
.blk:first-child{border-top:0}
.blk .no{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--accent);line-height:1.2}
.blk h3{margin:0;font-size:16px;font-weight:700}
.blk h3 .star{color:var(--warn);margin-right:4px}
.blk .hint{font-size:13px;color:var(--muted);margin:2px 0 0}
.blk .body{grid-column:2;min-width:0;display:flex;flex-direction:column;gap:8px;margin-top:6px}
@media (max-width:560px){.blk{grid-template-columns:26px minmax(0,1fr)}.blocks{padding-inline:12px}.sheet-head{padding-inline:12px}}

.row{display:grid;grid-template-columns:200px minmax(0,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.row+.row{margin-top:-9px;border-top-left-radius:0;border-top-right-radius:0}
.row .lab{background:var(--label);padding:8px 10px;font-size:13px;font-weight:500;border-right:1px solid var(--line)}
@media (max-width:560px){.row{grid-template-columns:1fr}.row .lab{border-right:0;border-bottom:1px solid var(--line)}}
.fld,.cell input,.cell textarea,.cell select{width:100%;border:0;background:var(--fill);padding:8px 10px;min-height:38px;resize:vertical;outline-offset:-2px}
textarea.fld{min-height:64px}
.fld.math,.cell .math{font-family:var(--f-mono);font-size:14px}
.fld:disabled,.cell :disabled{opacity:.75;cursor:not-allowed}
.ro{padding:8px 10px;min-height:38px;white-space:pre-wrap;word-break:break-word;background:var(--fill)}
.ro.empty{color:var(--muted);background:transparent;font-style:italic}
.ro.math{font-family:var(--f-mono);font-size:14px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:left;vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t th:last-child,table.t td:last-child{border-right:0}
table.t th{background:var(--label);font-weight:500;font-size:13px;padding:6px 10px;white-space:nowrap}
table.t td.lab{background:var(--label);padding:8px 10px;font-size:13px;min-width:130px}
table.t td.auto{padding:8px 10px;color:var(--muted);font-family:var(--f-mono);font-size:13px;min-width:110px}
table.t td .cell{min-width:120px}
.cell textarea{min-height:38px}

.autochip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.autochip code{font-family:var(--f-mono);color:var(--ink);background:var(--label);padding:1px 6px;border-radius:4px}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:12px;text-decoration:underline;text-underline-offset:2px}

.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.checks input{margin-top:5px;accent-color:var(--accent)}
details.help{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--bg);font-size:13px}
details.help summary{cursor:pointer;font-weight:500}
details.help ul{margin:6px 0 0;padding-left:18px}

/* tool panels (sheet replacement) */
.tool{border:1px solid var(--accent);border-radius:var(--r);overflow:hidden}
.tool-h{background:var(--accent-soft);padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tool-h span{font-weight:400;color:var(--muted)}
.tool-b{padding:12px;display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px;align-items:center}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono)}
.mini{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.mini input,.mini select,.mini textarea{border:1px solid var(--fill-line);background:var(--fill);border-radius:5px;padding:5px 8px;font-size:14px;width:100%;min-width:0}
.mini textarea{font-family:var(--f-mono);min-height:120px}
.params{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding-bottom:2px}
.params .mini{flex:1 1 58px;min-width:58px}.params .mini.pform{flex:2 1 150px;min-width:140px}
.livef{margin-left:10px;color:var(--bad);font-size:15px;font-weight:600;overflow-x:auto;max-width:100%}
@media (max-width:640px){.params{flex-wrap:wrap;overflow:visible}.params .mini.pform{flex:1 1 100%}.params .mini{flex:1 1 52px;min-width:52px}}

.mrow{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:6px}
.mrow h4{margin:0;font-size:13px;display:flex;gap:8px;align-items:center}
.sw{width:18px;height:3px;border-radius:2px;display:inline-block}
.formula{font-family:var(--f-mono);font-size:13px;background:var(--label);border-radius:4px;padding:4px 8px;word-break:break-all}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--grid)} .chart .ax{stroke:var(--line)} .chart text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
.chart .lbl{font-family:var(--f-body);font-size:12px}
.chart .pt{fill:var(--ink)} .chart .ca{stroke:var(--accent);fill:none;stroke-width:2}
.chart .cb{stroke:var(--modelB);fill:none;stroke-width:2;stroke-dasharray:6 4}
.chart .ra{fill:var(--accent)} .chart .rb{fill:var(--modelB)} .chart .zero{stroke:var(--muted);stroke-dasharray:3 3}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);margin-right:5px;vertical-align:middle}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 12px;font-size:13px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.empty-note{font-size:13px;color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:6px}

.foot-nav{display:flex;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--bg)}
.submitbox{border:2px solid var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.fb{margin-top:16px;border:1px solid var(--good);background:var(--good-soft);border-radius:var(--r);padding:14px 16px}
.fb h3{margin:0 0 6px;font-size:15px}
.fbgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.fbgrid{grid-template-columns:1fr 1fr}}
.fbgrid div{background:var(--paper);border-radius:6px;padding:8px 10px;font-size:13px}
.fbgrid b{display:block;font-family:var(--f-mono);font-size:18px}

/* teacher */
.stats{margin-top:16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.stat small{font-size:12px;color:var(--muted)} .stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500}
.controls{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls input[type=search]{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 10px;min-width:0;flex:1 1 180px}
.controls select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 8px}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:var(--paper)}
.toggle input{accent-color:var(--bad)}
.roster{margin-top:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.roster table{border-collapse:collapse;width:100%;font-size:14px;min-width:820px}
.roster th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.roster td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.roster tr:last-child td{border-bottom:0}
.roster tbody tr{cursor:pointer}
.roster tbody tr:hover{background:var(--bg)}
.roster tbody tr[aria-selected="true"]{background:var(--accent-soft)}
.prog{display:flex;gap:3px}
.prog span{width:22px;height:8px;border-radius:2px;background:var(--grid);overflow:hidden;position:relative}
.prog span i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--label);color:var(--muted)}
.pill.sub{background:var(--good-soft);color:var(--good)} .pill.live{background:var(--warn-soft);color:var(--warn)}
.pill.graded{background:var(--accent-soft);color:var(--accent)}
.sub{font-size:12px;color:var(--muted)}
.detail{margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:900px){.detail{grid-template-columns:1fr}}
.grade{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,58px) + 10px)}
@media (max-width:900px){.grade{position:static}}
.grade h3{margin:0;font-size:15px}
.gitem{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line);padding-top:10px}
.gitem .q{font-size:12px;color:var(--muted)}
.gitem .sc{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.gitem .sc button{border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:1px 8px;font-family:var(--f-mono);font-size:13px}
.gitem .sc button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gitem input[type=number]{width:64px;border:1px solid var(--line);border-radius:5px;padding:2px 6px;background:var(--bg);font-family:var(--f-mono)}
.gitem textarea,.grade textarea{border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:var(--bg);min-height:52px;width:100%;resize:vertical;font-size:13px}
.total{font-family:var(--f-mono);font-size:22px}
.dhead{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.dhead h2{margin:0;font-size:18px;font-family:var(--f-display);font-weight:800}
.dtabs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;align-items:center;scrollbar-width:none}
.dtabs>span{flex:none;white-space:nowrap}
.dtabs button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font-size:13px;white-space:nowrap}
.dtabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.loading{margin-top:40px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.seg button{transition:background .15s,border-color .15s}}

.auth{margin:32px auto 0;max-width:440px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.authform{display:flex;flex-direction:column;gap:10px}
.authform .mini input{font-size:15px;padding:8px 10px}
.autherr{margin:0;min-height:1.2em;font-size:13px;color:var(--bad)}
.userbox{display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:wrap}
.userbox .btn{padding:3px 10px;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.userbox .btn .ic{width:14px;height:14px;flex:none}
/* 공지: 제목 옆 확성기 · 새 공지 팝업 · 교사 관리 */
.brand .iconbtn{margin-left:4px}
.brand .tl-long{font-size:inherit;color:inherit}
.iconbtn{position:relative;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--muted);flex:none;padding:0;cursor:pointer}
.iconbtn[hidden]{display:none}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.has{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.nbadge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:#EF4444;color:#fff;font:700 11px/18px var(--f-body);text-align:center;box-shadow:0 0 0 2px var(--paper)}
.nbadge[hidden]{display:none}
.ntm{position:fixed;inset:0;z-index:400;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:16px}
.ntm[hidden]{display:none}
.ntm-box{background:var(--paper);color:var(--ink);border-radius:16px;width:min(520px,100%);max-height:min(82vh,680px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(15,23,42,.35);overflow:hidden}
.ntm-head{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line)}
.ntm-head b{font-size:17px;flex:1}
.ntm-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#6366F1,#4F46E5 45%,#0EA5E9);color:#fff;flex:none}
.ntm-ico svg{width:18px;height:18px}
.ntm-x{border:0;background:transparent;font-size:24px;line-height:1;color:var(--muted);width:36px;height:36px;border-radius:8px;cursor:pointer}
.ntm-x:hover{background:var(--bg)}
.ntm-form{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.ntm-form textarea{width:100%;resize:vertical;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.ntm-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ntm-list{overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.ntm-item{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;background:var(--paper)}
.ntm-item p{margin:0;white-space:pre-wrap;word-break:break-word;font-size:15px}
.ntm-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);min-height:26px}
.ntm-meta .btn{margin-left:auto;padding:2px 10px;font-size:12px}
.ntm-meta .btn.danger{border-color:#EF4444;color:#EF4444}
.ntm-empty{margin:8px 0;text-align:center}
.ntm-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
a.btn{color:var(--ink)}
.docbar{margin-top:12px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.docbar .grow{flex:1 1 220px;min-width:0;font-size:13px}
.docbar .grow small{display:block;color:var(--muted);font-size:12px}
.sharebox{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sharebox h3{margin:0;font-size:15px}
.sharebox ul{margin:0;padding-left:18px;font-size:14px}
.sharebox .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sharebox input{border:1px solid var(--line);background:var(--fill);border-radius:6px;padding:6px 10px;min-width:0;flex:1 1 220px}

/* ── 학생 화면: 단계 막대 + 한 줄 상황판 ── */
.top{background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(12px)}
.labbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,58px));z-index:4;margin:12px 0 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:8px 0;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.steps{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none;flex:none;max-width:100%}
.steps button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.steps button i{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.steps button.part i{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.steps button.done i{background:var(--good)}
.steps button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.steps button[aria-selected="true"] i{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.status{flex:1 1 320px;min-width:0;display:flex;align-items:center;gap:6px 14px;font-size:13px;color:var(--muted);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.status b{color:var(--ink);font-weight:600}
.status .k{font-family:var(--f-mono);font-size:14px;color:var(--ink)}
.status .k.acc{color:var(--accent)}
.status .sep{width:1px;height:14px;background:var(--line);flex:none}
.metarow{margin-top:8px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:12px}
.metarow .idcard,.metarow .docbar{margin-top:0}
.idcard{border-radius:var(--r)}
.docbar{border-radius:var(--r);background:var(--paper);border-color:var(--line)}
@media (max-width:900px){.metarow{grid-template-columns:1fr}}

/* ── 단계 본문: 12칸 카드 격자 ── */
.stage{margin-top:14px}
.stage-head{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;padding:4px 2px 10px}
.stage-head h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
.stage-head p{margin:0;color:var(--muted);font-size:14px}
.bento{container-type:inline-size;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.card{grid-column:span 12;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card.c7{grid-column:span 7}.card.c5{grid-column:span 5}
.card.low{order:80}.card.last{order:90}
@container (max-width:760px){.card.c7,.card.c5{grid-column:span 12}}
.card .blk{border-top:0;padding-top:0}
.card .blk .no{font-family:var(--f-body);font-size:15px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;width:28px;height:28px;display:grid;place-items:center;line-height:1}
.card .blk h3{font-size:17px;line-height:28px}
.card>.tool{border:0;border-radius:0;margin:-18px -20px}
.card>.tool .tool-h{background:transparent;border-bottom:1px solid var(--line);padding:14px 20px;font-size:15px}
.card>.tool .tool-b{padding:16px 20px}
.card>details.help{border:0;padding:0;background:transparent}
.card.hint{background:linear-gradient(160deg,var(--accent-soft),var(--paper) 70%)}
.card-h{font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.card-h span{font-weight:400;font-size:12px;color:var(--muted)}
.chartcard .sub-h{font-size:12px;color:var(--muted);margin:10px 0 4px}
.chartcard .chart{border-radius:10px;background:var(--fill)}
.chart .cd{stroke:var(--good);fill:none;stroke-width:2}
.chart .mk{stroke:var(--warn);stroke-dasharray:3 4}
.chart .tg{stroke:var(--warn);stroke-width:2}
.chart .mkp{fill:var(--warn)}
.chart .mkt{fill:var(--warn);font-family:var(--f-mono);font-size:11px}
.stage .foot-nav{border:0;background:transparent;padding:16px 0 0}
.row{border-radius:12px}
.fld,.cell input,.cell textarea,.cell select{background:var(--fill)}
.fld:focus,.cell input:focus,.cell textarea:focus,.cell select:focus{outline:0;background:var(--paper);box-shadow:inset 0 0 0 2px var(--accent)}
.btn{border-radius:10px}
.tbl-wrap{border-radius:12px}

/* ── 아래 수식 키보드 ── */
.dock{position:sticky;bottom:max(10px,env(safe-area-inset-bottom,0px));z-index:4;margin-top:16px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(20,24,31,.12);padding:8px;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.dock .lab{font-size:12px;color:var(--muted);padding:0 6px;white-space:nowrap}
.dock button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;min-width:40px;height:38px;padding:0 9px;font:15px "KaTeX_Main","Times New Roman",serif}
.dock button:hover{border-color:var(--accent);background:var(--accent-soft)}
.dock button.big{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font:600 13px var(--f-body)}
.dock button.big.alt{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.dock button.big svg{width:17px;height:17px;vertical-align:-3px}

/* ── 제목·아이콘 ── */
.brand{flex-direction:row;align-items:center;gap:11px}
.brand .logo{width:40px;height:40px;flex:none;border-radius:12px;background:linear-gradient(135deg,#6366F1,#4F46E5 45%,#0EA5E9);display:grid;place-items:center;box-shadow:0 6px 16px -4px rgba(79,70,229,.55)}
.brand .logo svg{width:26px;height:26px}
.brand .bt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand b{font-family:var(--f-body);font-weight:700;font-size:19px;letter-spacing:-.02em;background:linear-gradient(90deg,#4F46E5,#7C3AED 55%,#0EA5E9);-webkit-background-clip:text;background-clip:text;color:transparent}
@media (max-width:560px){.brand b{font-size:16px}.brand .logo{width:34px;height:34px}}
/* ── 단계 머리: 색 그라데이션 + 아이콘 ── */
.stage-head{position:relative;display:flex;gap:16px;align-items:center;padding:20px 22px;margin:0 0 14px;border-radius:var(--r);color:#fff;background:linear-gradient(120deg,var(--g1),var(--g2));box-shadow:0 14px 30px -18px var(--g1);overflow:hidden}
.stage-head::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.stage-head .sico{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.stage-head .sico svg{width:32px;height:32px}
.stage-head .kicker{font-size:12px;letter-spacing:.06em;font-weight:600;opacity:.9}
.stage-head h2{margin:2px 0;color:#fff;font-size:27px;font-weight:800;letter-spacing:-.02em}
.stage-head p{margin:0;color:rgba(255,255,255,.92);font-size:14px}
.stage-head .time{display:inline-block;margin-left:6px;background:rgba(255,255,255,.2);border-radius:999px;padding:1px 9px;font-size:12px}
@media (max-width:560px){.stage-head{padding:16px}.stage-head h2{font-size:21px}.stage-head .sico{width:44px;height:44px}}
.steps button.home{font-weight:600}
/* ── 카드·소제목 강조 ── */
.card{position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--g1,#4F46E5),var(--g2,#0EA5E9))}
.card .blk .no{background:linear-gradient(135deg,var(--g1,#4F46E5),var(--g2,#0EA5E9));color:#fff;width:32px;height:32px;border-radius:10px;font-size:15px;box-shadow:0 4px 10px -4px var(--g1,#4F46E5)}
.card .blk h3{font-size:19px;font-weight:800;line-height:32px;letter-spacing:-.01em}
.card .blk h3 .star{color:#F59E0B}
.card .blk .hint{font-size:13.5px}
.row .lab,table.t td.lab{font-weight:700;color:var(--ink);background:linear-gradient(90deg,var(--accent-soft),var(--label));box-shadow:inset 3px 0 0 var(--g1,var(--accent))}
.row .lab[data-tip],table.t td.lab[data-tip]{cursor:help}
.tipi{display:inline-grid;place-items:center;width:16px;height:16px;margin-left:6px;border-radius:50%;background:var(--g1,var(--accent));color:#fff;font-size:10.5px;font-style:normal;font-weight:700;vertical-align:1px}
table.t th{font-weight:700;color:var(--ink)}
.tipbox{position:fixed;z-index:60;background:#14181F;color:#fff;font-size:13px;line-height:1.55;padding:10px 12px;border-radius:12px;box-shadow:0 14px 30px rgba(0,0,0,.28);pointer-events:none}
.tipbox .mt-f{color:#fff}
/* ── 아직 안 쓴 칸은 초록, 쓰면 흰색 ── */
.fld,.cell input,.cell textarea,.cell select,.mini input,.mini select,.dg input{background:var(--paper)}
.fld:placeholder-shown,.cell input:placeholder-shown,.cell textarea:placeholder-shown,.mini input:placeholder-shown,.dg input:placeholder-shown,select.fld.empty{background:var(--good-soft);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--good) 55%,transparent)}
.fld:focus,.cell input:focus,.cell textarea:focus,.mini input:focus,.dg input:focus{background:var(--paper)!important;box-shadow:inset 0 0 0 2px var(--accent)!important}
.mini input,.mini select{border-color:var(--line)}
.ro.autoval{background:var(--accent-soft);font-family:var(--f-mono);color:var(--ink)}
.ro.locked{background:var(--label);color:var(--ink);font-weight:600}
.linked{font-size:13.5px;background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.links{padding:4px 10px;font-size:13px;word-break:break-all}.links:empty{display:none}
/* ── 자료 입력표 ── */
.dgwrap{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:12px}
table.dg{border-collapse:collapse;width:100%;font-size:14px}
table.dg th{position:sticky;top:0;z-index:1;background:var(--label);font-size:12.5px;font-weight:700;padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
table.dg td{border-bottom:1px solid var(--line);padding:0}
table.dg td.rn{width:38px;text-align:center;color:var(--muted);font-family:var(--f-mono);font-size:12px;background:var(--label)}
table.dg input{width:100%;border:0;padding:7px 9px;font-family:var(--f-mono);font-size:14px;outline:0;min-width:0}
table.dg input::placeholder{color:color-mix(in srgb,var(--muted) 60%,transparent)}
.dg-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dgcount{font-size:13px;margin-left:auto}.dgcount b.ok,.dash b.ok{color:var(--good)}.dgcount b.warn,.dash b.warn{color:var(--warn)}
.upbox{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px;background:var(--bg)}
/* ── 풀이 사진 · AI 표시 ── */
.ph-btn{color:var(--g1,var(--accent))}
.phbox:empty{display:none}
.phbox{padding:8px 10px;display:grid;gap:6px}
.phimg img{max-width:100%;max-height:340px;border-radius:10px;border:1px solid var(--line);display:block}
.ainote{margin:6px 10px;padding:7px 10px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:12.5px;border-left:3px solid var(--warn)}
.aitag{border:1px solid var(--warn);background:var(--paper);color:var(--warn);border-radius:6px;padding:0 6px;font:700 12px var(--f-body);cursor:pointer}
.aibox{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--warn-soft);border:2px solid color-mix(in srgb,var(--warn) 45%,transparent);font-size:14px}
.aibox.on{border-color:var(--bad);background:color-mix(in srgb,var(--bad-soft) 70%,var(--warn-soft));box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 12%,transparent)}
.aibox b:first-child{font-size:15px;color:var(--bad)}
.aibox ol{margin:6px 0 0;padding-left:20px}
.aibox mark{background:#FDE68A;color:#14181F;border-radius:4px;padding:0 4px;font-weight:700}
.toolchk{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 10px;font-size:14px}
.toolchk label{display:flex;gap:6px;align-items:center}
.toolchk label.ai{font-weight:700;color:var(--bad)}
.toolchk input{accent-color:var(--accent)}
/* ── 대시보드 ── */
.dash{display:grid;gap:12px}
.dtop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.dring{display:flex;gap:10px;align-items:center}.dring b{display:block;font-size:15px}.dring small{color:var(--muted);font-size:12px}
.dbars{display:grid;gap:5px}
.dbars>div{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:12.5px}
.dbars i{height:8px;border-radius:4px;background:var(--grid);overflow:hidden;display:block}
.dbars i b{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#4F46E5,#0EA5E9)}
.dbars em{font-style:normal;font-family:var(--f-mono);color:var(--muted);text-align:right}
.dtime i b{background:linear-gradient(90deg,#10B981,#0EA5E9)}
.dtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dtiles>div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0}
.dtiles small{display:block;font-size:12px;color:var(--muted)}
.dtiles b{display:block;font-family:var(--f-mono);font-size:21px;font-weight:600;line-height:1.3}
.dtiles b.acc{color:var(--accent)}.dtiles b em{font-size:13px;color:var(--muted);font-style:normal}
.dtiles span{font-size:11.5px;color:var(--muted)}
.dmodel{background:var(--accent-soft);border-radius:12px;padding:8px 12px;overflow-x:auto;font-size:15px}.dmodel small{display:block;font-size:12px;color:var(--muted)}
.dsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.dsplit small{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.dlog ul{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:12.5px}
.dlog li{background:var(--bg);border-radius:8px;padding:5px 8px;display:grid}
.dlog li em{font-style:normal;color:var(--warn)}
@media (max-width:700px){.dtiles{grid-template-columns:1fr 1fr}.dsplit,.dtop{grid-template-columns:1fr}}
ul.files{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
ul.files li{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
ul.files li>div{flex:1;min-width:0}ul.files b{display:block;font-size:14px}ul.files small{font-size:12px;color:var(--muted)}
.fi{font-size:20px}
.ratedefs{display:grid;gap:4px;font-size:13.5px;background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-bottom:8px;overflow-x:auto}
.chart .lim{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:6 4}
.chart .limt{fill:var(--warn);font-size:11px}
.chart .band{fill:color-mix(in srgb,var(--warn) 9%,transparent)}

/* ── 수식 칸 (LaTeX 전용, 누르면 입력기) ── */
.mfield{display:flex;align-items:center;gap:8px;min-height:46px;padding:6px 10px;cursor:pointer;background:var(--paper);font-size:16px;overflow-x:auto}
.mfield.empty{background:var(--good-soft);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--good) 55%,transparent)}
.mfield:hover,.mfield:focus{outline:0;box-shadow:inset 0 0 0 2px var(--accent)}
.mfield .mshow{flex:1;min-width:0}.mfield .ph{color:var(--muted);font-size:13.5px}
.mfield .mhint{flex:none;display:inline-flex;align-items:center;gap:4px;color:var(--g1,var(--accent));font-size:12.5px;font-weight:700}
.cell .mfield{min-height:40px}
@container (max-width:330px){.mfield .mhint span{display:none}}
.cell{container-type:inline-size}
/* ── 탐구 주제 예시 ── */
details.examples{margin:6px 10px;font-size:13px}
details.examples summary{cursor:pointer;color:var(--accent);font-weight:600}
details.examples>div{display:grid;gap:6px;margin-top:6px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.exbtn{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 10px;font-size:13px;color:var(--ink)}
.exbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.exbtn b{color:var(--accent);margin-right:4px}.exbtn small{display:block;color:var(--muted);font-size:11.5px}
/* ── 모델 도구 ── */
.formtpl{font-size:13.5px;background:var(--bg);border-radius:8px;padding:6px 10px;overflow-x:auto}
.btn.btnA{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.btnB{background:var(--modelB);border-color:var(--modelB);color:#fff;font-weight:600}
.logbtns{display:flex;gap:8px;flex-wrap:wrap}
.term{border-bottom:1.5px dotted currentColor;cursor:help;font-weight:600}
.rmse-ex{margin:8px 0 0;font-size:13px;background:var(--accent-soft);border-radius:10px;padding:8px 12px}
details.eg table.t td{padding:7px 10px;font-size:13px;vertical-align:middle}
/* ── 결과물 목록 이동 ── */
ul.files li.go{cursor:pointer;border-style:dashed}
ul.files li.go:hover{border-color:var(--accent);background:var(--accent-soft)}
.gol{font-size:12.5px;font-weight:700;color:var(--accent);white-space:nowrap}
.flash{animation:flash 1.2s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 45%,transparent)}}
/* ── 구분구적법 탐구 ── */
.rm{display:grid;gap:12px}
.rm-head{display:flex;gap:12px;align-items:center}
.rm-ico{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;color:#fff;font:700 24px "KaTeX_Main",serif;background:linear-gradient(135deg,var(--g1),var(--g2))}
.rm-kicker{font-size:11.5px;letter-spacing:.06em;font-weight:700;color:var(--g1,var(--accent))}
.rm-head h4{margin:0;font-size:18px}.rm-head p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.rm-work{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}
@container (max-width:760px){.rm-work{grid-template-columns:1fr}}
.rm-graph,.rm-tools,.rm-guess{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg);display:grid;gap:8px;align-content:start;min-width:0}
.rm-top{display:flex;justify-content:space-between;align-items:center}
.rm-label{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.rm-live{font-size:11.5px;color:var(--good);display:flex;gap:5px;align-items:center}.rm-live i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.rm-fn{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.rm-badge{background:var(--accent);color:#fff;border-radius:8px;padding:1px 8px;font:700 13px var(--f-mono)}.rm-badge.b{background:var(--modelB)}
.rm-int{margin-left:auto;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:1px 8px;background:var(--paper)}
.rm-note{margin:0;font-size:12.5px;color:var(--muted)}
.rm-ctl{display:grid;gap:5px;font-size:13px}.rm-ctl>span{font-weight:600}
.rm-ctl.two{grid-template-columns:1fr 1fr;gap:8px}
.rm-ctl input[type=range]{width:100%;accent-color:var(--g1,var(--accent))}
.rm-range{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.rmseg{display:flex;gap:4px;flex-wrap:wrap}
.rmseg button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:6px 8px;font-size:13px;color:var(--ink)}
.rmseg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:transparent;font-weight:700}
.rm-sum{border-radius:12px;padding:10px 12px;background:var(--paper);border:2px solid color-mix(in srgb,var(--g1,var(--accent)) 40%,transparent);display:grid}
.rm-sum span{font-size:12.5px;color:var(--muted)}.rm-sum b{font:700 26px var(--f-mono);color:var(--g1,var(--accent))}.rm-sum small{font-size:11.5px;color:var(--muted)}
.rm-guess p{margin:0;font-size:13.5px}.rm-result{font-size:14px}.rm-result:empty{display:none}
.chart .rr{fill:color-mix(in srgb,var(--accent) 22%,transparent);stroke:var(--accent);stroke-width:.8}
.chart .rn{fill:color-mix(in srgb,var(--bad) 18%,transparent);stroke:var(--bad);stroke-width:.8}
.rrsw{background:color-mix(in srgb,var(--accent) 35%,transparent)!important;height:10px!important;width:14px!important;border:1px solid var(--accent)}
.xyinfo{display:grid;gap:4px;font-size:13.5px;background:var(--accent-soft);border-radius:12px;padding:9px 12px}
.xyk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--accent);color:#fff;font:700 12px var(--f-mono);margin-right:4px}.xyk.y{background:var(--modelB)}
.row.long{grid-template-columns:1fr}
.row.long>.lab{border-right:0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.labbtns{display:flex;gap:6px;flex-wrap:wrap}
.labbtns .mt-btn{border:1px solid var(--line);border-radius:9px;min-height:34px;padding:0 12px;background:var(--paper);font-size:13px}
.labbtns .mt-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.row.long textarea.fld{min-height:220px;font-size:15px}
.btn.submit-btn{border:2px solid var(--bad);color:var(--bad);background:var(--paper);font-weight:700;padding:8px 18px}
.btn.submit-btn:hover:not(:disabled){background:var(--bad-soft)}

  .steps button{padding:5px 7px;font-size:12px;gap:4px}
  .steps button i{width:6px;height:6px}
  .status{font-size:12px;gap:4px 10px;flex-basis:100%}

  .stage-head h2{font-size:20px}

  .bento{gap:10px}
  .card{padding:14px}

  .card .blk .body{grid-column:1/-1}

  .card .blk .no{width:28px;height:28px;font-size:13px;border-radius:8px}

  .dock{padding:5px;gap:4px;border-radius:12px}

  .ntm{padding:10px;align-items:end}
  .ntm-box{max-height:88vh;border-radius:16px}
}

/** 모델 식을 LaTeX로 (formulaText와 같은 모양) */
function formulaTex(m){ if(!m.ok) return ""; const n=v=>fmt(v,4).replace("−","-");
  const U=k=>`${k>1?k+"\\cdot ":""}${n(m.b)}\\left(x${m.c<0?"+"+n(-m.c):"-"+n(m.c)}\\right)`;
  const T=(coef,fn,k=1,first=false)=>{ const c=Math.abs(coef), s=coef<0?"-":(first?"":"+"); return `${s}${c===1?"":n(c)}\\${fn}\\left(${U(k)}\\right)`; };
  const fnm={"사인":"sin","코사인":"cos","탄젠트형":"tan","시컨트형":"sec","코시컨트형":"csc","코탄젠트":"cot","아크탄젠트형":"arctan"};
  let body;
  if(fnm[m.t]) body=T(m.a,fnm[m.t],1,true);
  else if(m.t==="삼각함수의 합성") body=T(m.a,"sin",1,true)+T(m.e,"cos");
  else if(m.t==="두 삼각함수의 합") body=T(m.a,"sin",1,true)+T(m.e,"sin",2);
  else if(m.t==="배각 공식 활용") body=T(m.a,"sin",1,true)+T(m.e,"cos",2);
  else if(m.t==="반각 공식 활용") body=T(m.a,"sin^2",1,true);
  else body=T(m.a,"sin",1,true)+T(m.e,"sin",2)+T(m.g,"sin",3);
  return `y=${body}${m.d<0?"-"+n(-m.d):"+"+n(m.d)}`; }

const tmFmt=s=>{ s=Math.round(s||0); const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h?`${h}시간 ${m}분`:`${m}분`; };
const hhmm=t=>{ const d=new Date(t); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };

    <div><small>🎯 모델 A 오차율</small><b class="acc">${an.eA?fmt(an.eA.mean,2)+"%":"–"}</b><span>${term("rmse","평균 제곱근 오차")} ${an.eA?fmt(an.eA.rmse,3):"–"}</span></div>

/** "$1.03$", "\\frac{3}{4}", "-2.5" 같은 칸 값 → 숫자 (아니면 NaN) */
function parseNum(v){ let s=String(v??"").trim().replace(/^\$|\$$/g,"").replace(/\\left|\\right|\s/g,"").replace(/−/g,"-");

const SVG_CSS=".gl{stroke:#E7EEEC}.ax{stroke:#D5DEDC}text{fill:#5A6B6F;font-size:11px;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}.lbl{font-size:12px}.pt{fill:#18272B}.ca{stroke:#0E6874;fill:none;stroke-width:2}.cb{stroke:#A65A16;fill:none;stroke-width:2;stroke-dasharray:6 4}.ra{fill:#0E6874}.rb{fill:#A65A16}.zero{stroke:#5A6B6F;stroke-dasharray:3 3}.rr{fill:#C7D2FE;stroke:#4F46E5;stroke-width:.8}.rn{fill:#FECACA;stroke:#DC2626;stroke-width:.8}.mk{stroke:#B45309;stroke-dasharray:3 4}.mkt{fill:#B45309;font-size:11px}.lim{stroke:#B45309;stroke-width:1.5;stroke-dasharray:6 4}.limt{fill:#B45309;font-size:11px}.band{fill:#FEF3E2}";
function svgToPng(svg){ return new Promise(res=>{ if(!/^<svg/.test(svg)) return res("");

/** 문서(구글 문서)를 만들거나 갱신합니다. pdf=true 이면 PDF(base64)도 받아 옵니다. 교사는 id로 학생을 지정합니다. */
async function makeDoc(doc,id,pdf,acct){ const built=buildSpec(doc,acct), svgs=built.svgs, images=await Promise.all(svgs.map(svgToPng));
  // 긴 수식은 +·− 자리에서 조각 그림 여러 개로 나눠(사이에 폭 없는 빈칸) 문서 칸 안에서 줄이 바뀌게 합니다
  const spec=JSON.parse(JSON.stringify(built.spec,(k,v)=>typeof v==="string"?v.replace(/\$([^$\n]+?)\$/g,(m,t)=>{ const ps=MathTool.splitLong(t.trim()); return ps.length>1?ps.map(p=>`$${p}$`).join("​"):m; }):v));

function saveB64(b64,name,type){ const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);

/* ───────── 활동 시간 기록 ─────────
 * 탐구 시간: 화면이 보이고 2분 안에 움직임(누르기·입력·스크롤)이 있었던 시간
 * 입력 시간: 1분 안에 글·수식을 입력한 시간
 * 활동 없음: 2분 넘게 움직임이 없으면 1회로 세고, 그동안의 시간을 따로 기록합니다(30분이 넘으면 기록을 멈춤). */
const ACT_TICK=15000, IDLE_MS=120000, INPUT_MS=60000;
let lastAct=Date.now(), lastInput=0, wasIdle=false, actChanged=false, lastMove=0;
function actMark(e){ lastAct=Date.now(); if(e&&(e.type==="input"||e.type==="keydown")) lastInput=lastAct; }
["pointerdown","keydown","input","wheel","touchstart","scroll"].forEach(t=>document.addEventListener(t,actMark,{passive:true,capture:true}));

function actTick(){ if(!ME||ME.role!=="student"||view!=="student"||cfg.locked) return;
  const now=Date.now(), A=me.act||(me.act={explore:0,input:0,st:{},days:{},log:[],idleN:0,idleSec:0}), sec=ACT_TICK/1000;
  const vis=document.visibilityState==="visible", active=vis&&now-lastAct<IDLE_MS, typing=vis&&now-lastInput<INPUT_MS;
  if(!active&&now-lastAct>30*60000) return;
  let s=A.log[A.log.length-1]; if(!s||now-s.e>10*60000){ s={s:now,e:now,x:0,i:0,n:0,d:0}; A.log.push(s); if(A.log.length>40) A.log.splice(0,A.log.length-40); }
  s.e=now;
  if(active){ A.explore+=sec; s.x+=sec; A.st[stage]=(A.st[stage]||0)+sec; const d=dayKey(); A.days[d]=(A.days[d]||0)+sec; if(typing){ A.input+=sec; s.i+=sec; } wasIdle=false; }
  else { if(!wasIdle){ s.n++; A.idleN=(A.idleN||0)+1; wasIdle=true; } s.d+=sec; A.idleSec=(A.idleSec||0)+sec; }
  actChanged=true;
  if(stage<0){ const d=app.querySelector('[data-out="dash"]'); if(d){ d.innerHTML=dashHTML(me); mathPass(d); } } }

/* ───────── 파일·사진 올리기 ───────── */
const fileCache={};
function pickFile(accept,cb){ const i=document.createElement("input"); i.type="file"; i.accept=accept; i.onchange=()=>{ if(i.files&&i.files[0]) cb(i.files[0]); }; i.click(); }
const blobB64=b=>new Promise((ok,no)=>{ const fr=new FileReader(); fr.onload=()=>ok(String(fr.result).split(",")[1]); fr.onerror=no; fr.readAsDataURL(b); });
/** 연습장 사진을 흑백으로 바꿔 50KB 이하 JPEG로 줄입니다(긴 변 최대 1400px에서 시작해 화질·크기를 낮춰 가며). */
async function compressPhoto(file){
  let src; try{ src=await createImageBitmap(file,{imageOrientation:"from-image"}); }catch(e){ src=await new Promise((ok,no)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=()=>no({error:"BAD_FILE"}); im.src=URL.createObjectURL(file); }); }
  const W0=src.width, H0=src.height; let side=Math.min(1400,Math.max(W0,H0));
  for(let t=0;t<14;t++){ const k=side/Math.max(W0,H0), w=Math.max(1,Math.round(W0*k)), h=Math.max(1,Math.round(H0*k));
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,w,h);
    cx.filter="grayscale(1) contrast(1.25) brightness(1.05)"; cx.drawImage(src,0,0,w,h);
    for(const q of [0.75,0.62,0.5,0.4,0.32]){ const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",q)); if(b&&b.size<=50*1024) return {b64:await blobB64(b),size:b.size,w,h}; }
    side=Math.round(side*0.82); if(side<260) break; }
  throw {error:"BIG_FILE"}; }
function uploadPhoto(key){ pickFile("image/*",async file=>{
  try{ setSave("wait","사진을 50KB 이하로 줄이는 중…"); const c=await compressPhoto(file);
    setSave("wait",`사진 올리는 중… (${kb(c.size)})`); const r=await api("upload",{kind:"photo",key,b64:c.b64});

  if(act==="accCancel"){ accPending=null; renderAccounts(); return; }
  if(act==="accResetGo"){ const pw=document.getElementById("acc_pw").value; t.disabled=true;
    api("resetPw",{id:accPending.id,newPw:pw}).then(()=>{ accPending=null; loadAccounts(`${t.dataset.id} 계정의 비밀번호를 초기화했습니다. 학생에게 새 비밀번호를 알려 주세요. 다음 로그인 때 학생이 직접 바꿉니다.`); }).catch(e=>{ t.disabled=false; document.getElementById("accErr").textContent=errMsg(e); }); return; }
  if(act==="accDelGo"){ t.disabled=true; api("deleteAccount",{id:accPending.id}).then(()=>{ roster.delete(accPending.id); if(sel===accPending.id) sel=null; accPending=null; loadAccounts("계정과 기록을 지웠습니다."); }).catch(e=>{ t.disabled=false; document.getElementById("accErr").textContent=errMsg(e); }); return; }
}
function alertMsg(m){ setSave("err",m); }
async function loadAccounts(note){ try{ const r=await api("accounts"); accounts=r.accounts; renderAccounts(note); }catch(e){ const b=document.getElementById("accBox"); if(b) b.innerHTML=`<div class="banner bad">${esc(errMsg(e))}</div>`; } }
function renderAccounts(note){ const b=document.getElementById("accBox"); if(!b||!accounts) return;
  const rows=accounts.slice().sort((a,c)=>(a.role===c.role?0:a.role==="teacher"?-1:1)||String(a.sid).localeCompare(String(c.sid),"ko",{numeric:true}));
  b.innerHTML=`${note?`<div class="banner info" style="margin:0 0 10px">${esc(note)}</div>`:""}
  <p class="sub" style="margin:0 0 8px">비밀번호는 암호화해 저장하므로 선생님도 볼 수 없습니다. 잊은 학생은 [비밀번호 초기화]로 임시 비밀번호를 정해 알려 주면, 학생이 다음 로그인 때 새 비밀번호로 바꿉니다.</p>
  <div class="roster"><table><thead><tr><th>아이디</th><th>역할</th><th>학번</th><th>이름</th><th>가입</th><th>최근 로그인</th><th>비밀번호</th><th></th></tr></thead><tbody>
  ${rows.map(a=>{ const pend=accPending&&accPending.id===a.id;
    return `<tr><td class="num">${esc(a.id)}</td><td>${a.role==="teacher"?'<span class="pill graded">교사</span>':"학생"}</td><td class="num">${esc(a.sid)}</td><td>${esc(a.name)}</td><td class="sub">${ago(a.created)}</td><td class="sub">${ago(a.lastLogin)}</td>
    <td>${a.mustChange?'<span class="pill live">초기화됨 · 바꾸기 전</span>':'<span class="sub">학생이 정함</span>'}</td>
    <td style="white-space:normal;min-width:220px">${a.id===ME.id?'<span class="sub">내 계정</span>':pend&&accPending.kind==="reset"?`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><input id="acc_pw" class="num" placeholder="임시 비밀번호 (4자 이상)" style="border:1px solid var(--line);border-radius:5px;padding:3px 6px;background:var(--fill);min-width:0;flex:1 1 120px"><button class="btn pri" type="button" data-act="accResetGo" data-id="${esc(a.id)}">초기화</button><button class="btn" type="button" data-act="accCancel">취소</button></div><div class="sub" id="accErr" style="color:var(--bad)"></div>`
      :pend&&accPending.kind==="del"?`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="sub">계정과 활동지 기록이 모두 지워집니다.</span><button class="btn danger" type="button" data-act="accDelGo">지우기</button><button class="btn" type="button" data-act="accCancel">취소</button></div><div class="sub" id="accErr" style="color:var(--bad)"></div>`
      :`<button class="btn" type="button" data-act="accReset" data-id="${esc(a.id)}">비밀번호 초기화</button> <button class="btn" type="button" data-act="accDel" data-id="${esc(a.id)}">삭제</button>`}</td></tr>`; }).join("")}</tbody></table></div>`;
  const pw=document.getElementById("acc_pw"); if(pw) pw.focus(); }
async function loadShare(note){ try{ share=await api("driveInfo"); renderShare(note); }catch(e){ const b=document.getElementById("shareBox"); if(b) b.innerHTML=`<div class="banner bad">${esc(errMsg(e))}</div>`; } }
function renderShare(note){ const b=document.getElementById("shareBox"); if(!b||!share) return; const mails=new Set(share.editors.map(x=>x.toLowerCase()));
  b.innerHTML=`${note?`<div class="banner info" style="margin:0 0 10px">${esc(note)}</div>`:""}
  <div class="sharebox"><h3>학생 결과물 공유 폴더</h3>
    <p class="sub" style="margin:0">학생마다 이 폴더 안에 <b>[학번_이름] 폴더</b>가 생기고, 그 안에 보고서 구글 문서(활동지 서식, 쓰고 20초쯤 뒤 반영)·원본 자료·풀이 사진·평가 결과 문서가 모입니다. 보고서는 반영됩니다. 교사로 가입하면서 쓴 이메일은 자동으로 이 폴더를 공유받고, 아래에서 더 초대할 수도 있습니다.</p>
    <div class="row2"><a class="btn" style="text-decoration:none" href="${esc(share.url)}" target="_blank" rel="noopener">폴더 열기 ↗</a><span class="sub">소유자: ${esc(share.owner||"–")}</span></div>
    <b style="font-size:14px">폴더를 공유받은 계정 (편집 가능)</b><ul>${share.editors.length?share.editors.map(x=>`<li>${esc(x)}</li>`).join(""):"<li>소유자 외에는 없습니다</li>"}</ul>
    <b style="font-size:14px">가입한 교사</b><ul>${share.teachers.map(t=>`<li>${esc(t.name||t.id)} (${esc(t.id)}) · ${t.email?esc(t.email)+(mails.has(t.email.toLowerCase())?" ✓ 공유됨":" · 아직 공유 안 됨"):"이메일 없음 (아래에 내 이메일을 넣고 공유하세요)"}</li>`).join("")}</ul>
    <div class="row2"><input id="shareEm" type="email" placeholder="초대할 구글 계정 이메일" aria-label="초대할 이메일"><button class="btn pri" type="button" data-act="shareGo">폴더 공유하기</button><label class="toggle"><input type="checkbox" id="shareSelf"> 내 계정 이메일로도 기록</label></div>
    <div class="sub" id="shareErr" style="color:var(--bad)"></div></div>
  <div class="sharebox"><h3>학생별 폴더로 정리</h3>
    <p class="sub" style="margin:0">예전에 만든 보고서 문서와 '탐구자료' 폴더의 파일을 학생마다 [학번_이름] 폴더로 옮기고, 채점한 학생은 평가 결과 문서를 만듭니다. 한 번만 누르면 됩니다(학생 수에 따라 1~3분).</p>
    <div class="row2"><button class="btn pri" type="button" data-act="organize">학생별 폴더로 정리</button><span class="sub" id="orgMsg"></span></div></div>
  <div class="sharebox"><h3>학생 문서 한꺼번에 만들기</h3>
    <p class="sub" style="margin:0">학생이 로그인해서 쓰면 문서는 자동으로 만들어집니다. 이미 써 둔 내용의 문서가 아직 없을 때, 또는 지금 상태로 모두 새로 맞추고 싶을 때 누릅니다. 학생 한 명에 10~30초쯤 걸립니다.</p>
    <div class="row2"><button class="btn pri" type="button" data-act="docAll">모든 학생 문서 만들기·갱신</button><span class="sub" id="bulkMsg"></span></div></div>`; }
async function docAll(btn){ const ids=[...roster.keys()].filter(id=>roster.get(id).doc), msg=document.getElementById("bulkMsg"); btn.disabled=true; let ok=0,bad=0;
  for(let k=0;k<ids.length;k++){ const id=ids[k], s=roster.get(id); if(msg) msg.textContent=`${k+1} / ${ids.length} 만드는 중… (${s.name||id})`;
    try{ const r=await makeDoc(s.doc,id,false,{sid:s.sid,name:s.name}); docs[id]={url:r.url,at:r.docAt}; ok++; }catch(e){ bad++; if(e.error==="SESSION") break; } }
  const m2=document.getElementById("bulkMsg"); if(m2) m2.textContent=`완료: ${ok}명 반영${bad?`, ${bad}명 실패(다시 눌러 보세요)`:""}${ids.length?"":"  쓴 내용이 있는 학생이 없습니다"}`; const b2=document.querySelector('[data-act="docAll"]'); if(b2) b2.disabled=false; }
function updTotal(){ const sc=gradeDraft.scores; const tot=[1,2,3,4].reduce((s,i)=>s+(isNum(sc["s"+i])?+sc["s"+i]:0),0); const e=document.getElementById("gTot"); if(e) e.textContent=tot; const m=document.getElementById("gMsg"); if(m) m.textContent="저장하지 않은 변경이 있습니다"; }
app.addEventListener("click",e=>{ if(view!=="teacher"||!ME) return; const tr=e.target.closest("tr[data-sel]"); if(tr) selectStudent(tr.dataset.sel); },true);
app.addEventListener("input",e=>{ if(view!=="teacher"||!ME) return; const t=e.target;
  if(t.id==="rq"){ rFilter=t.value; renderRoster(); return; }
  if(!gradeDraft) return;
  if(t.dataset.gs){ const v=t.value===""?"":Math.max(0,Math.min(10,+t.value)); gradeDraft.scores[t.dataset.gs]=v; gradeDirty=true; t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(String(v)===b.dataset.v))); updTotal(); }
  else if(t.dataset.gn){ gradeDraft.notes[t.dataset.gn]=t.value; gradeDirty=true; updTotal(); }
  else if(t.dataset.go2){ gradeDraft.overall=t.value; gradeDirty=true; updTotal(); } });
app.addEventListener("change",e=>{ if(view!=="teacher"||!ME) return; const t=e.target;
  if(t.id==="rs"){ rStatus=t.value; renderRoster(); }
  if(t.id==="lockT") api("setConfig",{locked:t.checked}).then(r=>{ cfg=Object.assign(cfg,r.config); }).catch(x=>{ t.checked=!t.checked; alertMsg(errMsg(x)); });
  if(t.id==="g_rel"&&gradeDraft){ gradeDraft.released=t.checked; gradeDirty=true; updTotal(); } });
async function saveGrade(){ if(!sel||!gradeDraft) return; const m=document.getElementById("gMsg"); if(m) m.textContent="저장하는 중…";
  try{ const r=await api("saveGrade",{id:sel,grade:JSON.parse(JSON.stringify(gradeDraft))}); gradeDraft.updatedAt=r.updatedAt; grades[sel]=JSON.parse(JSON.stringify(gradeDraft)); gradeDirty=false; if(m) m.textContent="저장했습니다"; renderRoster(); }
  catch(e){ if(m) m.textContent=errMsg(e); } }

/* ───────── 화면 전환 · 시작 ───────── */
function setView(v){ if(view==="student") flush(); view=v; document.getElementById("roleT").setAttribute("aria-pressed",String(v==="teacher")); document.getElementById("roleS").setAttribute("aria-pressed",String(v==="student"));
  if(v==="teacher") renderTeacher(); else renderStudent(); }
document.getElementById("roleT").onclick=()=>setView("teacher");
document.getElementById("roleS").onclick=()=>setView("student");
function measureTop(){ document.documentElement.style.setProperty("--toph",document.getElementById("top").offsetHeight+"px"); }
window.addEventListener("resize",measureTop); measureTop();
async function boot(){
  try{ const r=await api("config"); cfg=Object.assign(cfg,r.config||{}); }
  catch(e){ app.innerHTML=`<div class="banner bad" style="margin-top:24px"><b>${esc(errMsg(e))}</b><br><span class="sub">선생님 확인 사항: ① config.js의 apiUrl이 /exec로 끝나는 웹 앱 주소인지 ② 구글 Apps Script 배포의 액세스 권한이 '모든 사용자'인지 ③ 학교 Workspace 계정이 외부 접근을 막고 있지 않은지</span></div>`; setSave("err","연결 안 됨"); return; }
  if(TOKEN){ try{ await loadMe(); return; }catch(e){ setToken(null); } }
  renderAuth(); }
boot();

</script>
</body>
